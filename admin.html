<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administrador | CAROLA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8fb;
      color: #222;
    }

    header {
      text-align: center;
      padding: 35px 20px 25px;
      background: white;
      border-bottom: 1px solid #f3dce6;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 9px;
    }

    header p {
      margin: 8px 0 0;
      color: #888;
    }

    main {
      width: min(1000px, 92%);
      margin: 35px auto 80px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 13px;
      font-size: 16px;
    }

    .file-box {
      margin-top: 20px;
      border: 2px dashed #ecc5d5;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      background: #fffafb;
    }

    .file-box input {
      display: none;
    }

    .preview {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .preview img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
    }

    .count {
      text-align: center;
      color: #888;
      margin: 12px 0;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    .upload-button {
      width: 100%;
      background: #171717;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      margin-top: 10px;
    }

    .upload-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      display: none;
      padding: 17px;
      margin-top: 18px;
      border-radius: 14px;
      line-height: 1.5;
    }

    #status.success {
      display: block;
      background: #eaf8ef;
      color: #176b36;
    }

    #status.error {
      display: block;
      background: #fff0f0;
      color: #a32d2d;
    }

    .catalog-section {
      margin-top: 55px;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .catalog-header h2 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .catalog-header p {
      color: #888;
      margin: 0;
    }

    .refresh {
      padding: 11px 17px;
      border-radius: 12px;
      background: #f5e6ed;
      color: #222;
    }

    #models {
      display: grid;
      gap: 18px;
    }

    .model-card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.045);
    }

    .model-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 17px;
    }

    .model-title h3 {
      margin: 0;
      font-size: 24px;
    }

    .model-id {
      color: #aaa;
      font-size: 13px;
    }

    .variant {
      border-top: 1px solid #eee;
      padding: 18px 0 4px;
    }

    .variant:first-of-type {
      border-top: 0;
    }

    .variant-info {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .color-name {
      font-weight: 700;
      text-transform: capitalize;
    }

    .photo-count {
      color: #888;
      font-size: 14px;
    }

    .photos {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 13px 0 4px;
    }

    .photos img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      flex: 0 0 auto;
      background: #f5f5f5;
    }

    .empty {
      background: white;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      color: #888;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 35px;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 30px;
    }

    @media (max-width: 600px) {
      main {
        width: 94%;
      }

      .card {
        padding: 20px;
      }

      .catalog-header {
        align-items: center;
      }

      .catalog-header h2 {
        font-size: 26px;
      }

      .model-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">CAROLA</div>
    <p>Administrador de catálogo</p>
  </header>

  <main>

    <section class="card">

      <h2>Agregar fotografías</h2>

      <label for="modelo">
        Modelo
      </label>

      <input
        id="modelo"
        type="text"
        placeholder="Ej. 565"
        autocomplete="off"
      >

      <label for="color">
        Color
      </label>

      <input
        id="color"
        type="text"
        placeholder="Ej. negro"
        autocomplete="off"
      >

      <label
        class="file-box"
        for="imagenes"
      >
        📷 Seleccionar fotografías

        <input
          id="imagenes"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          multiple
        >
      </label>

      <div
        id="preview"
        class="preview"
      ></div>

      <div
        id="count"
        class="count"
      >
        Ninguna fotografía seleccionada
      </div>

      <button
        id="uploadButton"
        class="upload-button"
        type="button"
      >
        Subir al catálogo
      </button>

      <div id="status"></div>

    </section>


    <section class="catalog-section">

      <div class="catalog-header">

        <div>
          <h2>Modelos cargados</h2>
          <p>
            Fotografías y colores guardados
            en Carola.
          </p>
        </div>

        <button
          id="refreshButton"
          class="refresh"
          type="button"
        >
          Actualizar
        </button>

      </div>

      <div id="models">
        <div class="loading">
          Cargando modelos...
        </div>
      </div>

    </section>

  </main>

  <footer>
    Panel interno de Calzado Carola.
  </footer>


  <script>

    /*
     * CONTRASEÑA
     */

    let adminPassword = "";

    while (!adminPassword) {

      adminPassword = prompt(
        "Contraseña de administrador de Calzado Carola:"
      );

      if (adminPassword === null) {

        document.body.innerHTML =
          "<h2 style='text-align:center;margin-top:80px;'>Acceso cancelado</h2>";

        throw new Error(
          "Acceso cancelado"
        );
      }

      adminPassword =
        adminPassword.trim();
    }


    /*
     * ELEMENTOS
     */

    const modelo =
      document.getElementById("modelo");

    const color =
      document.getElementById("color");

    const imagenes =
      document.getElementById("imagenes");

    const preview =
      document.getElementById("preview");

    const count =
      document.getElementById("count");

    const uploadButton =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    const modelsContainer =
      document.getElementById("models");

    const refreshButton =
      document.getElementById("refreshButton");


    /*
     * PREVISUALIZACIÓN
     */

    imagenes.addEventListener(
      "change",
      function () {

        preview.innerHTML = "";

        const files =
          Array.from(imagenes.files);

        if (files.length === 0) {

          count.textContent =
            "Ninguna fotografía seleccionada";

          return;
        }

        count.textContent =
          files.length === 1
            ? "1 fotografía seleccionada"
            : `${files.length} fotografías seleccionadas`;

        for (const file of files) {

          const img =
            document.createElement("img");

          img.src =
            URL.createObjectURL(file);

          preview.appendChild(img);
        }
      }
    );


    /*
     * CONVERTIR ARCHIVO A BASE64
     */

    function fileToBase64(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload = () => {

            const result =
              String(reader.result);

            resolve({
              data:
                result.split(",")[1],

              type:
                file.type,

              name:
                file.name
            });
          };

          reader.onerror =
            reject;

          reader.readAsDataURL(file);
        }
      );
    }


    /*
     * SUBIR FOTOGRAFÍAS
     */

    uploadButton.addEventListener(
      "click",
      async function () {

        const modeloValue =
          modelo.value.trim();

        const colorValue =
          color.value.trim();

        const files =
          Array.from(imagenes.files);

        status.className = "";
        status.style.display = "none";

        if (
          !modeloValue ||
          !colorValue
        ) {

          status.textContent =
            "Escribe el modelo y el color.";

          status.className =
            "error";

          return;
        }

        if (files.length === 0) {

          status.textContent =
            "Selecciona al menos una fotografía.";

          status.className =
            "error";

          return;
        }

        try {

          uploadButton.disabled =
            true;

          uploadButton.textContent =
            "Subiendo...";

          const convertedImages =
            [];

          for (const file of files) {

            const converted =
              await fileToBase64(file);

            convertedImages.push(
              converted
            );
          }

          const response =
            await fetch(
              "/.netlify/functions/admin-upload",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "x-admin-password":
                    adminPassword
                },

                body: JSON.stringify({
                  modelo:
                    modeloValue,

                  color:
                    colorValue,

                  imagenes:
                    convertedImages
                })
              }
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            !result.success
          ) {

            throw new Error(
              result.error ||
              "No se pudieron subir las fotografías."
            );
          }

          status.innerHTML =
            `<strong>✓ Modelo ${modeloValue} · ${colorValue}</strong><br>` +
            (
              files.length === 1
                ? "1 fotografía subida correctamente."
                : `${files.length} fotografías subidas correctamente.`
            );

          status.className =
            "success";

          imagenes.value = "";
          preview.innerHTML = "";

          count.textContent =
            "Ninguna fotografía seleccionada";

          /*
           * Recargamos automáticamente
           * la lista inferior.
           */

          await loadModels();

        } catch (error) {

          status.textContent =
            error.message;

          status.className =
            "error";

        } finally {

          uploadButton.disabled =
            false;

          uploadButton.textContent =
            "Subir al catálogo";
        }
      }
    );


    /*
     * CARGAR MODELOS DESDE SUPABASE
     */

    async function loadModels() {

      modelsContainer.innerHTML =
        '<div class="loading">Cargando modelos...</div>';

      try {

        const response =
          await fetch(
            "/.netlify/functions/supabase"
          );

        const result =
          await response.json();

        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "No se pudieron cargar los modelos."
          );
        }

        renderModels(
          result.productos || []
        );

      } catch (error) {

        modelsContainer.innerHTML =
          `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }


    /*
     * MOSTRAR MODELOS
     */

    function renderModels(products) {

      if (products.length === 0) {

        modelsContainer.innerHTML =
          '<div class="empty">Todavía no hay modelos cargados.</div>';

        return;
      }

      const sortedProducts =
        [...products].sort(
          (a, b) =>
            String(a.modelo).localeCompare(
              String(b.modelo),
              undefined,
              {
                numeric: true,
                sensitivity: "base"
              }
            )
        );

      modelsContainer.innerHTML = "";

      for (
        const product of sortedProducts
      ) {

        const card =
          document.createElement("article");

        card.className =
          "model-card";

        const variants =
          Array.isArray(product.variantes)
            ? product.variantes
            : [];

        let variantsHtml = "";

        for (const variant of variants) {

          const images =
            Array.isArray(variant.imagenes)
              ? [...variant.imagenes]
              : [];

          images.sort(
            (a, b) =>
              Number(a.orden || 0) -
              Number(b.orden || 0)
          );

          const photosHtml =
            images.length > 0
              ? images
                  .map(
                    image =>
                      `<img
                        src="${escapeAttribute(image.url)}"
                        alt="Modelo ${escapeAttribute(product.modelo)} ${escapeAttribute(variant.color)}"
                        loading="lazy"
                      >`
                  )
                  .join("")
              : '<span class="photo-count">Sin fotografías</span>';

          variantsHtml += `
            <div class="variant">

              <div class="variant-info">

                <span class="color-name">
                  ${escapeHtml(variant.color)}
                </span>

                <span class="photo-count">
                  ${
                    images.length === 1
                      ? "1 fotografía"
                      : `${images.length} fotografías`
                  }
                </span>

              </div>

              <div class="photos">
                ${photosHtml}
              </div>

            </div>
          `;
        }

        if (variants.length === 0) {

          variantsHtml =
            '<div class="variant"><span class="photo-count">Sin colores cargados.</span></div>';
        }

        card.innerHTML = `
          <div class="model-title">

            <h3>
              Modelo ${escapeHtml(product.modelo)}
            </h3>

            <span class="model-id">
              ${variants.length}
              ${
                variants.length === 1
                  ? "color"
                  : "colores"
              }
            </span>

          </div>

          ${variantsHtml}
        `;

        modelsContainer.appendChild(
          card
        );
      }
    }


    /*
     * SEGURIDAD AL INSERTAR TEXTO
     */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function escapeAttribute(value) {

      return escapeHtml(
        value || ""
      );
    }


    /*
     * ACTUALIZAR
     */

    refreshButton.addEventListener(
      "click",
      loadModels
    );


    /*
     * CARGA INICIAL
     */

    loadModels();

  </script>

</body>
</html>
