<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administrador | CAROLA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8fb;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 35px 20px;
      border-bottom: 1px solid #f0dce5;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 8px;
    }

    header p {
      color: #888;
      margin-bottom: 0;
    }

    main {
      width: min(700px, 92%);
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 13px;
      font-size: 16px;
    }

    .file-label {
      display: block;
      margin-top: 20px;
      padding: 22px;
      border: 2px dashed #e8bfd0;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
    }

    #imagenes {
      display: none;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    #preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }

    #count {
      text-align: center;
      color: #888;
      margin: 15px 0;
    }

    #uploadButton {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #171717;
      color: white;
      padding: 17px;
      font-size: 16px;
      font-weight: 700;
    }

    #diagnostico {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #e7f8ed;
      color: #146b34;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">CAROLA</div>
  <p>Administrador de catálogo</p>
</header>

<main>

  <section class="card">

    <h2>Agregar fotografías</h2>

    <form id="uploadForm">

      <label for="modelo">
        Modelo
      </label>

      <input
        id="modelo"
        type="text"
        placeholder="Ej. 519"
      >

      <label for="color">
        Color
      </label>

      <input
        id="color"
        type="text"
        placeholder="Ej. Negro"
      >

      <label
        for="imagenes"
        class="file-label"
      >
        📷 Seleccionar fotografías
      </label>

      <input
        id="imagenes"
        type="file"
        accept="image/*"
        multiple
      >

      <div id="preview"></div>

      <div id="count">
        Ninguna fotografía seleccionada
      </div>

      <button
        id="uploadButton"
        type="submit"
      >
        Subir al catálogo
      </button>

    </form>

    <div id="diagnostico">
      BOTÓN FUNCIONANDO ✓
    </div>

  </section>

</main>


<script>

  /*
   * CONTRASEÑA
   */

  let adminPassword = prompt(
    "Contraseña de administrador de Calzado Carola:"
  );


  /*
   * ELEMENTOS
   */

  const form =
    document.getElementById("uploadForm");

  const imagenes =
    document.getElementById("imagenes");

  const preview =
    document.getElementById("preview");

  const count =
    document.getElementById("count");

  const diagnostico =
    document.getElementById("diagnostico");


  /*
   * PREVISUALIZAR FOTOS
   */

  imagenes.onchange = function () {

    preview.innerHTML = "";

    const files =
      Array.from(imagenes.files);

    if (files.length === 0) {

      count.textContent =
        "Ninguna fotografía seleccionada";

      return;
    }


    count.textContent =
      files.length === 1
        ? "1 fotografía seleccionada"
        : files.length +
          " fotografías seleccionadas";


    files.forEach(function (file) {

      const img =
        document.createElement("img");

      img.src =
        URL.createObjectURL(file);

      preview.appendChild(img);

    });

  };


  /*
   * PRUEBA DEL BOTÓN
   */

  form.onsubmit = function (event) {

    event.preventDefault();

    diagnostico.style.display =
      "block";

    diagnostico.textContent =
      "BOTÓN FUNCIONANDO ✓";

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

    return false;

  };

</script>

</body>
</html>
