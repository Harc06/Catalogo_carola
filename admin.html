<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador | Calzado Carola</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff6fa;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 20px;
    }

    label:first-child {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e5d9df;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid #efbfd3;
      border-color: transparent;
    }

    .photo-button {
      display: block;
      width: 100%;
      padding: 18px;
      margin-top: 20px;
      border: 2px dashed #e8bfd0;
      border-radius: 15px;
      text-align: center;
      cursor: pointer;
      background: #fff9fc;
    }

    #imagenes {
      display: none;
    }

    .preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
    }

    .count {
      text-align: center;
      color: #777;
      margin-top: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      padding: 16px;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #eaf8ef;
      color: #176b36;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #a52a2a;
    }

    .loading {
      display: block;
      background: #f5f5f5;
      color: #555;
    }

    .warning {
      margin-top: 25px;
      font-size: 12px;
      line-height: 1.5;
      color: #999;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">CAROLA</div>
    <div class="subtitle">Administrador de catálogo</div>

    <div class="card">

      <label for="modelo">Modelo</label>
      <input
        id="modelo"
        type="text"
        placeholder="Ej. 519"
        autocomplete="off"
      >

      <label for="color">Color</label>
      <input
        id="color"
        type="text"
        placeholder="Ej. Negro"
        autocomplete="off"
      >

      <label class="photo-button" for="imagenes">
        📷 Seleccionar fotografías
      </label>

      <input
        id="imagenes"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >

      <div id="preview" class="preview"></div>

      <div id="count" class="count">
        Ninguna fotografía seleccionada
      </div>

      <button id="uploadButton">
        Subir al catálogo
      </button>

      <div id="status" class="status"></div>

    </div>

    <div class="warning">
      Panel interno de Calzado Carola.
      No compartas esta dirección.
    </div>

  </div>


<script>

const modeloInput =
  document.getElementById("modelo");

const colorInput =
  document.getElementById("color");

const imagenesInput =
  document.getElementById("imagenes");

const preview =
  document.getElementById("preview");

const count =
  document.getElementById("count");

const uploadButton =
  document.getElementById("uploadButton");

const status =
  document.getElementById("status");


imagenesInput.addEventListener(
  "change",
  mostrarPreview
);


function mostrarPreview() {

  preview.innerHTML = "";

  const archivos =
    Array.from(imagenesInput.files);


  if (archivos.length === 0) {

    count.textContent =
      "Ninguna fotografía seleccionada";

    return;
  }


  count.textContent =
    `${archivos.length} fotografía${archivos.length === 1 ? "" : "s"} seleccionada${archivos.length === 1 ? "" : "s"}`;


  archivos.forEach(archivo => {

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(archivo);

    preview.appendChild(img);

  });

}


function archivoABase64(archivo) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = () => {

        const resultado =
          reader.result;

        const base64 =
          resultado.split(",")[1];

        resolve(base64);

      };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        archivo
      );

    }
  );

}


uploadButton.addEventListener(
  "click",
  subirProducto
);


async function subirProducto() {

  const modelo =
    modeloInput.value.trim();

  const color =
    colorInput.value.trim();

  const archivos =
    Array.from(imagenesInput.files);


  if (!modelo) {
    mostrarError(
      "Escribe el número o nombre del modelo."
    );
    return;
  }


  if (!color) {
    mostrarError(
      "Escribe el color."
    );
    return;
  }


  if (archivos.length === 0) {
    mostrarError(
      "Selecciona al menos una fotografía."
    );
    return;
  }


  uploadButton.disabled = true;

  status.className =
    "status loading";

  status.textContent =
    `Preparando ${archivos.length} fotografía${archivos.length === 1 ? "" : "s"}...`;


  try {

    const imagenes = [];


    for (
      let i = 0;
      i < archivos.length;
      i++
    ) {

      const archivo =
        archivos[i];


      status.textContent =
        `Preparando fotografía ${i + 1} de ${archivos.length}...`;


      const base64 =
        await archivoABase64(
          archivo
        );


      let extension =
        archivo.name
          .split(".")
          .pop()
          .toLowerCase();


      if (
        !["jpg", "jpeg", "png", "webp"]
          .includes(extension)
      ) {

        extension = "jpg";

      }


      imagenes.push({

        base64: base64,

        extension: extension,

        contentType:
          archivo.type ||
          "image/jpeg"

      });

    }


    status.textContent =
      "Subiendo fotografías a Calzado Carola...";


    const response =
      await fetch(
        "/.netlify/functions/admin-upload",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            modelo: modelo,
            color: color,
            imagenes: imagenes
          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "No se pudo completar la carga"
      );

    }


    status.className =
      "status success";

    status.innerHTML =
      `✓ <strong>Modelo ${modelo} · ${color}</strong><br>` +
      `${data.imagenes_subidas} fotografía${data.imagenes_subidas === 1 ? "" : "s"} subida${data.imagenes_subidas === 1 ? "" : "s"} correctamente.`;


    imagenesInput.value = "";

    preview.innerHTML = "";

    count.textContent =
      "Ninguna fotografía seleccionada";


  }

  catch (error) {

    console.error(error);

    mostrarError(
      error.message
    );

  }

  finally {

    uploadButton.disabled =
      false;

  }

}


function mostrarError(mensaje) {

  status.className =
    "status error";

  status.textContent =
    "⚠️ " + mensaje;

}

</script>

</body>
</html>
