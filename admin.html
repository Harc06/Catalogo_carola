<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador | CAROLA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8fb;
  color:#222;
}

header{
  background:#fff;
  text-align:center;
  padding:30px 20px 24px;
  border-bottom:1px solid #f0dce5;
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:8px;
}

header p{
  color:#888;
  margin:8px 0 0;
}

main{
  width:min(1050px,94%);
  margin:35px auto 80px;
}

.card,
.model-card{
  background:#fff;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.card{
  padding:26px;
}

h2{margin-top:0}

label{
  display:block;
  font-weight:700;
  margin:18px 0 8px;
}

input[type="text"]{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
}

.file-label{
  display:block;
  margin-top:20px;
  padding:22px;
  border:2px dashed #e8bfd0;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
  background:#fffafb;
  font-weight:700;
}

#imagenes{display:none}

#preview{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:10px;
  margin-top:15px;
}

#preview img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
}

#count{
  text-align:center;
  color:#888;
  margin:15px 0;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
  font-weight:700;
}

#uploadButton{
  width:100%;
  border-radius:14px;
  background:#171717;
  color:#fff;
  padding:17px;
  font-size:16px;
}

#uploadButton:disabled{
  opacity:.5;
}

#status{
  display:none;
  margin-top:18px;
  padding:18px;
  border-radius:14px;
  white-space:pre-line;
}

#status.loading{
  display:block;
  background:#f5eef1;
  color:#555;
}

#status.success{
  display:block;
  background:#e7f8ed;
  color:#146b34;
}

#status.error{
  display:block;
  background:#fff0f0;
  color:#a32d2d;
}

.catalog{
  margin-top:55px;
}

.catalog-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.catalog-header h2{
  font-size:29px;
  margin:0 0 5px;
}

.catalog-header p{
  margin:0;
  color:#888;
}

.refresh{
  background:#f5e6ed;
  padding:11px 16px;
  border-radius:12px;
}

#models{
  display:grid;
  gap:20px;
}

.model-card{
  padding:24px;
}

.model-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
}

.model-title{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.model-title h3{
  margin:0;
  font-size:25px;
}

.model-count{
  color:#999;
  font-size:13px;
}

.model-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.edit-model,
.edit-color{
  background:#f7e6ee;
  color:#222;
  border-radius:10px;
  padding:9px 12px;
}

.delete-model,
.delete-variant{
  background:#fff0f0;
  color:#a32d2d;
  border-radius:10px;
  padding:9px 12px;
}

.variant{
  border-top:1px solid #eee;
  margin-top:20px;
  padding-top:20px;
}

.variant-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.variant-title{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.color-name{
  font-weight:800;
  font-size:17px;
  text-transform:capitalize;
}

.photo-count{
  color:#888;
  font-size:14px;
}

.photos{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:16px 0 10px;
  -webkit-overflow-scrolling:touch;
}

.photo-card{
  width:130px;
  flex:0 0 130px;
  position:relative;
}

.photo-card img{
  width:130px;
  height:130px;
  display:block;
  object-fit:cover;
  border-radius:14px;
  background:#f5f5f5;
}

.primary-badge{
  position:absolute;
  top:7px;
  left:7px;
  background:#171717;
  color:#fff;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
}

.photo-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin-top:7px;
}

.photo-controls button{
  padding:9px 4px;
  border-radius:8px;
  background:#f3edf0;
  font-size:14px;
}

.photo-controls .delete-photo{
  color:#a32d2d;
  background:#fff0f0;
}

.make-primary{
  width:100%;
  margin-top:5px;
  padding:8px;
  border-radius:8px;
  background:#f7e6ee;
  font-size:11px;
}

.variant-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:10px;
}

.variant-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.add-photos{
  background:#171717;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
}

.model-bottom{
  border-top:1px solid #eee;
  margin-top:22px;
  padding-top:20px;
  display:flex;
  justify-content:center;
}

.add-color{
  background:#f7e6ee;
  color:#222;
  padding:13px 22px;
  border-radius:12px;
  font-size:14px;
}

.loading,
.empty{
  background:#fff;
  border-radius:20px;
  padding:35px;
  text-align:center;
  color:#888;
}

#operationStatus{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#171717;
  color:#fff;
  padding:14px 20px;
  border-radius:13px;
  display:none;
  z-index:9999;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  max-width:90%;
  text-align:center;
}

footer{
  padding:30px;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

@media(max-width:650px){

  main{width:94%}

  .card,
  .model-card{
    padding:18px;
  }

  .model-header{
    flex-direction:column;
  }

  .model-actions{
    justify-content:flex-start;
  }

  .variant-header{
    align-items:flex-start;
  }

  .photo-card{
    width:115px;
    flex-basis:115px;
  }

  .photo-card img{
    width:115px;
    height:115px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">CAROLA</div>
  <p>Administrador de catálogo</p>
</header>

<main>

<section class="card" id="uploadSection">

  <h2>Agregar fotografías</h2>

  <form id="uploadForm">

    <label for="modelo">Modelo</label>

    <input
      id="modelo"
      type="text"
      placeholder="Ej. 519"
      autocomplete="off"
    >

    <label for="color">Color</label>

    <input
      id="color"
      type="text"
      placeholder="Ej. Negro"
      autocomplete="off"
    >

    <label class="file-label" for="imagenes">
      📷 Seleccionar fotografías
    </label>

    <input
      id="imagenes"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      multiple
    >

    <div id="preview"></div>

    <div id="count">
      Ninguna fotografía seleccionada
    </div>

    <button id="uploadButton" type="submit">
      Subir al catálogo
    </button>

  </form>

  <div id="status"></div>

</section>


<section class="catalog">

  <div class="catalog-header">

    <div>
      <h2>Modelos cargados</h2>
      <p>Administra modelos, colores y fotografías.</p>
    </div>

    <button
      id="refreshButton"
      class="refresh"
      type="button"
    >
      Actualizar
    </button>

  </div>

  <div id="models">
    <div class="loading">
      Cargando modelos...
    </div>
  </div>

</section>

</main>


<div id="operationStatus">
  Procesando...
</div>


<footer>
  Panel interno de Calzado Carola
</footer>


<script>

/* =========================
   CONTRASEÑA
========================= */

let adminPassword =
  prompt(
    "Contraseña de administrador de Calzado Carola:"
  );

if(adminPassword === null){

  document.body.innerHTML =
    "<h2 style='text-align:center;margin-top:80px'>" +
    "Acceso cancelado" +
    "</h2>";

  throw new Error("Acceso cancelado");
}

adminPassword =
  String(adminPassword || "").trim();


/* =========================
   ELEMENTOS
========================= */

const form =
  document.getElementById("uploadForm");

const modelo =
  document.getElementById("modelo");

const color =
  document.getElementById("color");

const imagenes =
  document.getElementById("imagenes");

const preview =
  document.getElementById("preview");

const count =
  document.getElementById("count");

const uploadButton =
  document.getElementById("uploadButton");

const statusBox =
  document.getElementById("status");

const models =
  document.getElementById("models");

const refreshButton =
  document.getElementById("refreshButton");

const uploadSection =
  document.getElementById("uploadSection");

const operationStatus =
  document.getElementById("operationStatus");


/* =========================
   MENSAJES
========================= */

function showStatus(message,type){

  statusBox.textContent =
    message;

  statusBox.className =
    type;
}


function showOperation(message){

  operationStatus.textContent =
    message;

  operationStatus.style.display =
    "block";
}


function hideOperation(){

  operationStatus.style.display =
    "none";
}


/* =========================
   PREVISUALIZACIÓN
========================= */

imagenes.onchange = function(){

  preview.innerHTML = "";

  const files =
    Array.from(
      imagenes.files || []
    );

  if(!files.length){

    count.textContent =
      "Ninguna fotografía seleccionada";

    return;
  }

  count.textContent =
    files.length === 1
      ? "1 fotografía seleccionada"
      : files.length +
        " fotografías seleccionadas";

  files.forEach(function(file){

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);

    preview.appendChild(img);
  });
};


/* =========================
   BASE64
========================= */

function fileToBase64(file){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload = function(){

        const result =
          String(reader.result || "");

        const comma =
          result.indexOf(",");

        if(comma === -1){

          reject(
            new Error(
              "No se pudo procesar " +
              file.name
            )
          );

          return;
        }

        resolve({
          name:file.name,
          type:file.type || "image/jpeg",
          data:result.substring(comma + 1)
        });
      };

      reader.onerror = function(){

        reject(
          new Error(
            "No se pudo leer " +
            file.name
          )
        );
      };

      reader.readAsDataURL(file);
    }
  );
}


/* =========================
   SUBIR
========================= */

form.onsubmit =
  async function(event){

    event.preventDefault();

    const modelValue =
      modelo.value.trim();

    const colorValue =
      color.value.trim();

    const files =
      Array.from(
        imagenes.files || []
      );

    if(!modelValue){

      showStatus(
        "Falta escribir el modelo.",
        "error"
      );

      return false;
    }

    if(!colorValue){

      showStatus(
        "Falta escribir el color.",
        "error"
      );

      return false;
    }

    if(!files.length){

      showStatus(
        "Selecciona al menos una fotografía.",
        "error"
      );

      return false;
    }

    uploadButton.disabled = true;

    uploadButton.textContent =
      "Subiendo...";

    try{

      const converted = [];

      for(
        let i = 0;
        i < files.length;
        i++
      ){

        showStatus(
          "Preparando fotografía " +
          (i + 1) +
          " de " +
          files.length +
          "...",
          "loading"
        );

        converted.push(
          await fileToBase64(
            files[i]
          )
        );
      }

      showStatus(
        "Subiendo fotografías...",
        "loading"
      );

      const response =
        await fetch(
          "/.netlify/functions/admin-upload",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "x-admin-password":
                adminPassword
            },

            body:JSON.stringify({
              modelo:modelValue,
              color:colorValue,
              imagenes:converted
            })
          }
        );

      const result =
        await readJson(response);

      if(
        !response.ok ||
        !result.success
      ){

        throw new Error(
          result.error ||
          "No se pudieron subir las fotografías."
        );
      }

      showStatus(
        "✓ Modelo " +
        modelValue +
        " · " +
        colorValue +
        "\n" +
        files.length +
        (
          files.length === 1
            ? " fotografía subida correctamente."
            : " fotografías subidas correctamente."
        ),
        "success"
      );

      imagenes.value = "";

      preview.innerHTML = "";

      count.textContent =
        "Ninguna fotografía seleccionada";

      await loadModels();

    }catch(error){

      showStatus(
        error.message,
        "error"
      );

    }finally{

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "Subir al catálogo";
    }

    return false;
  };


/* =========================
   ADMIN MANAGE
========================= */

async function manage(payload){

  showOperation(
    "Guardando cambio..."
  );

  try{

    const response =
      await fetch(
        "/.netlify/functions/admin-manage",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              adminPassword
          },

          body:
            JSON.stringify(payload)
        }
      );

    const result =
      await readJson(response);

    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error ||
        "No se pudo completar la operación."
      );
    }

    await loadModels();

    operationStatus.textContent =
      "✓ Cambio guardado";

    setTimeout(
      hideOperation,
      1000
    );

    return true;

  }catch(error){

    operationStatus.textContent =
      "Error: " +
      error.message;

    setTimeout(
      hideOperation,
      4000
    );

    return false;
  }
}


/* =========================
   CARGAR MODELOS
========================= */

async function loadModels(){

  try{

    const response =
      await fetch(
        "/.netlify/functions/supabase?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    const result =
      await readJson(response);

    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error ||
        "No se pudieron cargar los modelos."
      );
    }

    renderModels(
      Array.isArray(result.productos)
        ? result.productos
        : []
    );

  }catch(error){

    models.innerHTML =
      '<div class="empty">' +
      escapeHtml(error.message) +
      "</div>";
  }
}


/* =========================
   MOSTRAR MODELOS
========================= */

function renderModels(products){

  if(!products.length){

    models.innerHTML =
      '<div class="empty">' +
      "No hay modelos cargados." +
      "</div>";

    return;
  }

  products.sort(
    function(a,b){

      return String(a.modelo)
        .localeCompare(
          String(b.modelo),
          undefined,
          {
            numeric:true,
            sensitivity:"base"
          }
        );
    }
  );

  let html = "";

  products.forEach(
    function(product){

      const variants =
        Array.isArray(product.variantes)
          ? product.variantes
          : [];

      html +=
        '<article class="model-card">' +

        '<div class="model-header">' +

        '<div class="model-title">' +

        "<h3>Modelo " +
        escapeHtml(product.modelo) +
        "</h3>" +

        '<span class="model-count">' +
        variants.length +
        (
          variants.length === 1
            ? " color"
            : " colores"
        ) +
        "</span>" +

        "</div>" +

        '<div class="model-actions">' +

        '<button ' +
        'type="button" ' +
        'class="edit-model" ' +
        'data-id="' +
        Number(product.id) +
        '" ' +
        'data-name="' +
        escapeAttribute(product.modelo) +
        '">' +
        "✏️ Editar modelo" +
        "</button>" +

        '<button ' +
        'type="button" ' +
        'class="delete-model" ' +
        'data-id="' +
        Number(product.id) +
        '" ' +
        'data-name="' +
        escapeAttribute(product.modelo) +
        '">' +
        "Eliminar modelo" +
        "</button>" +

        "</div>" +

        "</div>";

      variants.forEach(
        function(variant){

          const images =
            Array.isArray(variant.imagenes)
              ? variant.imagenes.slice()
              : [];

          images.sort(
            function(a,b){

              const orderDifference =
                Number(a.orden || 0) -
                Number(b.orden || 0);

              if(orderDifference !== 0){
                return orderDifference;
              }

              return (
                Number(a.id || 0) -
                Number(b.id || 0)
              );
            }
          );

          let photosHtml = "";

          images.forEach(
            function(image,index){

              photosHtml +=
                '<div class="photo-card">';

              if(index === 0){

                photosHtml +=
                  '<div class="primary-badge">' +
                  "PRINCIPAL" +
                  "</div>";
              }

              photosHtml +=
                '<img src="' +
                escapeAttribute(image.url || "") +
                '" loading="lazy" alt="">' +

                '<div class="photo-controls">' +

                '<button ' +
                'type="button" ' +
                'class="move-left" ' +
                'data-id="' +
                Number(image.id) +
                '" title="Mover a la izquierda">' +
                "←" +
                "</button>" +

                '<button ' +
                'type="button" ' +
                'class="move-right" ' +
                'data-id="' +
                Number(image.id) +
                '" title="Mover a la derecha">' +
                "→" +
                "</button>" +

                '<button ' +
                'type="button" ' +
                'class="delete-photo" ' +
                'data-id="' +
                Number(image.id) +
                '">' +
                "🗑" +
                "</button>" +

                "</div>";

              if(index !== 0){

                photosHtml +=
                  '<button ' +
                  'type="button" ' +
                  'class="make-primary" ' +
                  'data-id="' +
                  Number(image.id) +
                  '">' +
                  "Hacer principal" +
                  "</button>";
              }

              photosHtml +=
                "</div>";
            }
          );

          if(!images.length){

            photosHtml =
              '<span class="photo-count">' +
              "Sin fotografías" +
              "</span>";
          }

          html +=
            '<div class="variant">' +

            '<div class="variant-header">' +

            '<div class="variant-title">' +

            '<span class="color-name">' +
            escapeHtml(variant.color) +
            "</span>" +

            '<button ' +
            'type="button" ' +
            'class="edit-color" ' +
            'data-id="' +
            Number(variant.id) +
            '" ' +
            'data-color="' +
            escapeAttribute(variant.color) +
            '">' +
            "✏️ Editar" +
            "</button>" +

            "</div>" +

            '<span class="photo-count">' +
            images.length +
            (
              images.length === 1
                ? " fotografía"
                : " fotografías"
            ) +
            "</span>" +

            "</div>" +

            '<div class="photos">' +
            photosHtml +
            "</div>" +

            '<div class="variant-bottom">' +

            '<div class="variant-actions">' +

            '<button ' +
            'type="button" ' +
            'class="add-photos" ' +
            'data-model="' +
            escapeAttribute(product.modelo) +
            '" ' +
            'data-color="' +
            escapeAttribute(variant.color) +
            '">' +
            "+ Agregar fotos" +
            "</button>" +

            '<button ' +
            'type="button" ' +
            'class="delete-variant" ' +
            'data-id="' +
            Number(variant.id) +
            '" ' +
            'data-color="' +
            escapeAttribute(variant.color) +
            '">' +
            "Eliminar color" +
            "</button>" +

            "</div>" +

            "</div>" +

            "</div>";
        }
      );

      /*
       * AGREGAR COLOR:
       * AHORA SOLO UNA VEZ POR MODELO
       */

      html +=
        '<div class="model-bottom">' +

        '<button ' +
        'type="button" ' +
        'class="add-color" ' +
        'data-model="' +
        escapeAttribute(product.modelo) +
        '">' +
        "+ Agregar nuevo color" +
        "</button>" +

        "</div>" +

        "</article>";
    }
  );

  models.innerHTML = html;
}


/* =========================
   CLICS
========================= */

models.onclick =
  async function(event){

    /* AGREGAR FOTOS */

    const addPhotos =
      event.target.closest(
        ".add-photos"
      );

    if(addPhotos){

      modelo.value =
        addPhotos.dataset.model || "";

      color.value =
        addPhotos.dataset.color || "";

      uploadSection.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

      setTimeout(
        function(){
          imagenes.click();
        },
        400
      );

      return;
    }


    /* AGREGAR COLOR */

    const addColor =
      event.target.closest(
        ".add-color"
      );

    if(addColor){

      modelo.value =
        addColor.dataset.model || "";

      color.value = "";

      imagenes.value = "";

      preview.innerHTML = "";

      count.textContent =
        "Ninguna fotografía seleccionada";

      uploadSection.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

      setTimeout(
        function(){
          color.focus();
        },
        400
      );

      return;
    }


    /* EDITAR MODELO */

    const editModel =
      event.target.closest(
        ".edit-model"
      );

    if(editModel){

      const oldName =
        editModel.dataset.name || "";

      const newName =
        prompt(
          "Nuevo nombre/número del modelo:",
          oldName
        );

      if(newName === null){
        return;
      }

      const cleanName =
        newName.trim();

      if(!cleanName){
        alert(
          "El nombre del modelo no puede quedar vacío."
        );
        return;
      }

      if(cleanName === oldName){
        return;
      }

      await manage({
        action:"rename-model",
        modelId:Number(
          editModel.dataset.id
        ),
        newName:cleanName
      });

      return;
    }


    /* EDITAR COLOR */

    const editColor =
      event.target.closest(
        ".edit-color"
      );

    if(editColor){

      const oldColor =
        editColor.dataset.color || "";

      const newColor =
        prompt(
          "Nuevo nombre del color:",
          oldColor
        );

      if(newColor === null){
        return;
      }

      const cleanColor =
        newColor.trim();

      if(!cleanColor){
        alert(
          "El color no puede quedar vacío."
        );
        return;
      }

      if(
        cleanColor.toLowerCase() ===
        oldColor.toLowerCase()
      ){
        return;
      }

      await manage({
        action:"rename-variant",
        variantId:Number(
          editColor.dataset.id
        ),
        newColor:cleanColor
      });

      return;
    }


    /* MOVER IZQUIERDA */

    const left =
      event.target.closest(
        ".move-left"
      );

    if(left){

      await manage({
        action:"move-image",
        imageId:Number(
          left.dataset.id
        ),
        direction:"left"
      });

      return;
    }


    /* MOVER DERECHA */

    const right =
      event.target.closest(
        ".move-right"
      );

    if(right){

      await manage({
        action:"move-image",
        imageId:Number(
          right.dataset.id
        ),
        direction:"right"
      });

      return;
    }


    /* HACER PRINCIPAL */

    const primary =
      event.target.closest(
        ".make-primary"
      );

    if(primary){

      await manage({
        action:"make-primary",
        imageId:Number(
          primary.dataset.id
        )
      });

      return;
    }


    /* ELIMINAR FOTO */

    const deletePhoto =
      event.target.closest(
        ".delete-photo"
      );

    if(deletePhoto){

      if(
        !confirm(
          "¿Eliminar esta fotografía definitivamente?"
        )
      ){
        return;
      }

      await manage({
        action:"delete-image",
        imageId:Number(
          deletePhoto.dataset.id
        )
      });

      return;
    }


    /* ELIMINAR COLOR */

    const deleteVariant =
      event.target.closest(
        ".delete-variant"
      );

    if(deleteVariant){

      const colorName =
        deleteVariant.dataset.color || "";

      if(
        !confirm(
          "¿Eliminar el color " +
          colorName +
          " y TODAS sus fotografías?"
        )
      ){
        return;
      }

      await manage({
        action:"delete-variant",
        variantId:Number(
          deleteVariant.dataset.id
        )
      });

      return;
    }


    /* ELIMINAR MODELO */

    const deleteModel =
      event.target.closest(
        ".delete-model"
      );

    if(deleteModel){

      const name =
        deleteModel.dataset.name || "";

      if(
        !confirm(
          "¿Eliminar COMPLETAMENTE el modelo " +
          name +
          "?"
        )
      ){
        return;
      }

      if(
        !confirm(
          "Se eliminarán todos sus colores y fotografías.\n\n" +
          "Esta acción no se puede deshacer.\n\n" +
          "¿Confirmas?"
        )
      ){
        return;
      }

      await manage({
        action:"delete-model",
        modelId:Number(
          deleteModel.dataset.id
        )
      });

      return;
    }
  };


/* =========================
   ACTUALIZAR
========================= */

refreshButton.onclick =
  loadModels;


/* =========================
   LEER JSON
========================= */

async function readJson(response){

  const text =
    await response.text();

  try{

    return JSON.parse(text);

  }catch(error){

    return {
      success:false,
      error:
        "Respuesta inválida del servidor: " +
        text.substring(0,300)
    };
  }
}


/* =========================
   SEGURIDAD HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttribute(value){

  return escapeHtml(value);
}


/* =========================
   INICIAR
========================= */

loadModels();

</script>
