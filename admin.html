<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador | CAROLA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8fb;
  color:#222;
}

header{
  background:#fff;
  text-align:center;
  padding:32px 20px 25px;
  border-bottom:1px solid #f0dce5;
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:8px;
}

header p{
  color:#888;
  margin:8px 0 0;
}

main{
  width:min(950px,92%);
  margin:35px auto 80px;
}

.card,.model-card{
  background:#fff;
  border-radius:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.card{
  padding:26px;
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:18px 0 8px;
}

input[type="text"]{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
}

.file-label{
  display:block;
  margin-top:20px;
  padding:22px;
  border:2px dashed #e8bfd0;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
  background:#fffafb;
}

#imagenes{
  display:none;
}

#preview{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:10px;
  margin-top:15px;
}

#preview img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
}

#count{
  text-align:center;
  color:#888;
  margin:15px 0;
}

#uploadButton{
  width:100%;
  border:0;
  border-radius:14px;
  background:#171717;
  color:#fff;
  padding:17px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

#uploadButton:disabled{
  opacity:.55;
}

#status{
  display:none;
  margin-top:18px;
  padding:18px;
  border-radius:14px;
  white-space:pre-line;
  overflow-wrap:anywhere;
}

#status.loading{
  display:block;
  background:#f5eef1;
  color:#555;
}

#status.success{
  display:block;
  background:#e7f8ed;
  color:#146b34;
}

#status.error{
  display:block;
  background:#fff0f0;
  color:#a32d2d;
}

.catalog{
  margin-top:55px;
}

.catalog-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.catalog-header h2{
  font-size:29px;
  margin:0 0 5px;
}

.catalog-header p{
  margin:0;
  color:#888;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

.refresh{
  padding:11px 16px;
  border-radius:12px;
  background:#f5e6ed;
  font-weight:700;
}

#models{
  display:grid;
  gap:18px;
}

.model-card{
  padding:22px;
}

.model-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.model-header h3{
  margin:0;
  font-size:24px;
}

.model-count{
  color:#aaa;
  font-size:13px;
}

.variant{
  border-top:1px solid #eee;
  padding:18px 0 8px;
  margin-top:15px;
}

.variant-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.color-name{
  font-weight:700;
  text-transform:capitalize;
}

.photo-count{
  color:#888;
  font-size:14px;
}

.photos{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:13px 0 5px;
}

.photos img{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:12px;
  flex:0 0 auto;
  background:#f5f5f5;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:13px;
}

.add-photos{
  padding:11px 15px;
  border-radius:12px;
  background:#171717;
  color:#fff;
  font-weight:700;
}

.add-color{
  padding:11px 15px;
  border-radius:12px;
  background:#f7e6ee;
  color:#222;
  font-weight:700;
}

.loading-models,.empty{
  background:#fff;
  border-radius:20px;
  padding:35px;
  text-align:center;
  color:#888;
}

footer{
  padding:30px;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

@media(max-width:600px){
  main{width:94%}
  .card{padding:20px}
  .model-card{padding:18px}
  .catalog-header h2{font-size:25px}
  .actions button{flex:1}
}
</style>
</head>

<body>

<header>
  <div class="logo">CAROLA</div>
  <p>Administrador de catálogo</p>
</header>

<main>

<section class="card" id="uploadSection">

<h2>Agregar fotografías</h2>

<form id="uploadForm">

<label for="modelo">
Modelo
</label>

<input
  id="modelo"
  type="text"
  placeholder="Ej. 519"
  autocomplete="off"
>

<label for="color">
Color
</label>

<input
  id="color"
  type="text"
  placeholder="Ej. Negro"
  autocomplete="off"
>

<label
  for="imagenes"
  class="file-label"
>
📷 Seleccionar fotografías
</label>

<input
  id="imagenes"
  type="file"
  accept="image/jpeg,image/png,image/webp"
  multiple
>

<div id="preview"></div>

<div id="count">
Ninguna fotografía seleccionada
</div>

<button
  id="uploadButton"
  type="submit"
>
Subir al catálogo
</button>

</form>

<div id="status"></div>

</section>


<section class="catalog">

<div class="catalog-header">

<div>
<h2>Modelos cargados</h2>
<p>Fotografías y colores guardados en Carola.</p>
</div>

<button
  id="refreshButton"
  class="refresh"
  type="button"
>
Actualizar
</button>

</div>

<div id="models">
<div class="loading-models">
Cargando modelos...
</div>
</div>

</section>

</main>

<footer>
Panel interno de Calzado Carola
</footer>


<script>

/* =========================
   CONTRASEÑA
========================= */

let adminPassword = prompt(
  "Contraseña de administrador de Calzado Carola:"
);

if(adminPassword === null){
  document.body.innerHTML =
    "<h2 style='text-align:center;margin-top:80px'>Acceso cancelado</h2>";
}

adminPassword =
  String(adminPassword || "").trim();


/* =========================
   ELEMENTOS
========================= */

const form =
  document.getElementById("uploadForm");

const modelo =
  document.getElementById("modelo");

const color =
  document.getElementById("color");

const imagenes =
  document.getElementById("imagenes");

const preview =
  document.getElementById("preview");

const count =
  document.getElementById("count");

const uploadButton =
  document.getElementById("uploadButton");

const statusBox =
  document.getElementById("status");

const models =
  document.getElementById("models");

const refreshButton =
  document.getElementById("refreshButton");

const uploadSection =
  document.getElementById("uploadSection");


/* =========================
   MENSAJES
========================= */

function showStatus(message,type){

  statusBox.textContent = message;

  statusBox.className = type;
}


/* =========================
   PREVISUALIZACIÓN
========================= */

imagenes.onchange = function(){

  preview.innerHTML = "";

  const files =
    Array.from(imagenes.files || []);

  if(files.length === 0){

    count.textContent =
      "Ninguna fotografía seleccionada";

    return;
  }

  count.textContent =
    files.length === 1
      ? "1 fotografía seleccionada"
      : files.length +
        " fotografías seleccionadas";


  files.forEach(function(file){

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);

    preview.appendChild(img);

  });

};


/* =========================
   CONVERTIR A BASE64
========================= */

function fileToBase64(file){

  return new Promise(function(resolve,reject){

    const reader =
      new FileReader();

    reader.onload = function(){

      const result =
        String(reader.result || "");

      const comma =
        result.indexOf(",");

      if(comma === -1){

        reject(
          new Error(
            "No se pudo procesar " +
            file.name
          )
        );

        return;
      }

      resolve({
        name:file.name,
        type:file.type || "image/jpeg",
        data:result.substring(comma + 1)
      });

    };


    reader.onerror = function(){

      reject(
        new Error(
          "No se pudo leer " +
          file.name
        )
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================
   SUBIR
========================= */

form.onsubmit = async function(event){

  event.preventDefault();


  /*
   PRIMERA CONFIRMACIÓN:
   sabemos inmediatamente
   que el botón respondió.
  */

  showStatus(
    "Botón funcionando ✓\nValidando información...",
    "loading"
  );


  const modeloValue =
    modelo.value.trim();

  const colorValue =
    color.value.trim();

  const files =
    Array.from(imagenes.files || []);


  if(!modeloValue){

    showStatus(
      "Falta escribir el modelo.",
      "error"
    );

    return false;
  }


  if(!colorValue){

    showStatus(
      "Falta escribir el color.",
      "error"
    );

    return false;
  }


  if(files.length === 0){

    showStatus(
      "Selecciona al menos una fotografía.",
      "error"
    );

    return false;
  }


  uploadButton.disabled = true;

  uploadButton.textContent =
    "Subiendo...";


  try{

    const convertedImages = [];


    for(
      let i = 0;
      i < files.length;
      i++
    ){

      showStatus(
        "Preparando fotografía " +
        (i + 1) +
        " de " +
        files.length +
        "...",
        "loading"
      );


      const converted =
        await fileToBase64(
          files[i]
        );


      convertedImages.push(
        converted
      );

    }


    showStatus(
      "Enviando fotografías a Carola...",
      "loading"
    );


    const response =
      await fetch(
        "/.netlify/functions/admin-upload",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-admin-password":
              adminPassword
          },

          body:JSON.stringify({
            modelo:modeloValue,
            color:colorValue,
            imagenes:convertedImages
          })
        }
      );


    const raw =
      await response.text();


    let result = null;


    try{

      result =
        JSON.parse(raw);

    }catch(error){

      result = null;

    }


    if(!response.ok){

      let errorMessage =
        "Error del servidor (" +
        response.status +
        ").";


      if(
        result &&
        result.error
      ){

        errorMessage +=
          "\n" +
          result.error;

      }else if(raw){

        errorMessage +=
          "\n" +
          raw.substring(0,400);

      }


      throw new Error(
        errorMessage
      );

    }


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result &&
        result.error
          ? result.error
          : "El servidor no confirmó la subida."
      );

    }


    showStatus(
      "✓ Modelo " +
      modeloValue +
      " · " +
      colorValue +
      "\n" +
      (
        files.length === 1
          ? "1 fotografía subida correctamente."
          : files.length +
            " fotografías subidas correctamente."
      ),
      "success"
    );


    /*
     Limpiamos fotografías,
     pero dejamos modelo/color.
    */

    imagenes.value = "";

    preview.innerHTML = "";

    count.textContent =
      "Ninguna fotografía seleccionada";


    /*
     Actualizamos miniaturas.
    */

    await loadModels();


  }catch(error){

    showStatus(
      "No se pudo completar la subida.\n\n" +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }finally{

    uploadButton.disabled = false;

    uploadButton.textContent =
      "Subir al catálogo";

  }


  return false;

};


/* =========================
   CARGAR MODELOS
========================= */

async function loadModels(){

  try{

    const response =
      await fetch(
        "/.netlify/functions/supabase?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const raw =
      await response.text();


    let result;


    try{

      result =
        JSON.parse(raw);

    }catch(error){

      throw new Error(
        "No se pudo leer la lista de modelos."
      );

    }


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error ||
        "No se pudieron cargar los modelos."
      );

    }


    renderModels(
      Array.isArray(result.productos)
        ? result.productos
        : []
    );


  }catch(error){

    models.innerHTML =
      '<div class="empty">' +
      escapeHtml(error.message) +
      "</div>";

  }

}


/* =========================
   MOSTRAR MODELOS
========================= */

function renderModels(products){

  if(products.length === 0){

    models.innerHTML =
      '<div class="empty">' +
      "Todavía no hay modelos cargados." +
      "</div>";

    return;

  }


  products.sort(function(a,b){

    return String(a.modelo)
      .localeCompare(
        String(b.modelo),
        undefined,
        {
          numeric:true,
          sensitivity:"base"
        }
      );

  });


  let html = "";


  products.forEach(function(product){

    const variants =
      Array.isArray(product.variantes)
        ? product.variantes
        : [];


    html +=
      '<article class="model-card">' +

        '<div class="model-header">' +

          "<h3>Modelo " +
          escapeHtml(product.modelo) +
          "</h3>" +

          '<span class="model-count">' +
          variants.length +
          (
            variants.length === 1
              ? " color"
              : " colores"
          ) +
          "</span>" +

        "</div>";


    variants.forEach(function(variant){

      const images =
        Array.isArray(variant.imagenes)
          ? variant.imagenes.slice()
          : [];


      images.sort(function(a,b){

        return (
          Number(a.orden || 0) -
          Number(b.orden || 0)
        );

      });


      let photos = "";


      images.forEach(function(image){

        photos +=
          '<img src="' +
          escapeAttribute(
            image.url || ""
          ) +
          '" loading="lazy" alt="">';

      });


      if(images.length === 0){

        photos =
          '<span class="photo-count">' +
          "Sin fotografías" +
          "</span>";

      }


      html +=
        '<div class="variant">' +

          '<div class="variant-header">' +

            '<span class="color-name">' +
            escapeHtml(variant.color) +
            "</span>" +

            '<span class="photo-count">' +
            images.length +
            (
              images.length === 1
                ? " fotografía"
                : " fotografías"
            ) +
            "</span>" +

          "</div>" +

          '<div class="photos">' +
          photos +
          "</div>" +

          '<div class="actions">' +

            '<button ' +
            'type="button" ' +
            'class="add-photos" ' +
            'data-model="' +
            escapeAttribute(product.modelo) +
            '" ' +
            'data-color="' +
            escapeAttribute(variant.color) +
            '">' +

            "+ Agregar fotos a " +
            escapeHtml(variant.color) +

            "</button>" +


            '<button ' +
            'type="button" ' +
            'class="add-color" ' +
            'data-model="' +
            escapeAttribute(product.modelo) +
            '">' +

            "+ Agregar otro color" +

            "</button>" +

          "</div>" +

        "</div>";

    });


    html +=
      "</article>";

  });


  models.innerHTML = html;

}


/* =========================
   BOTONES DE CADA COLOR
========================= */

models.onclick = function(event){

  const addPhotos =
    event.target.closest(
      ".add-photos"
    );


  if(addPhotos){

    modelo.value =
      addPhotos.getAttribute(
        "data-model"
      ) || "";

    color.value =
      addPhotos.getAttribute(
        "data-color"
      ) || "";


    uploadSection.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


    setTimeout(function(){

      imagenes.click();

    },400);


    return;

  }


  const addColor =
    event.target.closest(
      ".add-color"
    );


  if(addColor){

    modelo.value =
      addColor.getAttribute(
        "data-model"
      ) || "";

    color.value = "";


    uploadSection.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


    setTimeout(function(){

      color.focus();

    },400);

  }

};


/* =========================
   ACTUALIZAR
========================= */

refreshButton.onclick =
  function(){

    loadModels();

  };


/* =========================
   TEXTO SEGURO
========================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* =========================
   INICIO
========================= */

loadModels();

</script>

</body>
</html>
