const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const photoColor=s=>norm(s).replace(/\bcharol\b/g,'').replace(/\s+/g,' ').trim();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(base,key,path){const r=await fetch(base+path,{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error('Consulta '+r.status);return r.json()}
function photoFor(i){return i.photo?'<img class="photo" loading="lazy" src="'+esc(i.photo)+'" alt="Modelo '+esc(i.modelo)+' color '+esc(i.color)+'">':'<div class="photo placeholder">CAROLA<br>Modelo '+esc(i.modelo)+'</div>'}
async function getAll(base,key,path){const rows=[];for(let offset=0;offset<50000;offset+=1000){const page=await get(base,key,path+(path.includes('?')?'&':'?')+'limit=1000&offset='+offset);rows.push(...page);if(page.length<1000)return rows;}throw Error('Demasiados registros')}
async function load(){try{
 const stock=await getAll(RETAIL,RETAIL_KEY,'menudeo_catalogo_publico?select=*&order=modelo.asc');
 items=stock.filter(x=>[3,4,5,6].some(s=>Number(x['talla_'+s])>0)&&Number(x.precio)>0);
 try{const [models,variants,photos]=await Promise.all([getAll(WHOLE,WHOLE_KEY,'modelos?select=id,modelo'),getAll(WHOLE,WHOLE_KEY,'variantes?select=id,modelo_id,color'),getAll(WHOLE,WHOLE_KEY,'imagenes?select=variante_id,url,orden&order=orden.asc')]);
 const names=new Map(models.map(m=>[m.id,norm(m.modelo)]));const byVariant=new Map(variants.map(v=>[v.id,names.get(v.modelo_id)+'|'+norm(v.color)]));const images=new Map(),normalizedImages=new Map();for(const p of photos){const k=byVariant.get(p.variante_id);if(k&&!images.has(k))images.set(k,p.url);if(k){const split=k.indexOf('|');const normalizedKey=k.slice(0,split)+'|'+photoColor(k.slice(split+1));if(!normalizedImages.has(normalizedKey))normalizedImages.set(normalizedKey,p.url)}}
 for(const i of items){const model=norm(i.modelo),color=norm(i.color);i.photo=images.get(model+'|'+color)||normalizedImages.get(model+'|'+photoColor(i.color))||'';if(!i.photo){const base=color.split(' ')[0];const matches=[...images.entries()].filter(([key])=>key.startsWith(model+'|'+base+' '));if(matches.length){i.photo=matches[0][1];i.photoReference=matches.length>1;}}}
 }catch(e){console.warn('Fotografías no disponibles',e)}
 $('status').textContent=items.length+' colores disponibles';render();
 }catch(e){$('status').textContent='No se pudo cargar el inventario';$('grid').innerHTML='<p class="error">Intenta actualizar la página.</p>'}}
function render(){const q=norm($('search').value);const visible=items.filter(i=>norm(i.modelo+' '+i.color+' '+i.categoria).includes(q));$('grid').innerHTML=visible.map(i=>'<article class="product" data-id="'+i.inventario_id+'" role="button" tabindex="0" aria-label="Ver modelo '+esc(i.modelo)+' color '+esc(i.color)+'">'+photoFor(i)+(i.photoReference?'<div class="muted" style="padding:4px 12px">Foto de referencia</div>':'')+'<div class="details"><h3>Modelo '+esc(i.modelo)+'</h3><div class="muted">'+esc(i.color)+' · '+esc(i.categoria||'Calzado')+'</div><div class="price">'+money(i.precio)+'</div><button class="add" data-id="'+i.inventario_id+'">Elegir talla</button></div></article>').join('')||'<div class="empty">Sin resultados</div>'}
function show(html,mode='product'){$('panelBody').innerHTML=html;$('sheet').classList.toggle('cart-mode',mode==='cart');$('sheet').classList.add('open');document.body.classList.add('sheet-open')}
function hideSheet(){$('sheet').classList.remove('open');document.body.classList.remove('sheet-open')}
function choose(id){selected=items.find(i=>String(i.inventario_id)===String(id));chosenSize=null;if(!selected)return;
const available=[3,4,5,6].reduce((n,size)=>n+Number(selected['talla_'+size]||0),0);
show('<div class="product-preview">'+photoFor(selected)+'</div><div class="sheet-eyebrow">CAROLA · MENUDEO</div><h2>Modelo '+esc(selected.modelo)+'</h2><div class="sheet-meta">'+esc(selected.color)+' <span>·</span> '+esc(selected.categoria||'Calzado')+'</div><div class="sheet-price">'+money(selected.precio)+'</div><div class="sheet-availability"><span class="stock-dot"></span>'+available+' pares disponibles en total</div><div class="size-title">ELIGE TU TALLA</div><div class="size-grid">'+[3,4,5,6].map(size=>'<button class="size" data-size="'+size+'" '+(Number(selected['talla_'+size])<1?'disabled':'')+'><b>'+size+'</b><small>'+(Number(selected['talla_'+size])<1?'Agotada':selected['talla_'+size]+' disp.')+'</small></button>').join('')+'</div><button id="confirm" class="pill wide add-cart-btn" disabled><span class="cart-button-label">Selecciona una talla</span><span class="cart-button-icon">＋</span></button><p class="sheet-hint">Compra desde un par · Pedido por WhatsApp</p>')}
function refreshCount(){$('count').textContent=cart.reduce((s,i)=>s+i.qty,0)}
function cartView(){const total=cart.reduce((s,i)=>s+i.qty*i.precio,0);const pairs=cart.reduce((s,i)=>s+i.qty,0);
const rows=cart.map((i,n)=>{const product=items.find(x=>x.inventario_id===i.id);const thumb=product&&product.photo?'<img src="'+esc(product.photo)+'" alt="Modelo '+esc(i.modelo)+'" loading="lazy">':'<div class="cart-placeholder">CAROLA</div>';return '<article class="cart-item"><div class="cart-thumb">'+thumb+'</div><div class="cart-item-info"><div class="cart-item-title">MODELO '+esc(i.modelo)+'</div><div class="cart-item-sub">'+esc(i.color)+' · Talla '+i.size+'</div><div class="cart-item-price">'+money(i.precio)+'</div><div class="cart-item-controls"><div class="cart-quantity"><button data-minus="'+n+'" aria-label="Quitar una unidad">−</button><span>'+i.qty+'</span><button data-plus="'+n+'" aria-label="Agregar una unidad">+</button></div><button class="cart-remove" data-remove="'+n+'" aria-label="Eliminar producto">Eliminar</button></div></div><div class="cart-line-total">'+money(i.precio*i.qty)+'</div></article>'}).join('');
show('<div class="cart-layout"><div class="cart-head"><span class="cart-eyebrow">CAROLA · MENUDEO</span><h2>MI CARRITO <span class="cart-count-label">('+pairs+')</span></h2><p>Revisa tus favoritos antes de enviar el pedido.</p></div><div class="cart-scroll">'+(cart.length?rows:'<div class="cart-empty"><span>♡</span><h3>Tu carrito está vacío</h3><p>Descubre la colección y agrega tus modelos favoritos.</p><button id="continueShopping" class="pill">Seguir comprando</button></div>')+'</div>'+(cart.length?'<div class="cart-checkout"><div class="cart-summary"><span>Subtotal · '+pairs+' par(es)</span><strong>'+money(total)+'</strong></div><div class="cart-summary cart-total"><span>Total</span><strong>'+money(total)+'</strong></div><div class="fields"><label for="name">NOMBRE COMPLETO</label><input id="name" placeholder="¿A nombre de quién va el pedido?" maxlength="120"><label for="phone">TELÉFONO</label><input id="phone" placeholder="10 dígitos" inputmode="numeric" maxlength="10"><button id="send" class="pill">Enviar pedido por WhatsApp ↗</button><p class="cart-note">El pedido se confirma por WhatsApp. No se descuenta inventario al enviarlo.</p></div></div>':'')+'</div>','cart')}

$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.product[data-id]')){e.preventDefault();choose(e.target.dataset.id)}});
$('search').addEventListener('input',render);$('cartButton').onclick=cartView;$('close').onclick=hideSheet;$('sheet').onclick=e=>{if(e.target===$('sheet'))hideSheet()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideSheet()});
$('panelBody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.size){chosenSize=Number(b.dataset.size);document.querySelectorAll('.size').forEach(x=>x.classList.toggle('selected',x===b));$('confirm').disabled=false;$('confirm').querySelector('.cart-button-label').textContent='Añadir al carrito · '+money(selected.precio)}
 if(b.id==='confirm'&&selected&&chosenSize){const existing=cart.find(x=>x.id===selected.inventario_id&&x.size===chosenSize);const qty=existing?.qty||0;if(qty>=selected['talla_'+chosenSize])return alert('No hay más pares disponibles');if(existing)existing.qty++;else cart.push({id:selected.inventario_id,modelo:selected.modelo,color:selected.color,size:chosenSize,precio:Number(selected.precio),qty:1});refreshCount();b.classList.add('added');b.querySelector('.cart-button-label').textContent='¡Añadido al carrito!';b.querySelector('.cart-button-icon').textContent='✓';$('cartButton').classList.remove('cart-bounce');void $('cartButton').offsetWidth;$('cartButton').classList.add('cart-bounce');setTimeout(()=>{if($('sheet').classList.contains('open')&&!$('sheet').classList.contains('cart-mode'))hideSheet()},650)}
 if(b.id==='continueShopping'){hideSheet();return}
 if(b.dataset.remove!==undefined){cart.splice(Number(b.dataset.remove),1);refreshCount();cartView();return}
 if(b.dataset.minus!==undefined||b.dataset.plus!==undefined){const n=Number(b.dataset.minus??b.dataset.plus);if(b.dataset.minus!==undefined)cart[n].qty--;else{const line=cart[n],stock=items.find(i=>i.inventario_id===line.id);if(line.qty>=stock['talla_'+line.size])return alert('Existencias insuficientes');line.qty++}cart=cart.filter(i=>i.qty>0);refreshCount();cartView()}
 if(b.id==='send'){const name=$('name').value.trim(),phone=$('phone').value.replace(/\D/g,'');if(name.length<2||!/^[0-9]{10}$/.test(phone))return alert('Escribe nombre y teléfono de 10 dígitos');b.disabled=true;try{const latest=await get(RETAIL,RETAIL_KEY,'menudeo_catalogo_publico?select=inventario_id,talla_3,talla_4,talla_5,talla_6,precio&limit=1000');for(const line of cart){const current=latest.find(x=>x.inventario_id===line.id);if(!current||Number(current['talla_'+line.size])<line.qty||Number(current.precio)!==line.precio)throw Error('Cambió la disponibilidad o precio del modelo '+line.modelo+'. Actualiza el pedido.')}const total=cart.reduce((s,i)=>s+i.qty*i.precio,0);const msg=['*PEDIDO CAROLA MENUDEO*','Cliente: '+name,'Teléfono: '+phone,'',...cart.map(i=>'• Modelo '+i.modelo+' | '+i.color+' | Talla '+i.size+' | '+i.qty+' par(es) | '+money(i.qty*i.precio)),'','*Total: '+money(total)+'*','Por favor confirmar disponibilidad y entrega.'].join('\n');window.location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}catch(err){alert(err.message)}finally{b.disabled=false}}
});
const slides=[...document.querySelectorAll(".hero-slide")],dots=[...document.querySelectorAll(".hero-dot")];let slideIndex=0;function showSlide(n){slideIndex=n;slides.forEach((s,i)=>{s.classList.toggle("active",i===n);s.setAttribute("aria-hidden",i===n?"false":"true");s.tabIndex=i===n?0:-1});dots.forEach((d,i)=>d.classList.toggle("active",i===n))}let carouselTimer;function startCarousel(){clearInterval(carouselTimer);carouselTimer=setInterval(()=>showSlide((slideIndex+1)%slides.length),5000)}dots.forEach((d,i)=>d.addEventListener("click",()=>{showSlide(i);startCarousel()}));document.addEventListener("visibilitychange",()=>{if(document.hidden)clearInterval(carouselTimer);else startCarousel()});showSlide(0);startCarousel();load();
</script></body></html>
