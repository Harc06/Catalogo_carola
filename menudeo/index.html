:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#21191d;background:#fff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#ffffffeb;backdrop-filter:blur(16px);border-bottom:1px solid #f2e6ec;padding:16px max(18px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:950;letter-spacing:6px}.pill{background:#20171c;color:#fff;border:0;border-radius:50px;padding:12px 17px;font-weight:750}.hero{margin:20px auto;max-width:1160px;padding:32px 24px;background:linear-gradient(115deg,#f1c5d6,#fff5f8);border-radius:24px}.hero small{letter-spacing:2px;font-weight:900}.hero h1{font-size:clamp(32px,5vw,55px);margin:8px 0}.hero p{margin:0;color:#63535b}main{max-width:1160px;margin:auto;padding:0 18px 100px}.filters{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}input{border:1px solid #e8d9df;border-radius:12px;padding:13px;min-width:0}.filters input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:22px 13px}.product{border:1px solid #f1e7eb;border-radius:17px;overflow:hidden;background:#fff}.photo{width:100%;aspect-ratio:4/5;object-fit:cover;background:#f9f0f4}.placeholder{display:grid;place-items:center;color:#a98c9a;font-size:12px;text-align:center;padding:15px}.details{padding:13px}.details h3{margin:0 0 4px}.muted{color:#897780;font-size:12px}.price{font-weight:900;margin:9px 0}.add{width:100%;border:0;border-radius:10px;background:#23191f;color:#fff;padding:11px}.sheet{position:fixed;inset:0;background:#24141c88;z-index:9;display:none;align-items:end;justify-content:center}.sheet.open{display:flex}.panel{width:min(520px,100%);max-height:90dvh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:23px 20px calc(25px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 15px}.line{display:flex;justify-content:space-between;ali :root{font-family:Arial,Helvetica,sans-serif;color:#151515;background:#fff}

</style></head><body><div class="announcement">CAROLA · MODA QUE VA CONTIGO · COMPRA DESDE UN PAR</div><header><span class="brand">CAROLA</span><nav class="desktop-nav" aria-label="Navegación"><a href="#coleccion">Lo nuevo</a><a href="#coleccion">Botas y botines</a><a href="#coleccion">Colección</a></nav><button class="pill" id="cartButton">Pedido · <span id="count">0</span></button></header><section class="hero" aria-label="Campañas Carola Menudeo"><a class="hero-slide active" href="#coleccion" aria-label="Explora la colección de calzado femenino"><img src="/menudeo/banner-estilo-diario.jpg" alt="CAROLA: Tu estilo todos los días, moda y comodidad desde un solo par" fetchpriority="high"></a><a class="hero-slide" href="#coleccion" aria-label="Descubre la colección otoño invierno"><img src="/menudeo/banner-otono-invierno.jpg" alt="CAROLA: Colección otoño invierno de botas y botines" loading="eager"></a><div class="hero-dots" aria-label="Seleccionar campaña"><button class="hero-dot active" type="button" aria-label="Mostrar primer banner"></button><button class="hero-dot" type="button" aria-label="Mostrar segundo banner"></button></div></section><main id="coleccion"><div class="section-intro"><small>DESCUBRE CAROLA</small><h2>NEW ARRIVALS</h2><p>Modelos que definen tu estilo, disponibles para ti.</p></div><div class="filters"><input id="search" placeholder="Buscar modelo, color o categoría..." aria-label="Buscar productos"><span id="status" class="muted">Cargando catálogo…</span></div><div id="grid" class="grid"></div></main><footer class="site-footer"><div class="footer-logo">CAROLA</div><p>Calzado para cada versión de ti.<br>León, Guanajuato · Pedidos por WhatsApp</p></footer><div id="sheet" class="sheet" role="dialog" aria-modal="true"><div class="panel"><button id="close" class="close" aria-label="Cerrar">×</button><div id="panelBody"></div></div></div><script>
const RETAIL='https://hnivrzcjxjofgzgopmbv.supabase.co/rest/v1/', RETAIL_KEY='sb_publishable_5_IdToHZp3qyPv4aJehepA_VsDI6Vgl';
const WHOLE='https://gfkjdpuhbxfwajbkzfap.supabase.co/rest/v1/', WHOLE_KEY='sb_publishable_Dbg1YhOyxOxgxcvwr9fWtg_mI4iwUw7';
const PHONE='524775971996';let items=[],cart=[],selected=null,chosenSize=null;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(base,key,path){const r=await fetch(base+path,{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error('Consulta '+r.status);return r.json()}
function photoFor(i){return i.photo?'<img class="photo" loading="lazy" src="'+esc(i.photo)+'" alt="Modelo '+esc(i.modelo)+' color '+esc(i.color)+'">':'<div class="photo placeholder">CAROLA<br>Modelo '+esc(i.modelo)+'</div>'}
async function load(){try{
 const stock=await get(RETAIL,RETAIL_KEY,'menudeo_catalogo_publico?select=*&order=modelo.asc&limit=1000');
 items=stock.filter(x=>[3,4,5,6].some(s=>Number(x['talla_'+s])>0)&&Number(x.precio)>0);
 try{const [models,variants,photos]=await Promise.all([get(WHOLE,WHOLE_KEY,'modelos?select=id,modelo&limit=3000'),get(WHOLE,WHOLE_KEY,'variantes?select=id,modelo_id,color&limit=5000'),get(WHOLE,WHOLE_KEY,'imagenes?select=variante_id,url,orden&order=orden.asc&limit=10000')]);
 const names=new Map(models.map(m=>[m.id,norm(m.modelo)]));const byVariant=new Map(variants.map(v=>[v.id,names.get(v.modelo_id)+'|'+norm(v.color)]));const images=new Map();for(const p of photos){const k=byVariant.get(p.variante_id);if(k&&!images.has(k))images.set(k,p.url)}
 for(const i of items)i.photo=images.get(norm(i.modelo)+'|'+norm(i.color))||'';
 }catch(e){console.warn('Fotografías no disponibles',e)}
 $('status').textContent=items.length+' colores disponibles';render();
 }catch(e){$('status').textContent='No se pudo cargar el inventario';$('grid').innerHTML='<p class="error">Intenta actualizar la página.</p>'}}
function render(){const q=norm($('search').value);const visible=items.filter(i=>norm(i.modelo+' '+i.color+' '+i.categoria).includes(q));$('grid').innerHTML=visible.map(i=>'<article class="product">'+photoFor(i)+'<div class="details"><h3>Modelo '+esc(i.modelo)+'</h3><div class="muted">'+esc(i.color)+' · '+esc(i.categoria||'Calzado')+'</div><div class="price">'+money(i.precio)+'</div><button class="add" data-id="'+i.inventario_id+'">Elegir talla</button></div></article>').join('')||'<div class="empty">Sin resultados</div>'}
function show(html){$('panelBody').innerHTML=html;$('sheet').classList.add('open')}
function choose(id){selected=items.find(i=>String(i.inventario_id)===String(id));chosenSize=null;if(!selected)return;show('<h2>Modelo '+esc(selected.modelo)+'</h2><p>'+esc(selected.color)+' · '+money(selected.precio)+'</p><p>Selecciona talla disponible</p><div class="row">'+[3,4,5,6].map(s=>'<button class="size" data-size="'+s+'" '+(selected['talla_'+s]<1?'disabled':'')+'>Talla '+s+'<br><small>'+selected['talla_'+s]+' disp.</small></button>').join('')+'</div><button id="confirm" class="pill wide" disabled>Agregar al pedido</button>')}
function refreshCount(){$('count').textContent=cart.reduce((s,i)=>s+i.qty,0)}
function cartView(){const total=cart.reduce((s,i)=>s+i.qty*i.precio,0);show('<h2>Tu pedido</h2>'+(!cart.length?'<p>Tu carrito está vacío.</p>':cart.map((i,n)=>'<div class="line"><div><b>Modelo '+esc(i.modelo)+'</b><div class="muted">'+esc(i.color)+' · Talla '+i.size+' · '+money(i.precio)+'</div></div><div class="row"><button data-minus="'+n+'">−</button><b>'+i.qty+'</b><button data-plus="'+n+'">+</button></div></div>').join('')+'<h3>Total: '+money(total)+'</h3><div class="fields"><input id="name" placeholder="Nombre completo" maxlength="120"><input id="phone" placeholder="Teléfono de 10 dígitos" inputmode="numeric" maxlength="10"><button id="send" class="pill">Continuar por WhatsApp</button><p class="muted">El pedido se confirma por WhatsApp. No se descuenta inventario al enviarlo.</p></div>'))}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)});
$('search').addEventListener('input',render);$('cartButton').onclick=cartView;$('close').onclick=()=> $('sheet').classList.remove('open');$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('open')};
$('panelBody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.size){chosenSize=Number(b.dataset.size);document.querySelectorAll('.size').forEach(x=>x.classList.toggle('selected',x===b));$('confirm').disabled=false}
 if(b.id==='confirm'&&selected&&chosenSize){const existing=cart.find(x=>x.id===selected.inventario_id&&x.size===chosenSize);const qty=existing?.qty||0;if(qty>=selected['talla_'+chosenSize])return alert('No hay más pares disponibles');if(existing)existing.qty++;else cart.push({id:selected.inventario_id,modelo:selected.modelo,color:selected.color,size:chosenSize,precio:Number(selected.precio),qty:1});refreshCount();cartView()}
 if(b.dataset.minus!==undefined||b.dataset.plus!==undefined){const n=Number(b.dataset.minus??b.dataset.plus);if(b.dataset.minus!==undefined)cart[n].qty--;else{const line=cart[n],stock=items.find(i=>i.inventario_id===line.id);if(line.qty>=stock['talla_'+line.size])return alert('Existencias insuficientes');line.qty++}cart=cart.filter(i=>i.qty>0);refreshCount();cartView()}
 if(b.id==='send'){const name=$('name').value.trim(),phone=$('phone').value.replace(/\D/g,'');if(name.length<2||!/^[0-9]{10}$/.test(phone))return alert('Escribe nombre y teléfono de 10 dígitos');b.disabled=true;try{const latest=await get(RETAIL,RETAIL_KEY,'menudeo_catalogo_publico?select=inventario_id,talla_3,talla_4,talla_5,talla_6,precio&limit=1000');for(const line of cart){const current=latest.find(x=>x.inventario_id===line.id);if(!current||Number(current['talla_'+line.size])<line.qty||Number(current.precio)!==line.precio)throw Error('Cambió la disponibilidad o precio del modelo '+line.modelo+'. Actualiza el pedido.')}const total=cart.reduce((s,i)=>s+i.qty*i.precio,0);const msg=['*PEDIDO CAROLA MENUDEO*','Cliente: '+name,'Teléfono: '+phone,'',...cart.map(i=>'• Modelo '+i.modelo+' | '+i.color+' | Talla '+i.size+' | '+i.qty+' par(es) | '+money(i.qty*i.precio)),'','*Total: '+money(total)+'*','Por favor confirmar disponibilidad y entrega.'].join('\n');window.location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}catch(err){alert(err.message)}finally{b.disabled=false}}
});\nconst slides=[...document.querySelectorAll(".hero-slide")],dots=[...document.querySelectorAll(".hero-dot")];let slideIndex=0;function showSlide(n){slideIndex=n;slides.forEach((s,i)=>{s.classList.toggle("active",i===n);s.setAttribute("aria-hidden",i===n?"false":"true");s.tabIndex=i===n?0:-1});dots.forEach((d,i)=>d.classList.toggle("active",i===n))}let carouselTimer;function startCarousel(){clearInterval(carouselTimer);carouselTimer=setInterval(()=>showSlide((slideIndex+1)%slides.length),5000)}dots.forEach((d,i)=>d.addEventListener("click",()=>{showSlide(i);startCarousel()}));document.addEventListener("visibilitychange",()=>{if(document.hidden)clearInterval(carouselTimer);else startCarousel()});showSlide(0);startCarousel();load();
</script></body></html>
