<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo mayoreo | CAROLA</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#fff8fb;color:#222}header{background:#fff;padding:25px 18px;text-align:center;border-bottom:1px solid #f0dce5}.logo{font-size:28px;font-weight:900;letter-spacing:7px}main{width:min(1050px,94%);margin:28px auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.back{padding:11px 15px;border-radius:12px;background:#f7edf1;color:#222;text-decoration:none;font-weight:800}.card{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.05);padding:20px;margin-top:18px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input,.filters select,.row select,.row input{width:100%;padding:12px;border:1px solid #e5d9de;border-radius:12px;background:#fff;font:inherit}.grid{display:grid;gap:10px;margin-top:14px}.row{display:grid;grid-template-columns:1.1fr 1fr 1fr 130px auto;gap:10px;align-items:center;padding:12px;border:1px solid #f0dce5;border-radius:14px}.model{font-weight:900}.save{background:#171717;color:#fff;border:0;border-radius:11px;padding:12px 14px;font-weight:800}.muted{color:#888;font-size:12px}.status{margin-top:10px;color:#777}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row .model{grid-column:1/-1}.save{grid-column:1/-1}.filters{grid-template-columns:1fr}}</style></head>
<body><header><div class="logo">CAROLA</div><div class="muted">Catálogo mayoreo · inventario</div></header><main><div class="top"><div><h1 style="margin:0">Catálogo</h1><div class="muted">Modelo, color, categoría y existencia total. Sin tallas.</div></div><a class="back" href="/admin.html">← Administrador</a></div>
<div class="card"><div class="filters"><input id="q" type="search" placeholder="Buscar modelo o color"><select id="cat"><option value="">Todas las categorías</option></select></div><div id="status" class="status">Cargando…</div><div id="grid" class="grid"></div></div></main>
<script>
let password=sessionStorage.getItem("carolaAdminPassword")||"",data={modelos:[],variantes:[],inventario:[],categorias:[]};
async function call(body){if(!password)password=prompt("Contraseña de administrador")||"";const r=await fetch("/.netlify/functions/admin-catalogo-stock",{method:body?"POST":"GET",headers:{"Content-Type":"application/json","x-admin-password":password},body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401){sessionStorage.removeItem("carolaAdminPassword");password="";throw new Error("Contraseña incorrecta. Recarga para intentar de nuevo.")}if(!r.ok||!j.success)throw new Error(j.error||"Error");sessionStorage.setItem("carolaAdminPassword",password);return j}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function render(){const q=document.getElementById("q").value.toLowerCase().trim(),cv=document.getElementById("cat").value;const inv=new Map(data.inventario.map(x=>[Number(x.variante_id),x]));const rows=[];for(const m of data.modelos){if(cv&&m.categoria!==cv)continue;for(const v of data.variantes.filter(x=>Number(x.modelo_id)===Number(m.id))){if(q&&!String(m.modelo+" "+v.color).toLowerCase().includes(q))continue;const i=inv.get(Number(v.id));rows.push({m,v,stock:i?i.existencia:""})}}document.getElementById("status").textContent=rows.length+" colores";document.getElementById("grid").innerHTML=rows.map(({m,v,stock})=>'<div class="row"><div class="model">Modelo '+esc(m.modelo)+'</div><div>'+esc(v.color)+'</div><select class="category" data-model="'+m.id+'">'+data.categorias.map(c=>'<option '+(c.nombre===m.categoria?'selected':'')+'>'+esc(c.nombre)+'</option>').join("")+'</select><input class="stock" data-variant="'+v.id+'" type="number" min="0" step="1" value="'+stock+'" placeholder="Existencia"><button class="save" data-model="'+m.id+'" data-variant="'+v.id+'">Guardar</button></div>').join("")||'<div class="muted">No hay resultados.</div>'}
async function load(){try{data=await call();document.getElementById("cat").innerHTML='<option value="">Todas las categorías</option>'+data.categorias.map(c=>'<option>'+esc(c.nombre)+'</option>').join("");render()}catch(e){document.getElementById("status").textContent=e.message}}
document.getElementById("q").oninput=render;document.getElementById("cat").onchange=render;document.getElementById("grid").onclick=async e=>{const b=e.target.closest(".save");if(!b)return;const row=b.closest(".row"),existencia=Number(row.querySelector(".stock").value),categoria=row.querySelector(".category").value;b.disabled=true;b.textContent="Guardando…";try{await call({action:"save-category",modelo_id:Number(b.dataset.model),categoria});await call({action:"save-stock",variante_id:Number(b.dataset.variant),existencia});b.textContent="✓ Guardado";setTimeout(()=>b.textContent="Guardar",900);await load()}catch(err){alert(err.message);b.textContent="Guardar"}finally{b.disabled=false}};load();
</script></body></html>
