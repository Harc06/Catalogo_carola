name: Backup diario CAROLA

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/Mexico_City"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: https://gfkjdpuhbxfwajbkzfap.supabase.co
    steps:
      - uses: actions/checkout@v4

      - name: Validar secretos
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta SUPABASE_DB_URL."
            exit 1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Falta SUPABASE_SECRET_KEY."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Crear respaldo de base de datos
        run: |
          mkdir -p backup/database
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/data.sql --data-only --use-copy

      - name: Respaldar Storage Productos
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.parse
          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SECRET_KEY"]
          bucket="Productos"
          root=pathlib.Path("backup/storage")/bucket
          root.mkdir(parents=True, exist_ok=True)
          headers={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"}

          def list_folder(prefix="", offset=0):
              req=urllib.request.Request(
                  f"{base}/storage/v1/object/list/{urllib.parse.quote(bucket, safe='')}",
                  data=json.dumps({"prefix":prefix,"limit":1000,"offset":offset,"sortBy":{"column":"name","order":"asc"}}).encode(),
                  headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          files=[]
          def walk(prefix=""):
              offset=0
              while True:
                  items=list_folder(prefix,offset)
                  for item in items:
                      name=item.get("name")
                      if not name: continue
                      full=f"{prefix}/{name}" if prefix else name
                      if item.get("id") is None:
                          walk(full)
                      else:
                          files.append(full)
                  if len(items)<1000: break
                  offset+=1000
          walk()

          failed=[]
          for name in files:
              target=root/name
              target.parent.mkdir(parents=True, exist_ok=True)
              # La descarga autenticada de Storage usa /object/authenticated/{bucket}/{path}.
              url=f"{base}/storage/v1/object/authenticated/{urllib.parse.quote(bucket, safe='')}/{urllib.parse.quote(name, safe='/')}"
              req=urllib.request.Request(url,headers={"apikey":key,"Authorization":"Bearer "+key})
              # Un archivo que falla no detiene el respaldo: se registra y se sigue.
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data=r.read()
                  target.write_bytes(data)
              except Exception as e:
                  reason=getattr(e,"code",type(e).__name__)
                  failed.append(f"{name}\t{reason}")
                  print(f"::warning::No se pudo descargar {name}: {reason}")

          if not files:
              raise SystemExit("No se encontró ningún archivo en el bucket Productos")
          fallidos=pathlib.Path("backup/storage-fallidos.txt")
          fallidos.parent.mkdir(parents=True, exist_ok=True)
          fallidos.write_text("\n".join(failed)+("\n" if failed else ""), encoding="utf-8")
          print(f"Storage respaldado: {len(files)-len(failed)} de {len(files)} archivos")
          if failed:
              print(f"::error::Archivos no respaldados: {len(failed)}. Ver backup/storage-fallidos.txt")
          PY

      - name: Información del respaldo
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > backup/backup-created-utc.txt
          git rev-parse HEAD > backup/source-commit.txt
          find backup/storage/Productos -type f | wc -l > backup/storage-files-count.txt

      - name: Comprimir respaldo completo
        run: tar -czf carola-backup-completo.tar.gz backup

      - name: Guardar copia diaria
        uses: actions/upload-artifact@v4
        with:
          name: carola-backup-completo-${{ github.run_id }}
          path: carola-backup-completo.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Verificar respaldo completo
        run: |
          if [ -s backup/storage-fallidos.txt ]; then
            echo "::error::El respaldo se guardó, pero faltan archivos de Storage:"
            cat backup/storage-fallidos.txt
            exit 1
          fi
          echo "Respaldo completo: todos los archivos de Storage fueron descargados."
