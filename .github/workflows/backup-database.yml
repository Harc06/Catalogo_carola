name: Backup diario CAROLA

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/Mexico_City"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: https://gfkjdpuhbxfwajbkzfap.supabase.co
    steps:
      - uses: actions/checkout@v4

      - name: Validar secretos
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta SUPABASE_DB_URL."
            exit 1
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Falta SUPABASE_SECRET_KEY."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Crear respaldo de base de datos
        run: |
          mkdir -p backup/database
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/data.sql --data-only --use-copy

      - name: Respaldar Storage Productos
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.parse
          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SECRET_KEY"]
          bucket="Productos"
          root=pathlib.Path("backup/storage")/bucket
          root.mkdir(parents=True, exist_ok=True)
          headers={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"}
          offset=0
          total=0
          while True:
              req=urllib.request.Request(
                  f"{base}/storage/v1/object/list/{urllib.parse.quote(bucket, safe='')}",
                  data=json.dumps({"prefix":"","limit":1000,"offset":offset,"sortBy":{"column":"name","order":"asc"}}).encode(),
                  headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  items=json.load(r)
              if not items: break
              for item in items:
                  name=item.get("name")
                  if not name or item.get("id") is None: continue
                  target=root/name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  url=f"{base}/storage/v1/object/authenticated/{urllib.parse.quote(bucket, safe='')}/{urllib.parse.quote(name, safe='/')}"
                  dreq=urllib.request.Request(url,headers={"apikey":key,"Authorization":"Bearer "+key})
                  with urllib.request.urlopen(dreq) as r, open(target,"wb") as out:
                      out.write(r.read())
                  total+=1
              if len(items)<1000: break
              offset+=len(items)
          if total==0:
              raise SystemExit("No se descargó ningún archivo del bucket Productos")
          print(f"Storage respaldado: {total} archivos")
          PY

      - name: Información del respaldo
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > backup/backup-created-utc.txt
          git rev-parse HEAD > backup/source-commit.txt
          find backup/storage/Productos -type f | wc -l > backup/storage-files-count.txt

      - name: Comprimir respaldo completo
        run: tar -czf carola-backup-completo.tar.gz backup

      - name: Guardar copia diaria
        uses: actions/upload-artifact@v4
        with:
          name: carola-backup-completo-${{ github.run_id }}
          path: carola-backup-completo.tar.gz
          retention-days: 30
          if-no-files-found: error
