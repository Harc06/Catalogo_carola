<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Modelo | CAROLA</title>

<style>
:root{
  --pink:#f5dce7;
  --pink2:#fff5f8;
  --pink3:#e8b8cc;
  --text:#191919;
  --muted:#858085;
  --border:#eee5e9;
  --dark:#171717;
  --green:#2e7d49;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:70px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:1250px;
  height:100%;
  margin:auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

.back{
  justify-self:start;
  font-size:14px;
  font-weight:800;
}

.brand{
  font-size:24px;
  font-weight:900;
  letter-spacing:7px;
}

.cart-link{
  justify-self:end;
  border:0;
  background:var(--dark);
  color:#fff;
  padding:10px 15px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  white-space:nowrap;
}

/* =========================
   PRODUCTO
========================= */

.product-page{
  max-width:1250px;
  margin:auto;
  padding:40px 24px 100px;
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);
  gap:55px;
}

/* =========================
   GALERÍA
========================= */

.gallery{
  min-width:0;
}

.main-image-wrap{
  width:100%;
  aspect-ratio:4/5;
  border-radius:26px;
  overflow:hidden;
  background:#f6f3f4;
  position:relative;
}

.main-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:opacity .18s ease;
}

.image-color{
  position:absolute;
  left:14px;
  bottom:14px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:11px;
  font-weight:900;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.thumbnails{
  display:flex;
  gap:10px;
  margin-top:12px;
  overflow-x:auto;
  padding:2px 1px 7px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
}

.thumbnails::-webkit-scrollbar{
  display:none;
}

.thumbnail{
  width:88px;
  height:105px;
  flex:0 0 auto;
  padding:0;
  border:2px solid transparent;
  border-radius:13px;
  overflow:hidden;
  background:#f5f5f5;
  scroll-snap-align:start;
}

.thumbnail.active{
  border-color:#171717;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================
   INFORMACIÓN
========================= */

.info{
  padding-top:25px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:900;
  color:#8d8589;
}

h1{
  margin:10px 0 0;
  font-size:45px;
  letter-spacing:-2px;
  line-height:1.05;
}

.available{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:14px;
  padding:8px 12px;
  background:#eff8f1;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.available::before{
  content:"";
  width:7px;
  height:7px;
  background:#39a15b;
  border-radius:50%;
}

.divider{
  height:1px;
  background:var(--border);
  margin:27px 0;
}

.label{
  display:block;
  font-size:13px;
  font-weight:900;
  margin-bottom:12px;
}

.selected-color{
  color:var(--muted);
  font-weight:600;
}

/* =========================
   COLORES
========================= */

.color-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.color-button{
  border:1px solid var(--border);
  background:#fff;
  padding:12px 17px;
  border-radius:999px;
  font-weight:750;
  min-height:44px;
  transition:
    background .15s,
    color .15s,
    border-color .15s,
    transform .1s;
}

.color-button:active{
  transform:scale(.97);
}

.color-button.active{
  background:#171717;
  color:#fff;
  border-color:#171717;
}

/* =========================
   CANTIDAD
========================= */

.quantity-selector{
  display:flex;
  align-items:center;
  gap:16px;
}

.quantity-selector button{
  width:48px;
  height:48px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:13px;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.quantity-selector button:active{
  background:#f7f3f5;
}

.quantity-value{
  min-width:90px;
  text-align:center;
}

.quantity-value strong{
  display:block;
  font-size:23px;
}

.quantity-value span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

/* =========================
   AGREGAR
========================= */

.add-cart{
  width:100%;
  border:0;
  background:#171717;
  color:#fff;
  padding:17px 20px;
  border-radius:15px;
  font-weight:900;
  margin-top:28px;
  font-size:15px;
  transition:.2s;
}

.add-cart:active{
  transform:scale(.99);
}

.add-cart.added{
  background:var(--green);
}

.continue{
  display:block;
  text-align:center;
  margin-top:16px;
  font-size:13px;
  font-weight:800;
}

.note{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:11px;
}

/* =========================
   CARGA
========================= */

.loading{
  grid-column:1/-1;
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

.loader{
  width:30px;
  height:30px;
  margin-bottom:15px;
  border:3px solid #eadde3;
  border-top-color:#222;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   ERROR
========================= */

.error{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
}

.error h2{
  font-size:30px;
}

.error p{
  color:var(--muted);
}

.error a{
  display:inline-block;
  margin-top:15px;
  background:#171717;
  color:#fff;
  padding:13px 20px;
  border-radius:999px;
  font-weight:800;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:800;
  transform:translate(-50%,30px);
  background:#171717;
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  white-space:nowrap;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* =========================
   TABLET
========================= */

@media(max-width:800px){

  .product-page{
    grid-template-columns:1fr;
    gap:15px;
    padding-top:18px;
  }

  .info{
    padding-top:15px;
  }
}

/* =========================
   MÓVIL
========================= */

@media(max-width:520px){

  .header{
    height:62px;
  }

  .header-inner{
    padding:0 14px;
  }

  .brand{
    font-size:18px;
    letter-spacing:4px;
  }

  .back{
    font-size:0;
  }

  .back::before{
    content:"←";
    font-size:23px;
  }

  .cart-link{
    padding:9px 11px;
    font-size:11px;
  }

  .product-page{
    padding:14px 14px 70px;
  }

  .main-image-wrap{
    border-radius:20px;
  }

  .thumbnail{
    width:70px;
    height:84px;
  }

  h1{
    font-size:36px;
  }

  .color-button{
    padding:11px 15px;
    font-size:13px;
  }

  .add-cart{
    min-height:52px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <a href="/" class="back">
      ← Catálogo
    </a>

    <a href="/" class="brand">
      CAROLA
    </a>

    <a
      href="/?carrito=1"
      id="cartLink"
      class="cart-link"
    >
      Pedido · 0 pares
    </a>

  </div>

</header>

<main
  id="productPage"
  class="product-page"
>

  <div class="loading">

    <div class="loader"></div>

    Cargando modelo...

  </div>

</main>

<div
  id="toast"
  class="toast"
>
  ✓ Agregado al pedido
</div>

<script>

/* =========================
   CONFIGURACIÓN
========================= */

const CART_KEY=
  "carola_cart_v2";

const OLD_CART_KEY=
  "carola_cart_v1";

/* =========================
   URL
========================= */

const params=
  new URLSearchParams(
    window.location.search
  );

const requestedModel=
  params.get("modelo");

/* =========================
   ELEMENTOS
========================= */

const productPage=
  document.getElementById(
    "productPage"
  );

const cartLink=
  document.getElementById(
    "cartLink"
  );

/* =========================
   VARIABLES
========================= */

let currentProduct=null;
let currentVariant=null;
let quantity=6;

/* =========================
   NORMALIZACIÓN
========================= */

function normalize(value){

  return String(value||"")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}

function normalizeModel(value){

  return normalize(value)
    .replace(/\s+/g," ");
}

/* =========================
   PRESENTACIÓN DE COLOR
========================= */

function formatColor(value){

  const original=
    String(value||"")
      .trim();

  if(!original){
    return "";
  }

  const normalized=
    normalize(original);

  const names={

    "negro":"Negro",

    "camel":"Camel",

    "latte":"Latte",

    "maquillaje":"Maquillaje",

    "conac":"Coñac",

    "cafe":"Café",

    "capuchino":"Capuchino",

    "espresso":"Espresso",

    "shedron":"Shedrón",

    "blanco":"Blanco",

    "beige":"Beige",

    "hueso":"Hueso",

    "rojo":"Rojo",

    "vino":"Vino",

    "rosa":"Rosa",

    "dorado":"Dorado",

    "plata":"Plata",

    "azul":"Azul",

    "marino":"Marino",

    "miel":"Miel",

    "chocolate":"Chocolate",

    "taupe":"Taupe"
  };

  if(names[normalized]){
    return names[normalized];
  }

  return original
    .toLowerCase()
    .replace(
      /(^|\s)\S/g,
      function(letter){
        return letter.toUpperCase();
      }
    );
}

/* =========================
   FOTOS
========================= */

function sortImages(images){

  return (images||[])
    .slice()
    .sort(
      function(a,b){

        const difference=
          Number(a.orden||0)-
          Number(b.orden||0);

        if(difference!==0){
          return difference;
        }

        return (
          Number(a.id||0)-
          Number(b.id||0)
        );
      }
    );
}

function getVariantCover(
  variant
){

  const images=
    sortImages(
      variant?.imagenes
    );

  return images[0]?.url||"";
}

/* =========================
   CARRITO
========================= */

function loadCart(){

  try{

    let raw=
      localStorage.getItem(
        CART_KEY
      );

    if(!raw){

      raw=
        localStorage.getItem(
          OLD_CART_KEY
        );
    }

    const data=
      JSON.parse(
        raw||"[]"
      );

    if(!Array.isArray(data)){
      return [];
    }

    return data
      .filter(
        item=>
          item &&
          item.modelo &&
          item.color
      )
      .map(
        function(item){

          let cantidad=
            Number(
              item.cantidad||6
            );

          if(
            !Number.isFinite(
              cantidad
            ) ||
            cantidad<6
          ){
            cantidad=6;
          }

          cantidad=
            Math.ceil(
              cantidad/6
            )*6;

          return {

            modelo:
              String(
                item.modelo
              ),

            color:
              String(
                item.color
              ),

            cantidad,

            image:
              item.image||""
          };
        }
      );

  }catch(error){

    return [];
  }
}

function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  updateCartCount();
}

function getCartTotal(){

  return loadCart()
    .reduce(
      function(total,item){

        return total+
          Number(
            item.cantidad||0
          );
      },
      0
    );
}

function updateCartCount(){

  const total=
    getCartTotal();

  cartLink.textContent=
    "Pedido · "+
    total+
    " pares";
}

/* =========================
   AGREGAR AL CARRITO
========================= */

function addToCart(){

  if(
    !currentProduct ||
    !currentVariant
  ){
    return;
  }

  const cart=
    loadCart();

  const existing=
    cart.find(
      function(item){

        return (

          normalizeModel(
            item.modelo
          )===
          normalizeModel(
            currentProduct.modelo
          )

          &&

          normalize(
            item.color
          )===
          normalize(
            currentVariant.color
          )
        );
      }
    );

  const image=
    getVariantCover(
      currentVariant
    );

  if(existing){

    existing.cantidad=
      Number(
        existing.cantidad||0
      )+
      quantity;

    if(!existing.image){
      existing.image=image;
    }

  }else{

    cart.push({

      modelo:
        String(
          currentProduct.modelo
        ),

      color:
        String(
          currentVariant.color
        ),

      cantidad:
        quantity,

      image:
        image
    });
  }

  saveCart(cart);

  showToast(
    "✓ "+
    quantity+
    " pares · "+
    formatColor(
      currentVariant.color
    )
  );

  const button=
    document.getElementById(
      "addCartButton"
    );

  if(button){

    button.classList.add(
      "added"
    );

    button.textContent=
      "✓ Agregado al pedido";

    setTimeout(
      function(){

        button.classList.remove(
          "added"
        );

        button.textContent=
          "Agregar "+
          quantity+
          " pares al pedido";

      },
      1300
    );
  }
}

/* =========================
   CARGAR PRODUCTO
========================= */

async function loadProduct(){

  if(!requestedModel){

    showError(
      "No encontramos este modelo."
    );

    return;
  }

  try{

    const [
      supabaseResponse,
      treintaResponse
    ]=
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t="+
          Date.now(),
          {
            cache:"no-store"
          }
        ),

        fetch(
          "/.netlify/functions/treinta?t="+
          Date.now(),
          {
            cache:"no-store"
          }
        )

      ]);

    const supabaseData=
      await supabaseResponse.json();

    const treintaData=
      await treintaResponse.json();

    if(
      !supabaseResponse.ok ||
      !supabaseData.success
    ){

      throw new Error(
        "Supabase error"
      );
    }

    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){

      throw new Error(
        "Treinta error"
      );
    }

    /* BUSCAR EN SUPABASE */

    const products=
      Array.isArray(
        supabaseData.productos
      )
        ?supabaseData.productos
        :[];

    currentProduct=
      products.find(
        function(product){

          return (
            normalizeModel(
              product.modelo
            )===
            normalizeModel(
              requestedModel
            )
          );
        }
      );

    if(!currentProduct){

      showError(
        "No encontramos este modelo."
      );

      return;
    }

    /* VERIFICAR TREINTA */

    const treintaProducts=
      Array.isArray(
        treintaData.products
      )
        ?treintaData.products
        :[];

    const available=
      treintaProducts.some(
        function(item){

          return (
            normalizeModel(
              item.name
            )===
            normalizeModel(
              currentProduct.modelo
            )
          );
        }
      );

    if(!available){

      showError(
        "Este modelo no está disponible actualmente."
      );

      return;
    }

    /* VARIANTES CON FOTOS */

    currentProduct.variantes=
      (
        Array.isArray(
          currentProduct.variantes
        )
          ?currentProduct.variantes
          :[]
      )
      .filter(
        function(variant){

          return (
            Array.isArray(
              variant.imagenes
            )
            &&
            variant.imagenes.length
          );
        }
      );

    if(
      !currentProduct
        .variantes
        .length
    ){

      showError(
        "Este modelo todavía no tiene fotografías."
      );

      return;
    }

    currentVariant=
      currentProduct
        .variantes[0];

    document.title=
      "Modelo "+
      currentProduct.modelo+
      " | CAROLA";

    renderProduct();

  }catch(error){

    console.error(
      error
    );

    showError(
      "No pudimos cargar este modelo."
    );
  }
}

/* =========================
   RENDER PRODUCTO
========================= */

function renderProduct(){

  const images=
    sortImages(
      currentVariant.imagenes
    );

  if(!images.length){

    showError(
      "Este color no tiene fotografías."
    );

    return;
  }

  const formattedColor=
    formatColor(
      currentVariant.color
    );

  const thumbnails=
    images
      .map(
        function(image,index){

          return `

            <button
              type="button"
              class="thumbnail ${
                index===0
                  ?"active"
                  :""
              }"
              data-url="${escapeAttribute(image.url)}"
              aria-label="Ver fotografía ${index+1}"
            >

              <img
                src="${escapeAttribute(image.url)}"
                alt="Modelo ${escapeAttribute(currentProduct.modelo)} ${escapeAttribute(formattedColor)}"
                loading="${index===0?"eager":"lazy"}"
              >

            </button>

          `;
        }
      )
      .join("");

  const colorButtons=
    currentProduct
      .variantes
      .map(
        function(variant){

          return `

            <button
              type="button"
              class="color-button ${
                Number(variant.id)===
                Number(currentVariant.id)
                  ?"active"
                  :""
              }"
              data-variant="${Number(variant.id)}"
            >

              ${escapeHtml(
                formatColor(
                  variant.color
                )
              )}

            </button>

          `;
        }
      )
      .join("");

  productPage.innerHTML=`

    <section class="gallery">

      <div class="main-image-wrap">

        <img
          id="mainImage"
          class="main-image"
          src="${escapeAttribute(images[0].url)}"
          alt="Modelo ${escapeAttribute(currentProduct.modelo)} ${escapeAttribute(formattedColor)}"
        >

        <div class="image-color">
          ${escapeHtml(formattedColor)}
        </div>

      </div>

      ${
        images.length>1
          ?`
            <div class="thumbnails">
              ${thumbnails}
            </div>
          `
          :""
      }

    </section>

    <section class="info">

      <span class="eyebrow">
        Calzado Carola
      </span>

      <h1>
        Modelo ${escapeHtml(currentProduct.modelo)}
      </h1>

      <span class="available">
        Disponible
      </span>

      <div class="divider"></div>

      <span class="label">
        Color:
        <span class="selected-color">
          ${escapeHtml(formattedColor)}
        </span>
      </span>

      <div class="color-buttons">
        ${colorButtons}
      </div>

      <div class="divider"></div>

      <span class="label">
        Cantidad
      </span>

      <div class="quantity-selector">

        <button
          id="minusQuantity"
          type="button"
          aria-label="Restar 6 pares"
        >
          −
        </button>

        <div class="quantity-value">

          <strong id="quantityValue">
            ${quantity}
          </strong>

          <span>
            pares
          </span>

        </div>

        <button
          id="plusQuantity"
          type="button"
          aria-label="Agregar 6 pares"
        >
          +
        </button>

      </div>

      <button
        id="addCartButton"
        class="add-cart"
        type="button"
      >
        Agregar ${quantity} pares al pedido
      </button>

      <a
        href="/"
        class="continue"
      >
        ← Seguir viendo modelos
      </a>

      <div class="note">
        Venta en múltiplos de 6 pares.
      </div>

    </section>

  `;
}

/* =========================
   INTERACCIONES
========================= */

productPage.onclick=
  function(event){

    /* CAMBIAR FOTO */

    const thumbnail=
      event.target.closest(
        ".thumbnail"
      );

    if(thumbnail){

      const mainImage=
        document.getElementById(
          "mainImage"
        );

      if(mainImage){

        mainImage.style.opacity=
          ".45";

        const nextUrl=
          thumbnail.dataset.url;

        const tempImage=
          new Image();

        tempImage.onload=
          function(){

            mainImage.src=
              nextUrl;

            mainImage.style.opacity=
              "1";
          };

        tempImage.onerror=
          function(){

            mainImage.src=
              nextUrl;

            mainImage.style.opacity=
              "1";
          };

        tempImage.src=
          nextUrl;
      }

      document
        .querySelectorAll(
          ".thumbnail"
        )
        .forEach(
          function(item){

            item.classList.remove(
              "active"
            );
          }
        );

      thumbnail.classList.add(
        "active"
      );

      return;
    }

    /* CAMBIAR COLOR */

    const colorButton=
      event.target.closest(
        ".color-button"
      );

    if(colorButton){

      const id=
        Number(
          colorButton.dataset.variant
        );

      const variant=
        currentProduct
          .variantes
          .find(
            function(item){

              return (
                Number(item.id)===
                id
              );
            }
          );

      if(!variant){
        return;
      }

      if(
        Number(currentVariant.id)===
        Number(variant.id)
      ){
        return;
      }

      currentVariant=
        variant;

      renderProduct();

      return;
    }

    /* SUMAR 6 */

    if(
      event.target.closest(
        "#plusQuantity"
      )
    ){

      quantity+=6;

      updateQuantity();

      return;
    }

    /* RESTAR 6 */

    if(
      event.target.closest(
        "#minusQuantity"
      )
    ){

      quantity=
        Math.max(
          6,
          quantity-6
        );

      updateQuantity();

      return;
    }

    /* AGREGAR */

    if(
      event.target.closest(
        "#addCartButton"
      )
    ){

      addToCart();

      return;
    }
  };

/* =========================
   ACTUALIZAR CANTIDAD
========================= */

function updateQuantity(){

  const value=
    document.getElementById(
      "quantityValue"
    );

  const button=
    document.getElementById(
      "addCartButton"
    );

  if(value){

    value.textContent=
      quantity;
  }

  if(button){

    button.textContent=
      "Agregar "+
      quantity+
      " pares al pedido";
  }
}

/* =========================
   TOAST
========================= */

function showToast(text){

  const toast=
    document.getElementById(
      "toast"
    );

  toast.textContent=
    text;

  toast.classList.add(
    "show"
  );

  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    1600
  );
}

/* =========================
   ERROR
========================= */

function showError(
  message=
    "No encontramos este modelo."
){

  productPage.innerHTML=`

    <div class="error">

      <h2>
        ${escapeHtml(message)}
      </h2>

      <p>
        Regresa al catálogo para ver
        los modelos disponibles.
      </p>

      <a href="/">
        Ver catálogo
      </a>

    </div>

  `;
}

/* =========================
   SEGURIDAD HTML
========================= */

function escapeHtml(value){

  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttribute(value){

  return escapeHtml(
    value
  );
}

/* =========================
   INICIAR
========================= */

updateCartCount();

loadProduct();

</script>

</html>
