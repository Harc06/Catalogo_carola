<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Modelo | CAROLA</title>

<style>
:root{
  --pink:#f5dce7;
  --pink2:#fff5f8;
  --pink3:#e8b8cc;
  --text:#191919;
  --muted:#858085;
  --border:#eee5e9;
  --dark:#171717;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* HEADER */

.header{
  height:72px;
  border-bottom:1px solid var(--border);
  background:#fff;
}

.header-inner{
  max-width:1250px;
  height:100%;
  margin:auto;
  padding:0 24px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

.back{
  justify-self:start;
  font-size:14px;
  font-weight:700;
}

.brand{
  font-size:24px;
  font-weight:800;
  letter-spacing:7px;
}

.cart-link{
  justify-self:end;
  border:0;
  background:#171717;
  color:#fff;
  padding:10px 15px;
  border-radius:999px;
  font-weight:750;
  font-size:13px;
}

/* PRODUCTO */

.product-page{
  max-width:1250px;
  margin:auto;
  padding:40px 24px 100px;
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);
  gap:55px;
}

/* GALERÍA */

.gallery{
  min-width:0;
}

.main-image-wrap{
  width:100%;
  aspect-ratio:4/5;
  border-radius:26px;
  overflow:hidden;
  background:#f6f3f4;
}

.main-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumbnails{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:12px 0 5px;
  scrollbar-width:none;
}

.thumbnails::-webkit-scrollbar{
  display:none;
}

.thumbnail{
  width:88px;
  height:105px;
  flex:none;
  padding:0;
  border:2px solid transparent;
  border-radius:13px;
  overflow:hidden;
  background:#f5f5f5;
}

.thumbnail.active{
  border-color:#171717;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* INFO */

.info{
  padding-top:25px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:800;
  color:#8d8589;
}

h1{
  margin:10px 0 0;
  font-size:45px;
  letter-spacing:-2px;
}

.available{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:14px;
  padding:8px 12px;
  background:#eff8f1;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.available::before{
  content:"";
  width:7px;
  height:7px;
  background:#39a15b;
  border-radius:50%;
}

.divider{
  height:1px;
  background:var(--border);
  margin:27px 0;
}

.label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:12px;
}

/* COLORES */

.color-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.color-button{
  border:1px solid var(--border);
  background:#fff;
  padding:12px 17px;
  border-radius:999px;
  font-weight:650;
}

.color-button.active{
  background:#171717;
  color:#fff;
  border-color:#171717;
}

/* CANTIDAD */

.quantity-selector{
  display:flex;
  align-items:center;
  gap:14px;
}

.quantity-selector button{
  width:46px;
  height:46px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:13px;
  font-size:24px;
}

.quantity-value{
  min-width:90px;
  text-align:center;
}

.quantity-value strong{
  display:block;
  font-size:21px;
}

.quantity-value span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}

/* AGREGAR */

.add-cart{
  width:100%;
  border:0;
  background:#171717;
  color:#fff;
  padding:17px 20px;
  border-radius:15px;
  font-weight:800;
  margin-top:28px;
  font-size:15px;
}

.add-cart.added{
  background:#2e7d49;
}

.continue{
  display:block;
  text-align:center;
  margin-top:15px;
  font-size:13px;
  font-weight:700;
}

.note{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:11px;
}

/* ESTADOS */

.loading{
  grid-column:1/-1;
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

.loader{
  width:30px;
  height:30px;
  margin-bottom:15px;
  border:3px solid #eadde3;
  border-top-color:#222;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
}

.error a{
  display:inline-block;
  margin-top:15px;
  background:#171717;
  color:#fff;
  padding:13px 20px;
  border-radius:999px;
}

/* MÓVIL */

@media(max-width:800px){

  .product-page{
    grid-template-columns:1fr;
    gap:15px;
    padding-top:18px;
  }

  .info{
    padding-top:15px;
  }
}

@media(max-width:520px){

  .header{
    height:64px;
  }

  .header-inner{
    padding:0 14px;
  }

  .brand{
    font-size:18px;
    letter-spacing:4px;
  }

  .back{
    font-size:0;
  }

  .back::before{
    content:"←";
    font-size:23px;
  }

  .cart-link{
    padding:9px 11px;
    font-size:11px;
  }

  .product-page{
    padding:14px 14px 70px;
  }

  .main-image-wrap{
    border-radius:20px;
  }

  .thumbnail{
    width:70px;
    height:84px;
  }

  h1{
    font-size:36px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <a
      href="/"
      class="back"
    >
      ← Catálogo
    </a>


    <a
      href="/"
      class="brand"
    >
      CAROLA
    </a>


    <a
      href="/?carrito=1"
      id="cartLink"
      class="cart-link"
    >
      Pedido · 0
    </a>

  </div>

</header>


<main
  id="productPage"
  class="product-page"
>

  <div class="loading">

    <div class="loader"></div>

    Cargando modelo...

  </div>

</main>


<script>

/* ==========================
   CONFIGURACIÓN
========================== */

const CART_KEY =
  "carola_cart_v1";


const params =
  new URLSearchParams(
    window.location.search
  );


const requestedModel =
  params.get("modelo");


const productPage =
  document.getElementById(
    "productPage"
  );


const cartLink =
  document.getElementById(
    "cartLink"
  );


let currentProduct = null;

let currentVariant = null;

let quantity = 6;


/* ==========================
   NORMALIZAR
========================== */

function normalize(value){

  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


function normalizeModel(value){

  const text =
    normalize(value);

  const match =
    text.match(
      /[a-z]*\s*\d+[a-z]*/i
    );

  if(match){

    return match[0]
      .replace(/\s+/g,"");
  }

  return text;
}


/* ==========================
   FOTOS
========================== */

function sortImages(images){

  return (images || [])
    .slice()
    .sort((a,b) => {

      const difference =
        Number(a.orden || 0) -
        Number(b.orden || 0);

      if(difference !== 0){
        return difference;
      }

      return (
        Number(a.id || 0) -
        Number(b.id || 0)
      );
    });
}


/* ==========================
   CARRITO
========================== */

function loadCart(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          CART_KEY
        ) || "[]"
      );

    return Array.isArray(saved)
      ? saved
      : [];

  }catch(error){

    return [];
  }
}


function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  updateCartCount();
}


function getCartTotal(){

  return loadCart()
    .reduce(
      (total,item) =>
        total +
        Number(
          item.cantidad || 0
        ),
      0
    );
}


function updateCartCount(){

  const total =
    getCartTotal();

  cartLink.textContent =
    "Pedido · " +
    total;
}


function addToCart(){

  if(
    !currentProduct ||
    !currentVariant
  ){
    return;
  }


  const cart =
    loadCart();


  /*
   * MISMO MODELO + MISMO COLOR
   * = SUMAR CANTIDADES
   *
   * Coñac = conac
   */

  const existing =
    cart.find(
      item =>
        normalizeModel(
          item.modelo
        ) ===
        normalizeModel(
          currentProduct.modelo
        ) &&
        normalize(
          item.color
        ) ===
        normalize(
          currentVariant.color
        )
    );


  if(existing){

    existing.cantidad =
      Number(
        existing.cantidad || 0
      ) +
      quantity;

  }else{

    cart.push({
      modelo:
        String(
          currentProduct.modelo
        ),

      color:
        String(
          currentVariant.color
        ),

      cantidad:
        quantity
    });
  }


  saveCart(cart);


  const button =
    document.getElementById(
      "addCartButton"
    );


  if(button){

    const original =
      button.textContent;

    button.textContent =
      "✓ Agregado al pedido";

    button.classList.add(
      "added"
    );


    setTimeout(
      function(){

        button.textContent =
          original;

        button.classList.remove(
          "added"
        );

      },
      1400
    );
  }
}


/* ==========================
   CARGAR PRODUCTO
========================== */

async function loadProduct(){

  if(!requestedModel){

    showError();

    return;
  }


  try{

    const [
      supabaseResponse,
      treintaResponse
    ] =
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t=" +
          Date.now(),
          {
            cache:"no-store"
          }
        ),

        fetch(
          "/.netlify/functions/treinta?t=" +
          Date.now(),
          {
            cache:"no-store"
          }
        )

      ]);


    const supabaseData =
      await supabaseResponse.json();

    const treintaData =
      await treintaResponse.json();


    if(
      !supabaseResponse.ok ||
      !supabaseData.success
    ){
      throw new Error();
    }


    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){
      throw new Error();
    }


    const products =
      Array.isArray(
        supabaseData.productos
      )
        ? supabaseData.productos
        : [];


    currentProduct =
      products.find(
        product =>
          normalizeModel(
            product.modelo
          ) ===
          normalizeModel(
            requestedModel
          )
      );


    if(!currentProduct){

      showError();

      return;
    }


    /*
     * TREINTA USA "products"
     */

    const treintaProducts =
      Array.isArray(
        treintaData.products
      )
        ? treintaData.products
        : [];


    const available =
      treintaProducts.some(
        item =>
          normalizeModel(
            item.name
          ) ===
          normalizeModel(
            currentProduct.modelo
          )
      );


    if(!available){

      showError(
        "Este modelo no está disponible actualmente."
      );

      return;
    }


    currentProduct.variantes =
      (
        Array.isArray(
          currentProduct.variantes
        )
          ? currentProduct.variantes
          : []
      )
      .filter(
        variant =>
          Array.isArray(
            variant.imagenes
          ) &&
          variant.imagenes.length
      );


    if(
      !currentProduct
        .variantes
        .length
    ){

      showError(
        "Este modelo todavía no tiene fotografías."
      );

      return;
    }


    currentVariant =
      currentProduct
        .variantes[0];


    document.title =
      "Modelo " +
      currentProduct.modelo +
      " | CAROLA";


    renderProduct();


  }catch(error){

    console.error(error);

    showError(
      "No pudimos cargar este modelo."
    );
  }
}


/* ==========================
   MOSTRAR PRODUCTO
========================== */

function renderProduct(){

  const images =
    sortImages(
      currentVariant.imagenes
    );


  if(!images.length){

    showError();

    return;
  }


  const thumbnails =
    images
      .map(
        (image,index) => `

          <button
            type="button"
            class="thumbnail ${
              index === 0
                ? "active"
                : ""
            }"
            data-url="${escapeAttribute(image.url)}"
          >

            <img
              src="${escapeAttribute(image.url)}"
              alt=""
            >

          </button>

        `
      )
      .join("");


  const colorButtons =
    currentProduct
      .variantes
      .map(
        variant => `

          <button
            type="button"
            class="color-button ${
              Number(variant.id) ===
              Number(currentVariant.id)
                ? "active"
                : ""
            }"
            data-variant="${Number(variant.id)}"
          >

            ${escapeHtml(variant.color)}

          </button>

        `
      )
      .join("");


  productPage.innerHTML = `

    <section class="gallery">

      <div class="main-image-wrap">

        <img
          id="mainImage"
          class="main-image"
          src="${escapeAttribute(images[0].url)}"
          alt="Modelo ${escapeAttribute(currentProduct.modelo)} ${escapeAttribute(currentVariant.color)}"
        >

      </div>


      <div class="thumbnails">
        ${thumbnails}
      </div>

    </section>


    <section class="info">

      <span class="eyebrow">
        Calzado Carola
      </span>


      <h1>
        Modelo ${escapeHtml(currentProduct.modelo)}
      </h1>


      <span class="available">
        Disponible
      </span>


      <div class="divider"></div>


      <span class="label">
        Color
      </span>


      <div class="color-buttons">
        ${colorButtons}
      </div>


      <div class="divider"></div>


      <span class="label">
        Cantidad
      </span>


      <div class="quantity-selector">

        <button
          id="minusQuantity"
          type="button"
        >
          −
        </button>


        <div class="quantity-value">

          <strong id="quantityValue">
            ${quantity}
          </strong>

          <span>
            pares
          </span>

        </div>


        <button
          id="plusQuantity"
          type="button"
        >
          +
        </button>

      </div>


      <button
        id="addCartButton"
        class="add-cart"
        type="button"
      >
        Agregar ${quantity} pares al pedido
      </button>


      <a
        href="/"
        class="continue"
      >
        ← Seguir viendo modelos
      </a>


      <div class="note">
        Venta en múltiplos de 6 pares.
      </div>

    </section>

  `;
}


/* ==========================
   INTERACCIONES
========================== */

productPage.onclick =
  function(event){


    /* FOTO */

    const thumbnail =
      event.target.closest(
        ".thumbnail"
      );


    if(thumbnail){

      const mainImage =
        document.getElementById(
          "mainImage"
        );


      if(mainImage){

        mainImage.src =
          thumbnail.dataset.url;
      }


      document
        .querySelectorAll(
          ".thumbnail"
        )
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      thumbnail.classList.add(
        "active"
      );


      return;
    }


    /* COLOR */

    const colorButton =
      event.target.closest(
        ".color-button"
      );


    if(colorButton){

      const id =
        Number(
          colorButton.dataset.variant
        );


      const variant =
        currentProduct
          .variantes
          .find(
            item =>
              Number(item.id) ===
              id
          );


      if(!variant){
        return;
      }


      currentVariant =
        variant;


      renderProduct();


      return;
    }


    /* +6 */

    if(
      event.target.closest(
        "#plusQuantity"
      )
    ){

      quantity += 6;

      updateQuantity();

      return;
    }


    /* -6 */

    if(
      event.target.closest(
        "#minusQuantity"
      )
    ){

      quantity =
        Math.max(
          6,
          quantity - 6
        );


      updateQuantity();

      return;
    }


    /* AGREGAR */

    if(
      event.target.closest(
        "#addCartButton"
      )
    ){

      addToCart();

      return;
    }
  };


function updateQuantity(){

  const value =
    document.getElementById(
      "quantityValue"
    );


  const button =
    document.getElementById(
      "addCartButton"
    );


  if(value){

    value.textContent =
      quantity;
  }


  if(button){

    button.textContent =
      "Agregar " +
      quantity +
      " pares al pedido";
  }
}


/* ==========================
   ERROR
========================== */

function showError(
  message =
    "No encontramos este modelo."
){

  productPage.innerHTML = `

    <div class="error">

      <h2>
        ${escapeHtml(message)}
      </h2>

      <p>
        Regresa al catálogo para ver
        los modelos disponibles.
      </p>

      <a href="/">
        Ver catálogo
      </a>

    </div>

  `;
}


/* ==========================
   SEGURIDAD
========================== */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttribute(value){

  return escapeHtml(value);
}


/* ==========================
   INICIAR
========================== */

updateCartCount();

loadProduct();

</script>

</body>
</html>
