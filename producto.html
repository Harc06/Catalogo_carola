<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Modelo | CAROLA</title>

<style>
:root{
  --pink:#f5dce7;
  --pink2:#fff5f8;
  --pink3:#e8b8cc;
  --text:#191919;
  --muted:#858085;
  --border:#eee5e9;
  --dark:#171717;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* HEADER */

.header{
  height:72px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  background:#fff;
}

.header-inner{
  width:min(1250px,100%);
  padding:0 24px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

.back{
  justify-self:start;
  font-size:14px;
  font-weight:700;
}

.brand{
  font-size:24px;
  font-weight:800;
  letter-spacing:7px;
}

.share{
  justify-self:end;
  border:0;
  background:var(--pink2);
  padding:10px 15px;
  border-radius:999px;
  font-weight:700;
}

/* PRODUCTO */

.product-page{
  max-width:1250px;
  margin:auto;
  padding:40px 24px 100px;
  display:grid;
  grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);
  gap:55px;
}

/* GALERÍA */

.gallery{
  min-width:0;
}

.main-image-wrap{
  width:100%;
  aspect-ratio:4/5;
  border-radius:26px;
  overflow:hidden;
  background:#f6f3f4;
}

.main-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.thumbnails{
  display:flex;
  gap:10px;
  margin-top:12px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.thumbnails::-webkit-scrollbar{
  display:none;
}

.thumbnail{
  width:88px;
  height:105px;
  flex:0 0 auto;
  padding:0;
  border:2px solid transparent;
  border-radius:13px;
  overflow:hidden;
  background:#f5f5f5;
}

.thumbnail.active{
  border-color:#222;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* INFORMACIÓN */

.info{
  padding-top:25px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:800;
  color:#8d8589;
}

h1{
  margin:10px 0 0;
  font-size:45px;
  letter-spacing:-2px;
}

.available{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:14px;
  padding:8px 12px;
  background:#eff8f1;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.available::before{
  content:"";
  width:7px;
  height:7px;
  background:#39a15b;
  border-radius:50%;
}

.divider{
  height:1px;
  background:var(--border);
  margin:28px 0;
}

.label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:13px;
}

.color-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.color-button{
  border:1px solid var(--border);
  background:#fff;
  padding:12px 17px;
  border-radius:999px;
  font-weight:650;
}

.color-button.active{
  background:var(--dark);
  border-color:var(--dark);
  color:#fff;
}

/* WHATSAPP */

.whatsapp{
  display:flex;
  width:100%;
  justify-content:center;
  align-items:center;
  gap:9px;
  margin-top:30px;
  padding:17px 20px;
  border-radius:15px;
  background:#171717;
  color:#fff;
  font-weight:800;
  font-size:15px;
}

.help{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:12px;
}

/* CARGA */

.loading{
  grid-column:1/-1;
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

.loader{
  width:30px;
  height:30px;
  margin-bottom:15px;
  border:3px solid #eadde3;
  border-top-color:#222;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ERROR */

.error{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
}

.error h2{
  font-size:30px;
}

.error a{
  display:inline-block;
  margin-top:15px;
  background:#171717;
  color:#fff;
  padding:13px 20px;
  border-radius:999px;
}

/* RESPONSIVE */

@media(max-width:800px){

  .product-page{
    grid-template-columns:1fr;
    gap:15px;
    padding-top:18px;
  }

  .info{
    padding-top:15px;
  }
}

@media(max-width:520px){

  .header{
    height:64px;
  }

  .header-inner{
    padding:0 14px;
  }

  .brand{
    font-size:19px;
    letter-spacing:5px;
  }

  .back{
    font-size:0;
  }

  .back::before{
    content:"←";
    font-size:23px;
  }

  .share{
    padding:9px 12px;
    font-size:12px;
  }

  .product-page{
    padding:14px 14px 75px;
  }

  .main-image-wrap{
    border-radius:20px;
  }

  .thumbnail{
    width:70px;
    height:84px;
  }

  h1{
    font-size:36px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <a href="/" class="back">
      ← Catálogo
    </a>

    <a href="/" class="brand">
      CAROLA
    </a>

    <button
      id="shareButton"
      class="share"
      type="button"
    >
      Compartir
    </button>

  </div>

</header>

<main
  id="productPage"
  class="product-page"
>

  <div class="loading">

    <div class="loader"></div>

    Cargando modelo...

  </div>

</main>

<script>

/* WHATSAPP CAROLA */

const WHATSAPP_NUMBER = "524775971996";


/* OBTENER MODELO DE LA URL */

const params =
  new URLSearchParams(
    window.location.search
  );

const requestedModel =
  params.get("modelo");


const productPage =
  document.getElementById(
    "productPage"
  );

const shareButton =
  document.getElementById(
    "shareButton"
  );


let currentProduct = null;
let currentVariant = null;


/* NORMALIZAR TEXTO */

function normalize(value){

  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


/* NORMALIZAR MODELO */

function normalizeModel(value){

  const text =
    normalize(value);

  const match =
    text.match(
      /[a-z]*\s*\d+[a-z]*/i
    );

  if(match){

    return match[0]
      .replace(
        /\s+/g,
        ""
      );
  }

  return text;
}


/* ORDENAR FOTOGRAFÍAS */

function sortImages(images){

  return (images || [])
    .slice()
    .sort((a,b) => {

      const difference =
        Number(a.orden || 0) -
        Number(b.orden || 0);

      if(difference !== 0){
        return difference;
      }

      return (
        Number(a.id || 0) -
        Number(b.id || 0)
      );
    });
}


/* CARGAR PRODUCTO */

async function loadProduct(){

  if(!requestedModel){

    showError();

    return;
  }


  try{

    const [
      supabaseResponse,
      treintaResponse
    ] =
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t=" +
          Date.now(),
          {
            cache:"no-store"
          }
        ),

        fetch(
          "/.netlify/functions/treinta?t=" +
          Date.now(),
          {
            cache:"no-store"
          }
        )

      ]);


    const supabaseData =
      await supabaseResponse.json();

    const treintaData =
      await treintaResponse.json();


    if(
      !supabaseResponse.ok ||
      !supabaseData.success
    ){

      throw new Error(
        "No se pudo cargar Supabase."
      );
    }


    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){

      throw new Error(
        "No se pudo comprobar Treinta."
      );
    }


    /*
     * SUPABASE DEVUELVE:
     * productos
     */

    const products =
      Array.isArray(
        supabaseData.productos
      )
        ? supabaseData.productos
        : [];


    currentProduct =
      products.find(
        product =>
          normalizeModel(
            product.modelo
          ) ===
          normalizeModel(
            requestedModel
          )
      );


    if(!currentProduct){

      showError(
        "No encontramos este modelo."
      );

      return;
    }


    /*
     * TREINTA DEVUELVE:
     * products
     */

    const treintaProducts =
      Array.isArray(
        treintaData.products
      )
        ? treintaData.products
        : [];


    /*
     * COMPROBAR DISPONIBILIDAD
     */

    const available =
      treintaProducts.some(
        item =>
          normalizeModel(
            item.name
          ) ===
          normalizeModel(
            currentProduct.modelo
          )
      );


    if(!available){

      showError(
        "Este modelo no está disponible actualmente."
      );

      return;
    }


    /*
     * SOLO COLORES
     * QUE TENGAN FOTOGRAFÍAS
     */

    currentProduct.variantes =
      (
        Array.isArray(
          currentProduct.variantes
        )
          ? currentProduct.variantes
          : []
      )
      .filter(
        variant =>
          Array.isArray(
            variant.imagenes
          ) &&
          variant.imagenes.length
      );


    if(
      !currentProduct
        .variantes
        .length
    ){

      showError(
        "Este modelo todavía no tiene fotografías."
      );

      return;
    }


    currentVariant =
      currentProduct
        .variantes[0];


    document.title =
      "Modelo " +
      currentProduct.modelo +
      " | CAROLA";


    renderProduct();


  }catch(error){

    console.error(error);

    showError(
      "No pudimos cargar este modelo."
    );
  }
}


/* MOSTRAR PRODUCTO */

function renderProduct(){

  const images =
    sortImages(
      currentVariant.imagenes
    );


  if(!images.length){

    showError(
      "Este color no tiene fotografías."
    );

    return;
  }


  const mainImage =
    images[0];


  const thumbnails =
    images
      .map(
        (image,index) => `

          <button
            type="button"
            class="thumbnail ${
              index === 0
                ? "active"
                : ""
            }"
            data-url="${escapeAttribute(image.url)}"
          >

            <img
              src="${escapeAttribute(image.url)}"
              alt=""
            >

          </button>

        `
      )
      .join("");


  const colorButtons =
    currentProduct
      .variantes
      .map(
        variant => `

          <button
            type="button"
            class="color-button ${
              Number(variant.id) ===
              Number(currentVariant.id)
                ? "active"
                : ""
            }"
            data-variant="${Number(variant.id)}"
          >

            ${escapeHtml(variant.color)}

          </button>

        `
      )
      .join("");


  productPage.innerHTML = `

    <section class="gallery">

      <div class="main-image-wrap">

        <img
          id="mainImage"
          class="main-image"
          src="${escapeAttribute(mainImage.url)}"
          alt="Modelo ${escapeAttribute(currentProduct.modelo)} ${escapeAttribute(currentVariant.color)}"
        >

      </div>


      <div class="thumbnails">

        ${thumbnails}

      </div>

    </section>


    <section class="info">

      <span class="eyebrow">
        Calzado Carola
      </span>


      <h1>
        Modelo ${escapeHtml(currentProduct.modelo)}
      </h1>


      <span class="available">
        Disponible
      </span>


      <div class="divider"></div>


      <span class="label">
        Selecciona un color
      </span>


      <div class="color-buttons">

        ${colorButtons}

      </div>


      <a
        id="whatsappButton"
        class="whatsapp"
        href="${buildWhatsApp()}"
        target="_blank"
        rel="noopener"
      >

        Pedir este modelo

      </a>


      <div class="help">

        Te atenderemos directamente por WhatsApp.

      </div>

    </section>

  `;
}


/* CREAR ENLACE WHATSAPP */

function buildWhatsApp(){

  const message =
    "Hola, me interesa el modelo " +
    currentProduct.modelo +
    " en color " +
    currentVariant.color +
    ". ¿Me das información para hacer mi pedido?";


  return (
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(
      message
    )
  );
}


/* INTERACCIONES */

productPage.onclick =
  function(event){


    /* CAMBIAR FOTOGRAFÍA */

    const thumbnail =
      event.target.closest(
        ".thumbnail"
      );


    if(thumbnail){

      const mainImage =
        document.getElementById(
          "mainImage"
        );


      if(mainImage){

        mainImage.src =
          thumbnail.dataset.url;

      }


      document
        .querySelectorAll(
          ".thumbnail"
        )
        .forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


      thumbnail.classList.add(
        "active"
      );


      return;
    }


    /* CAMBIAR COLOR */

    const colorButton =
      event.target.closest(
        ".color-button"
      );


    if(colorButton){

      const id =
        Number(
          colorButton.dataset.variant
        );


      const variant =
        currentProduct
          .variantes
          .find(
            item =>
              Number(item.id) === id
          );


      if(!variant){

        return;

      }


      currentVariant =
        variant;


      /*
       * AL CAMBIAR COLOR:
       *
       * cambia foto principal
       * cambian miniaturas
       * cambia botón seleccionado
       * cambia mensaje de WhatsApp
       */

      renderProduct();


      return;
    }
  };


/* COMPARTIR */

shareButton.onclick =
  async function(){


    const shareData = {

      title:
        currentProduct
          ? "Modelo " +
            currentProduct.modelo +
            " | CAROLA"
          : "CAROLA",

      text:
        currentProduct
          ? "Mira el modelo " +
            currentProduct.modelo +
            " de Calzado Carola"
          : "Catálogo Calzado Carola",

      url:
        window.location.href
    };


    try{

      if(
        navigator.share
      ){

        await navigator.share(
          shareData
        );

      }

      else if(
        navigator.clipboard
      ){

        await navigator
          .clipboard
          .writeText(
            window.location.href
          );


        const original =
          shareButton.textContent;


        shareButton.textContent =
          "Copiado ✓";


        setTimeout(
          function(){

            shareButton.textContent =
              original;

          },
          1500
        );
      }

    }catch(error){

      /*
       * Si se cancela compartir,
       * no hacemos nada.
       */

    }
  };


/* MOSTRAR ERROR */

function showError(
  message =
    "No encontramos este modelo."
){

  productPage.innerHTML = `

    <div class="error">

      <h2>

        ${escapeHtml(message)}

      </h2>


      <p>

        Regresa al catálogo para ver
        los modelos disponibles.

      </p>


      <a href="/">

        Ver catálogo

      </a>

    </div>

  `;
}


/* SEGURIDAD HTML */

function escapeHtml(value){

  return String(value || "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function escapeAttribute(value){

  return escapeHtml(value);

}


/* INICIAR */

loadProduct();

</script>

</body>
</html>
