<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Modelo | CAROLA</title>

<style>
:root{
  --pink:#f2c9da;
  --pink-soft:#fff5f8;
  --pink-deep:#dca5bc;
  --text:#181618;
  --muted:#81797d;
  --border:#eee5e9;
  --dark:#171717;
  --green:#2e7d49;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:66px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.header-inner{
  max-width:1400px;
  height:100%;
  margin:auto;
  padding:0 22px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

.back{
  justify-self:start;
  font-size:13px;
  font-weight:800;
}

.brand{
  font-size:23px;
  font-weight:900;
  letter-spacing:8px;
}

.cart-link{
  justify-self:end;
  border:0;
  background:var(--dark);
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  font-weight:800;
  font-size:12px;
  white-space:nowrap;
}

/* PRODUCTO */

.product-page{
  max-width:1400px;
  margin:auto;
  padding:25px 22px 90px;
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);
  gap:45px;
  align-items:start;
}

/* GALERÍA */

.gallery{
  min-width:0;
  display:grid;
  grid-template-columns:76px minmax(0,1fr);
  gap:12px;
  align-items:start;
}

.main-image-wrap{
  grid-column:2;
  grid-row:1;
  width:100%;
  max-height:720px;
  aspect-ratio:4/5;
  border-radius:22px;
  overflow:hidden;
  background:#f6f3f4;
  position:relative;
}

.gallery-arrow{position:absolute;top:50%;z-index:4;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 3px 14px rgba(0,0,0,.10);font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);transition:opacity .18s ease,transform .18s ease}.gallery-arrow:hover{transform:translateY(-50%) scale(1.05)}.gallery-prev{left:14px}.gallery-next{right:14px}

.main-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:opacity .18s ease;
}

.image-counter{position:absolute;right:12px;bottom:12px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:10px;font-weight:900;z-index:3}

.image-color{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:10px;
  font-weight:900;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.thumbnails{
  grid-column:1;
  grid-row:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:720px;
  overflow-y:auto;
  padding:1px 4px 1px 1px;
  scrollbar-width:none;
}

.thumbnails::-webkit-scrollbar{
  display:none;
}

.thumbnail{
  width:72px;
  height:86px;
  flex:0 0 auto;
  padding:0;
  border:2px solid transparent;
  border-radius:11px;
  overflow:hidden;
  background:#f5f5f5;
}

.thumbnail.active{
  border-color:#171717;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* INFORMACIÓN */

.info{
  padding:22px 8px 0;
  position:sticky;
  top:88px;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:900;
  color:#8d8589;
}

.eyebrow:before{
  content:"";
  width:20px;
  height:1px;
  background:#171717;
}

h1{
  margin:10px 0 0;
  font-size:clamp(38px,4vw,55px);
  letter-spacing:-3px;
  line-height:.98;
}

.product-category{
  display:inline-block;
  margin-top:9px;
  color:#a76d85;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.1px;
  text-transform:uppercase;
}

.available{
  display:flex;
  align-items:center;
  gap:7px;
  width:max-content;
  margin-top:13px;
  padding:7px 11px;
  background:#eff8f1;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.available::before{
  content:"";
  width:7px;
  height:7px;
  background:#39a15b;
  border-radius:50%;
}

.divider{
  height:1px;
  background:var(--border);
  margin:22px 0;
}

.label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-bottom:11px;
}

.selected-color{
  color:var(--muted);
  font-weight:600;
}

/* COLORES */

.color-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.color-button{
  border:1px solid var(--border);
  background:#fff;
  padding:10px 15px;
  border-radius:999px;
  font-weight:750;
  min-height:41px;
  font-size:13px;
  transition:.15s;
}

.color-button:hover{
  background:var(--pink-soft);
  border-color:#e6c5d2;
}

.color-button:active{
  transform:scale(.97);
}

.color-button.active{
  background:#171717;
  color:#fff;
  border-color:#171717;
}

/* CANTIDAD */

.quantity-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.quantity-copy{
  min-width:0;
}

.quantity-copy .label{
  margin:0 0 4px;
}

.quantity-help{
  font-size:10px;
  color:var(--muted);
}

.quantity-selector{
  display:flex;
  align-items:center;
  background:#faf8f9;
  border:1px solid var(--border);
  border-radius:13px;
  padding:3px;
}

.quantity-selector button{
  width:42px;
  height:42px;
  border:0;
  background:#fff;
  border-radius:10px;
  font-size:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.quantity-selector button:active{
  background:#f3edf0;
}

.quantity-value{
  min-width:70px;
  text-align:center;
}

.quantity-value strong{
  display:inline;
  font-size:19px;
}

.quantity-value span{
  display:inline;
  margin-left:3px;
  color:var(--muted);
  font-size:10px;
}

/* AGREGAR */

.add-cart{
  width:100%;
  border:0;
  background:#171717;
  color:#fff;
  padding:16px 20px;
  min-height:53px;
  border-radius:14px;
  font-weight:900;
  margin-top:24px;
  font-size:14px;
  transition:.18s;
}

.add-cart:hover{
  opacity:.92;
}

.add-cart:active{
  transform:scale(.99);
}

.add-cart.added{
  background:var(--green);
}

.order-note{
  margin-top:10px;
  padding:11px 13px;
  background:var(--pink-soft);
  border-radius:11px;
  color:#755766;
  font-size:10px;
  line-height:1.45;
  text-align:center;
}

.product-actions{display:flex;gap:8px;margin-top:12px}.share,.ask-whatsapp{flex:1;text-align:center;border:1px solid var(--border);background:#fff;padding:11px;border-radius:11px;font-size:11px;font-weight:800}

.continue{
  display:block;
  text-align:center;
  margin-top:15px;
  font-size:12px;
  font-weight:800;
}

/* CARGA */

.loading{
  grid-column:1/-1;
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

.loader{
  width:30px;
  height:30px;
  margin-bottom:15px;
  border:3px solid #eadde3;
  border-top-color:#222;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ERROR */

.error{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
}

.error h2{
  font-size:30px;
}

.error p{
  color:var(--muted);
}

.error a{
  display:inline-block;
  margin-top:15px;
  background:#171717;
  color:#fff;
  padding:13px 20px;
  border-radius:999px;
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:800;
  transform:translate(-50%,30px);
  background:#171717;
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  white-space:nowrap;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* TABLET VERTICAL */

@media(max-width:800px){

  .product-page{
    grid-template-columns:1fr;
    gap:16px;
    padding-top:18px;
  }

  .gallery{
    grid-template-columns:1fr;
    display:block;
  }

  .main-image-wrap{
    max-height:none;
  }

  .gallery-arrow{display:none}

  .thumbnails{
    display:flex;
    flex-direction:row;
    max-height:none;
    overflow-x:auto;
    overflow-y:hidden;
    gap:8px;
    margin-top:10px;
    padding:1px 1px 5px;
  }

  .info{
    position:static;
    padding:14px 3px 0;
  }
}

/* MÓVIL */

@media(max-width:520px){

  .header{
    height:60px;
  }

  .header-inner{
    padding:0 13px;
  }

  .brand{
    font-size:18px;
    letter-spacing:4px;
  }

  .back{
    font-size:0;
  }

  .back::before{
    content:"←";
    font-size:22px;
  }

  .cart-link{
    padding:9px 10px;
    font-size:10px;
  }

  .product-page{
    padding:10px 12px 65px;
  }

  .main-image-wrap{
    border-radius:17px;
  }

  .thumbnail{
    width:65px;
    height:77px;
  }

  .info{
    padding-top:10px;
  }

  h1{
    font-size:34px;
    letter-spacing:-2px;
  }

  .divider{
    margin:18px 0;
  }

  .color-button{
    padding:10px 14px;
    font-size:12px;
    min-height:40px;
  }

  .quantity-row{
    gap:10px;
  }

  .quantity-selector button{
    width:40px;
    height:40px;
  }

  .quantity-value{
    min-width:60px;
  }

  .add-cart{
    margin-top:20px;
  }
}
</style>

<body>

<header class="header">
  <div class="header-inner">

    <a href="/" class="back">
      ← Catálogo
    </a>

    <a href="/" class="brand" aria-label="CAROLA, inicio">CAROLA</a>

    <a
      href="/?carrito=1"
      id="cartLink"
      class="cart-link"
    >
      Pedido · 0 pares
    </a>

  </div>
</header>

<main id="productPage" class="product-page">

  <div class="loading">
    <div class="loader"></div>
    Cargando modelo...
  </div>

</main>

<div id="toast" class="toast">
  ✓ Agregado al pedido
</div>

<script src="/assets/images.js?v=1"></script>
<script>

const CART_KEY="carola_cart_v2";
const OLD_CART_KEY="carola_cart_v1";

const params=
  new URLSearchParams(window.location.search);

const requestedModel=
  params.get("modelo");

const productPage=
  document.getElementById("productPage");

const cartLink=
  document.getElementById("cartLink");

let currentProduct=null;
let currentVariant=null;
let quantity=6;
let currentImageIndex=0;
let touchStartX=0;

function normalize(value){

  return String(value||"")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function normalizeModel(value){

  return normalize(value)
    .replace(/\s+/g," ");
}

function formatColor(value){

  const original=
    String(value||"").trim();

  if(!original){
    return "";
  }

  const normalized=
    normalize(original);

  const names={
    "negro":"Negro",
    "camel":"Camel",
    "latte":"Latte",
    "maquillaje":"Maquillaje",
    "conac":"Coñac",
    "cafe":"Café",
    "capuchino":"Capuchino",
    "espresso":"Espresso",
    "shedron":"Shedrón",
    "blanco":"Blanco",
    "beige":"Beige",
    "hueso":"Hueso",
    "rojo":"Rojo",
    "vino":"Vino",
    "rosa":"Rosa",
    "dorado":"Dorado",
    "plata":"Plata",
    "azul":"Azul",
    "marino":"Marino",
    "miel":"Miel",
    "chocolate":"Chocolate",
    "taupe":"Taupe"
  };

  if(names[normalized]){
    return names[normalized];
  }

  return original
    .toLowerCase()
    .replace(
      /(^|\s)\S/g,
      function(letter){
        return letter.toUpperCase();
      }
    );
}

function formatCategory(value){

  const normalized=
    normalize(value);

  const names={
    "bota":"Bota",
    "botin":"Botín",
    "mocasin":"Mocasín",
    "escolar":"Escolar",
    "zapatilla":"Zapatilla"
  };

  return names[normalized]||"";
}

function sortImages(images){

  return (images||[])
    .slice()
    .sort(
      function(a,b){

        const difference=
          Number(a.orden||0)-
          Number(b.orden||0);

        if(difference!==0){
          return difference;
        }

        return Number(a.id||0)-
               Number(b.id||0);
      }
    );
}

function getVariantCover(variant){

  const images=
    sortImages(variant?.imagenes);

  return images[0]?.url||"";
}

function loadCart(){

  try{

    let raw=
      localStorage.getItem(CART_KEY);

    if(!raw){
      raw=
        localStorage.getItem(OLD_CART_KEY);
    }

    const data=
      JSON.parse(raw||"[]");

    if(!Array.isArray(data)){
      return [];
    }

    return data
      .filter(
        item=>
          item &&
          item.modelo &&
          item.color
      )
      .map(
        function(item){

          let cantidad=
            Number(item.cantidad||6);

          if(
            !Number.isFinite(cantidad) ||
            cantidad<6
          ){
            cantidad=6;
          }

          cantidad=
            Math.ceil(cantidad/6)*6;

          return{
            modelo:String(item.modelo),
            color:String(item.color),
            cantidad,
            image:item.image||""
          };
        }
      );

  }catch(error){
    return [];
  }
}

function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  updateCartCount();
}

function getCartTotal(){

  return loadCart()
    .reduce(
      function(total,item){

        return total+
          Number(item.cantidad||0);
      },
      0
    );
}

function updateCartCount(){

  const total=
    getCartTotal();

  cartLink.textContent=
    "Pedido · "+total+" pares";
}

function addToCart(){

  if(
    !currentProduct ||
    !currentVariant
  ){
    return;
  }

  const cart=
    loadCart();

  const existing=
    cart.find(
      function(item){

        return(
          normalizeModel(item.modelo)===
          normalizeModel(currentProduct.modelo)
          &&
          normalize(item.color)===
          normalize(currentVariant.color)
        );
      }
    );

  const image=
    getVariantCover(currentVariant);

  if(existing){

    existing.cantidad=
      Number(existing.cantidad||0)+
      quantity;

    if(!existing.image){
      existing.image=image;
    }

  }else{

    cart.push({
      modelo:String(currentProduct.modelo),
      color:String(currentVariant.color),
      cantidad:quantity,
      image:image
    });
  }

  saveCart(cart);

  showToast(
    "✓ "+
    quantity+
    " pares · "+
    formatColor(currentVariant.color)
  );

  const button=
    document.getElementById(
      "addCartButton"
    );

  if(button){

    button.classList.add("added");
    button.textContent=
      "✓ Agregado al pedido";

    setTimeout(
      function(){

        button.classList.remove("added");

        button.textContent=
          "Agregar "+
          quantity+
          " pares al pedido";
      },
      1300
    );
  }
}

async function loadProduct(){

  if(!requestedModel){

    showError(
      "No encontramos este modelo."
    );

    return;
  }

  try{

    const [
      supabaseResponse,
      treintaResponse
    ]=
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t="+
          Date.now(),
          {cache:"no-store"}
        ),

        fetch(
          "/.netlify/functions/treinta?t="+
          Date.now(),
          {cache:"no-store"}
        )

      ]);

    const supabaseData=
      await supabaseResponse.json();

    const treintaData=
      await treintaResponse.json();

    if(
      !supabaseResponse.ok ||
      !supabaseData.success
    ){
      throw new Error("Supabase error");
    }

    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){
      throw new Error("Treinta error");
    }

    const products=
      Array.isArray(
        supabaseData.productos
      )
        ?supabaseData.productos
        :[];

    currentProduct=
      products.find(
        function(product){

          return(
            normalizeModel(product.modelo)===
            normalizeModel(requestedModel)
          );
        }
      );

    if(!currentProduct){

      showError(
        "No encontramos este modelo."
      );

      return;
    }

    const treintaProducts=
      Array.isArray(
        treintaData.products
      )
        ?treintaData.products
        :[];

    const available=
      treintaProducts.some(
        function(item){

          return(
            normalizeModel(item.name)===
            normalizeModel(currentProduct.modelo)
          );
        }
      );

    if(!available){

      showError(
        "Este modelo no está disponible actualmente."
      );

      return;
    }

    currentProduct.variantes=
      (
        Array.isArray(
          currentProduct.variantes
        )
          ?currentProduct.variantes
          :[]
      )
      .filter(
        function(variant){

          return(
            Array.isArray(
              variant.imagenes
            )
            &&
            variant.imagenes.length
          );
        }
      );

    if(
      !currentProduct.variantes.length
    ){

      showError(
        "Este modelo todavía no tiene fotografías."
      );

      return;
    }

    currentVariant=
      currentProduct.variantes[0];

    document.title=
      "Modelo "+
      currentProduct.modelo+
      " | CAROLA";

    renderProduct();
    history.replaceState({},document.title,location.pathname+"?modelo="+encodeURIComponent(currentProduct.modelo)+"&color="+encodeURIComponent(currentVariant.color));

  }catch(error){

    console.error(error);

    showError(
      "No pudimos cargar este modelo."
    );
  }
}

function renderProduct(){

  currentImageIndex=0;

  const images=
    sortImages(
      currentVariant.imagenes
    );

  if(!images.length){

    showError(
      "Este color no tiene fotografías."
    );

    return;
  }

  const formattedColor=
    formatColor(
      currentVariant.color
    );

  const formattedCategory=
    formatCategory(
      currentProduct.categoria
    );

  const thumbnails=
    images
      .map(
        function(image,index){

          return `
            <button
              type="button"
              class="thumbnail ${
                index===0
                  ?"active"
                  :""
              }"
              data-url="${escapeAttribute(image.url)}"
              aria-label="Ver fotografía ${index+1}"
            >
              <img
                src="${escapeAttribute(carolaImageUrl(image.url,160))}"
                data-original="${escapeAttribute(image.url)}"
                width="72" height="86" decoding="async"
                alt="Modelo ${escapeAttribute(currentProduct.modelo)} ${escapeAttribute(formattedColor)}"
                loading="${index===0?"eager":"lazy"}"
              >
            </button>
          `;
        }
      )
      .join("");

  const colorButtons=
    currentProduct.variantes
      .map(
        function(variant){

          return `
            <button
              type="button"
              class="color-button ${
                Number(variant.id)===
                Number(currentVariant.id)
                  ?"active"
                  :""
              }"
              data-variant="${Number(variant.id)}"
            >
              ${escapeHtml(
                formatColor(variant.color)
              )}
            </button>
          `;
        }
      )
      .join("");

  productPage.innerHTML=`

    <section class="gallery">

      ${
        images.length>1
          ?`
            <div class="thumbnails">
              ${thumbnails}
            </div>
          `
          :""
      }

      <div class="main-image-wrap">

        <img
          id="mainImage"
          class="main-image"
          src="${escapeAttribute(carolaImageUrl(images[0].url,800))}"
          srcset="${escapeAttribute(carolaImageSet(images[0].url,[480,800,1200]))}"
          sizes="(max-width:850px) 95vw, 50vw"
          data-original="${escapeAttribute(images[0].url)}"
          width="800" height="1000" fetchpriority="high" decoding="async"
          alt="Modelo ${escapeAttribute(currentProduct.modelo)} ${escapeAttribute(formattedColor)}"
        >

        ${images.length>1?`<button class="gallery-arrow gallery-prev" type="button" aria-label="Fotografía anterior">‹</button><button class="gallery-arrow gallery-next" type="button" aria-label="Fotografía siguiente">›</button>`:""}

        <div class="image-counter" id="imageCounter">1 / ${images.length}</div>

        <div class="image-color">
          ${escapeHtml(formattedColor)}
        </div>

      </div>

    </section>

    <section class="info">

      <span class="eyebrow">
        Calzado Carola
      </span>

      <h1>
        Modelo ${escapeHtml(currentProduct.modelo)}
      </h1>

      ${
        formattedCategory
          ?`
            <div class="product-category">
              ${escapeHtml(formattedCategory)}
            </div>
          `
          :""
      }

      <span class="available">
        Disponible
      </span>

      <div class="divider"></div>

      <span class="label">
        Color:
        <span class="selected-color">
          ${escapeHtml(formattedColor)}
        </span>
      </span>

      <div class="color-buttons">
        ${colorButtons}
      </div>

      <div class="divider"></div>

      <div class="quantity-row">

        <div class="quantity-copy">

          <span class="label">
            Cantidad
          </span>

          <div class="quantity-help">
            En múltiplos de 6 pares
          </div>

        </div>

        <div class="quantity-selector">

          <button
            id="minusQuantity"
            type="button"
            aria-label="Restar 6 pares"
          >
            −
          </button>

          <div class="quantity-value">
            <strong id="quantityValue">
              ${quantity}
            </strong>
            <span>pares</span>
          </div>

          <button
            id="plusQuantity"
            type="button"
            aria-label="Agregar 6 pares"
          >
            +
          </button>

        </div>

      </div>

      <button
        id="addCartButton"
        class="add-cart"
        type="button"
      >
        Agregar ${quantity} pares al pedido
      </button>

      <div class="order-note">
        Puedes combinar diferentes modelos y colores en tu pedido.
      </div>

      <div class="product-actions"><button id="shareProduct" class="share" type="button">Compartir</button><a class="ask-whatsapp" target="_blank" rel="noopener" href="https://wa.me/524775971996?text=${encodeURIComponent(`Hola, me interesa el modelo ${currentProduct.modelo} en color ${formattedColor}`)}">Preguntar por WhatsApp</a></div>

      <a href="/" class="continue">
        ← Seguir viendo modelos
      </a>

    </section>

  `;
}

function changeGalleryImage(step){
  const images=sortImages(currentVariant?.imagenes);
  if(images.length<2)return;
  currentImageIndex=(currentImageIndex+step+images.length)%images.length;
  const image=images[currentImageIndex];
  const mainImage=document.getElementById("mainImage");
  if(mainImage)carolaSetImage(mainImage,image.url);
  document.querySelectorAll(".thumbnail").forEach((item,index)=>item.classList.toggle("active",index===currentImageIndex));
  const counter=document.getElementById("imageCounter");if(counter)counter.textContent=(currentImageIndex+1)+" / "+images.length;
  const next=images[(currentImageIndex+1)%images.length];if(next){const preload=new Image();preload.src=carolaImageUrl(next.url,800);}
  const active=document.querySelector(".thumbnail.active");
  if(active)active.scrollIntoView({behavior:"smooth",block:"nearest",inline:"nearest"});
}

productPage.addEventListener("touchstart",function(event){
  if(!event.target.closest(".main-image-wrap"))return;
  touchStartX=event.changedTouches[0].clientX;
},{passive:true});
productPage.addEventListener("touchend",function(event){
  if(!event.target.closest(".main-image-wrap"))return;
  const delta=event.changedTouches[0].clientX-touchStartX;
  if(Math.abs(delta)>45)changeGalleryImage(delta<0?1:-1);
},{passive:true});

productPage.onclick=
function(event){

  if(event.target.closest(".gallery-prev")){changeGalleryImage(-1);return;}
  if(event.target.closest(".gallery-next")){changeGalleryImage(1);return;}

  const thumbnail=
    event.target.closest(
      ".thumbnail"
    );

  if(thumbnail){

    const mainImage=
      document.getElementById(
        "mainImage"
      );

    if(mainImage){

      carolaSetImage(mainImage, thumbnail.dataset.url);
      currentImageIndex=Array.from(document.querySelectorAll(".thumbnail")).indexOf(thumbnail);
    }

    document
      .querySelectorAll(".thumbnail")
      .forEach(
        function(item){
          item.classList.remove("active");
        }
      );

    thumbnail.classList.add("active");

    return;
  }

  if(event.target.closest("#shareProduct")){const data={title:"Modelo "+currentProduct.modelo+" | CAROLA",text:"Modelo "+currentProduct.modelo+" · "+formatColor(currentVariant.color),url:location.href};if(navigator.share){navigator.share(data).catch(()=>{});}else{navigator.clipboard?.writeText(location.href);showToast("Enlace copiado");}return;}

  const colorButton=
    event.target.closest(
      ".color-button"
    );

  if(colorButton){

    const id=
      Number(
        colorButton.dataset.variant
      );

    const variant=
      currentProduct.variantes.find(
        function(item){

          return Number(item.id)===id;
        }
      );

    if(!variant){
      return;
    }

    if(
      Number(currentVariant.id)===
      Number(variant.id)
    ){
      return;
    }

    currentVariant=variant;

    renderProduct();

    return;
  }

  if(
    event.target.closest(
      "#plusQuantity"
    )
  ){

    quantity+=6;
    updateQuantity();
    return;
  }

  if(
    event.target.closest(
      "#minusQuantity"
    )
  ){

    quantity=
      Math.max(
        6,
        quantity-6
      );

    updateQuantity();

    return;
  }

  if(
    event.target.closest(
      "#addCartButton"
    )
  ){

    addToCart();

    return;
  }
};

function updateQuantity(){

  const value=
    document.getElementById(
      "quantityValue"
    );

  const button=
    document.getElementById(
      "addCartButton"
    );

  if(value){
    value.textContent=quantity;
  }

  if(button){

    button.textContent=
      "Agregar "+
      quantity+
      " pares al pedido";
  }
}

function showToast(text){

  const toast=
    document.getElementById("toast");

  toast.textContent=text;

  toast.classList.add("show");

  setTimeout(
    function(){
      toast.classList.remove("show");
    },
    1600
  );
}

function showError(
  message=
    "No encontramos este modelo."
){

  productPage.innerHTML=`

    <div class="error">

      <h2>
        ${escapeHtml(message)}
      </h2>

      <p>
        Regresa al catálogo para ver
        los modelos disponibles.
      </p>

      <a href="/">
        Ver catálogo
      </a>

    </div>

  `;
}

function escapeHtml(value){

  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

updateCartCount();
loadProduct();

</script>

</body>
</html>
