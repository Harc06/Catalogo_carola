<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAROLA | Catálogo</title>

<style>
:root{
  --pink:#f2c9da;
  --pink-soft:#fff5f8;
  --pink-deep:#dca5bc;
  --text:#181618;
  --muted:#81797d;
  --border:#eee5e9;
  --dark:#171717;
  --danger:#a32d2d;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff;
}

button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(238,229,233,.85);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  min-height:66px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:23px;
  font-weight:900;
  letter-spacing:8px;
}

.cart-button{
  border:0;
  background:var(--dark);
  color:#fff;
  padding:10px 17px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
}

/* HERO */

.hero{
  max-width:1400px;
  margin:auto;
  padding:16px 20px 8px;
}

.hero-box{
  min-height:170px;
  border-radius:25px;
  padding:30px 38px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 82% 20%,rgba(255,255,255,.8),transparent 26%),
    linear-gradient(120deg,#f2c9da 0%,#f9e1ea 48%,#fff7fa 100%);
}

.hero-box:before{
  content:"CAROLA";
  position:absolute;
  right:-10px;
  bottom:-24px;
  font-size:clamp(70px,12vw,170px);
  line-height:.8;
  font-weight:950;
  letter-spacing:-9px;
  color:rgba(255,255,255,.40);
  pointer-events:none;
}

.hero-box:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:50%;
  right:8%;
  top:-125px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:620px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:9px;
  font-weight:900;
  letter-spacing:2.2px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.eyebrow:before{
  content:"";
  width:20px;
  height:1px;
  background:#171717;
}

.hero h1{
  font-size:clamp(35px,5vw,56px);
  line-height:.93;
  letter-spacing:-3px;
  margin:0 0 10px;
}

.hero p{
  color:#675d62;
  max-width:430px;
  line-height:1.4;
  margin:0;
  font-size:13px;
}

/* CATÁLOGO */

.catalog{
  max-width:1400px;
  margin:auto;
  padding:18px 20px 90px;
}

.catalog-top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:14px;
}

.catalog h2{
  font-size:28px;
  letter-spacing:-1px;
  margin:0;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

/* CATEGORÍAS */

.category-section{
  margin-bottom:13px;
}

.filter-label{
  display:block;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.7px;
  color:#a1969b;
  text-transform:uppercase;
  margin-bottom:8px;
}

.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 0 4px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.categories::-webkit-scrollbar{display:none}

.category-filter{
  flex:none;
  border:1px solid var(--border);
  background:#fff;
  padding:9px 16px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  transition:.15s;
}

.category-filter:hover{
  background:#fff7fa;
}

.category-filter.active{
  background:#171717;
  color:#fff;
  border-color:#171717;
}

/* BUSCADOR */

.search-area{
  position:sticky;
  top:66px;
  z-index:90;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:7px 0 6px;
  border-bottom:1px solid rgba(238,229,233,.7);
}

.search-wrap{
  position:relative;
}

.search{
  width:100%;
  padding:12px 48px 12px 16px;
  border:1px solid var(--border);
  background:#faf8f9;
  border-radius:13px;
  outline:none;
  font-size:14px;
}

.search:focus{
  background:#fff;
  border-color:#d8b4c3;
  box-shadow:0 0 0 3px rgba(245,220,231,.35);
}

.clear-search{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#eee8eb;
  font-size:18px;
  display:none;
  align-items:center;
  justify-content:center;
}

.clear-search.show{display:flex}

/* HERRAMIENTAS */

.catalog-tools{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:7px;
}

.color-area{
  min-width:0;
  flex:1;
}

.filters{
  display:flex;
  gap:6px;
  overflow:auto;
  padding:4px 0;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filter{
  flex:none;
  border:1px solid var(--border);
  background:#fff;
  padding:7px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:10px;
}

.filter.active{
  background:#f5dce7;
  border-color:#e7bed0;
  color:#5d3545;
}

.view-switch{
  display:flex;
  flex:none;
  padding:3px;
  background:#f4f0f2;
  border-radius:10px;
}

.view-button{
  width:36px;
  height:31px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#777;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.view-button.active{
  background:#fff;
  color:#171717;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

/* PRODUCTOS */

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:23px 12px;
  margin-top:15px;
}

.product-card{
  min-width:0;
}

.product-image{
  position:relative;
  aspect-ratio:4/5;
  background:#f6f3f4;
  border-radius:13px;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .3s ease;
}

.product-image:hover img{
  transform:scale(1.025);
}

.badge{
  position:absolute;
  top:7px;
  left:7px;
  background:rgba(255,255,255,.91);
  backdrop-filter:blur(8px);
  padding:5px 7px;
  border-radius:999px;
  font-size:7px;
  font-weight:900;
}

.product-info{
  padding:8px 2px 0;
}

.product-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
}

.product-title h3{
  font-size:13px;
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.product-arrow{
  font-size:12px;
  flex:none;
}

.product-category{
  display:inline-block;
  color:#b07b91;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-top:4px;
}

.colors{
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
  line-height:1.4;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.quick-add{
  width:100%;
  margin-top:7px;
  padding:8px 6px;
  border:1px solid #171717;
  background:#fff;
  border-radius:9px;
  font-weight:800;
  font-size:10px;
  transition:.15s;
}

.quick-add:hover,
.quick-add:active{
  background:#171717;
  color:#fff;
}

.state{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  background:#faf8f9;
  border-radius:18px;
}

/* LISTA */

.grid.list-view{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.grid.list-view .product-card{
  display:grid;
  grid-template-columns:78px minmax(0,1fr) auto;
  align-items:center;
  gap:13px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
}

.grid.list-view .product-link{
  display:contents;
}

.grid.list-view .product-image{
  width:78px;
  height:88px;
  aspect-ratio:auto;
  border-radius:10px;
  grid-column:1;
  grid-row:1;
}

.grid.list-view .badge{display:none}

.grid.list-view .product-info{
  grid-column:2;
  grid-row:1;
  padding:0;
  min-width:0;
}

.grid.list-view .product-title h3{
  font-size:14px;
}

.grid.list-view .product-arrow{
  display:none;
}

.grid.list-view .colors{
  font-size:10px;
  white-space:normal;
}

.grid.list-view .quick-add{
  grid-column:3;
  grid-row:1;
  width:auto;
  min-width:95px;
  margin:0;
  padding:9px 12px;
}

.grid.list-view .state{
  width:100%;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:500;
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.overlay.open{
  opacity:1;
  visibility:visible;
}

/* CARRITO */

.cart{
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  width:min(450px,100%);
  background:#fff;
  z-index:501;
  transform:translateX(105%);
  transition:.25s;
  display:flex;
  flex-direction:column;
}

.cart.open{
  transform:translateX(0);
}

.cart-header{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart-header h2{margin:0}

.icon-btn{
  border:0;
  background:#f5f2f3;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.cart-body{
  flex:1;
  overflow:auto;
  padding:18px;
}

.cart-empty{
  text-align:center;
  padding:60px 10px;
  color:var(--muted);
}

.cart-item{
  display:grid;
  grid-template-columns:75px 1fr;
  gap:13px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}

.cart-thumb{
  width:75px;
  height:92px;
  object-fit:cover;
  border-radius:11px;
  background:#f1edef;
}

.cart-item h4{
  margin:2px 0 4px;
}

.cart-color{
  font-size:12px;
  color:var(--muted);
}

.cart-actions{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:10px;
}

.cart-actions button{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
}

.remove{
  margin-left:auto!important;
  width:auto!important;
  border:0!important;
  color:var(--danger);
  font-size:12px;
}

.cart-footer{
  padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:#fff;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:900;
  margin-bottom:13px;
}

.name-input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  margin-bottom:9px;
}

.send{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#171717;
  color:#fff;
  font-weight:900;
}

.send:disabled{
  opacity:.55;
  cursor:default;
}

.clear{
  width:100%;
  margin-top:10px;
  border:0;
  background:#fff;
  color:var(--danger);
  padding:9px;
}

/* COMPRA RÁPIDA */

.sheet{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:601;
  width:min(520px,100%);
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:22px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(-50%,105%);
  transition:.25s;
}

.sheet.open{
  transform:translate(-50%,0);
}

.sheet-handle{
  width:45px;
  height:5px;
  background:#ddd;
  border-radius:99px;
  margin:0 auto 18px;
}

.sheet h2{margin:0 0 5px}

.sheet p{
  color:var(--muted);
  margin:0 0 20px;
}

.sheet-colors{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.sheet-color{
  border:1px solid var(--border);
  background:#fff;
  padding:11px 15px;
  border-radius:999px;
  font-weight:700;
}

.sheet-color.active{
  background:#171717;
  color:#fff;
  border-color:#171717;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin:25px 0;
}

.qty button{
  width:46px;
  height:46px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  font-size:23px;
}

.qty strong{
  font-size:24px;
  min-width:70px;
  text-align:center;
}

.sheet-add{
  width:100%;
  padding:16px;
  border:0;
  background:#171717;
  color:#fff;
  border-radius:14px;
  font-weight:900;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:800;
  transform:translate(-50%,30px);
  background:#171717;
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

/* PC + iPad horizontal = 5 productos */

@media(min-width:900px){
  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

/* iPad vertical / tablet = 4 productos */

@media(min-width:651px) and (max-width:899px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .hero-box{
    min-height:155px;
  }
}

@media(max-width:650px){

  .header-inner{
    min-height:60px;
    padding:0 14px;
  }

  .brand{
    font-size:18px;
    letter-spacing:5px;
  }

  .cart-button{
    font-size:10px;
    padding:9px 11px;
  }

  .hero{
    padding:9px 12px 5px;
  }

  .hero-box{
    min-height:145px;
    padding:22px;
    border-radius:19px;
  }

  .hero-box:before{
    font-size:82px;
    right:-5px;
    bottom:-9px;
    letter-spacing:-5px;
  }

  .hero-box:after{
    display:none;
  }

  .eyebrow{
    font-size:8px;
    margin-bottom:6px;
  }

  .hero h1{
    font-size:34px;
    letter-spacing:-2px;
    margin-bottom:7px;
  }

  .hero p{
    font-size:11px;
    max-width:280px;
  }

  .catalog{
    padding:13px 12px 70px;
  }

  .catalog h2{
    font-size:25px;
  }

  .search-area{
    top:60px;
  }

  .category-filter{
    padding:8px 13px;
    font-size:11px;
  }

  .catalog-tools{
    gap:7px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px 7px;
    margin-top:12px;
  }

  .product-image{
    border-radius:11px;
  }

  .product-title h3{
    font-size:12px;
  }

  .quick-add{
    font-size:10px;
    padding:8px 5px;
  }

  .grid.list-view .product-card{
    grid-template-columns:65px minmax(0,1fr) auto;
    gap:9px;
    padding:7px;
  }

  .grid.list-view .product-image{
    width:65px;
    height:74px;
  }

  .grid.list-view .quick-add{
    min-width:74px;
    font-size:9px;
    padding:8px 7px;
  }

  .view-button{
    width:32px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="/" class="brand">
      CAROLA
    </a>

    <button
      id="cartButton"
      class="cart-button"
      type="button"
    >
      Pedido · 0 pares
    </button>

  </div>
</header>

<section class="hero">

  <div class="hero-box">

    <div class="hero-content">

      <span class="eyebrow">
        Calzado Carola
      </span>

      <h1>
        Arma tu pedido.
      </h1>

      <p>
        Selecciona tus modelos y colores.
        Venta por múltiplos de 6 pares.
      </p>

    </div>

  </div>

</section>

<main class="catalog">

  <div class="catalog-top">

    <div>

      <h2>Catálogo</h2>

      <div class="muted">
        Modelos disponibles
      </div>

    </div>

    <div
      id="count"
      class="muted"
    >
      Cargando...
    </div>

  </div>

  <div class="category-section">

    <span class="filter-label">
      Categorías
    </span>

    <div
      id="categories"
      class="categories"
    ></div>

  </div>

  <div class="search-area">

    <div class="search-wrap">

      <input
        id="search"
        class="search"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="Buscar modelo, categoría o color..."
      >

      <button
        id="clearSearch"
        class="clear-search"
        type="button"
        aria-label="Limpiar búsqueda"
      >
        ×
      </button>

    </div>

    <div class="catalog-tools">

      <div class="color-area">

        <div
          id="filters"
          class="filters"
        ></div>

      </div>

      <div
        class="view-switch"
        aria-label="Cambiar vista"
      >

        <button
          id="gridViewButton"
          class="view-button active"
          type="button"
          aria-label="Vista cuadrícula"
          title="Cuadrícula"
        >
          ▦
        </button>

        <button
          id="listViewButton"
          class="view-button"
          type="button"
          aria-label="Vista lista"
          title="Lista"
        >
          ☰
        </button>

      </div>

    </div>

  </div>

  <div
    id="grid"
    class="grid"
  >
    <div class="state">
      Cargando catálogo...
    </div>
  </div>

</main>

<div
  id="overlay"
  class="overlay"
></div>

<aside
  id="cart"
  class="cart"
>

  <div class="cart-header">

    <h2>Tu pedido</h2>

    <button
      id="closeCart"
      class="icon-btn"
      type="button"
    >
      ×
    </button>

  </div>

  <div
    id="cartBody"
    class="cart-body"
  ></div>

  <div class="cart-footer">

    <div class="cart-total">

      <span>Total de pares</span>

      <span id="total">
        0
      </span>

    </div>

    <input
      id="customerName"
      class="name-input"
      placeholder="Nombre del cliente"
      autocomplete="name"
    >

    <button
      id="sendOrder"
      class="send"
      type="button"
    >
      Enviar pedido por WhatsApp
    </button>

    <button
      id="clearCart"
      class="clear"
      type="button"
    >
      Vaciar pedido
    </button>

  </div>

</aside>

<section
  id="sheet"
  class="sheet"
>

  <div class="sheet-handle"></div>

  <h2 id="sheetTitle">
    Modelo
  </h2>

  <p>
    Selecciona color y cantidad
  </p>

  <div
    id="sheetColors"
    class="sheet-colors"
  ></div>

  <div class="qty">

    <button
      id="sheetMinus"
      type="button"
    >
      −
    </button>

    <strong id="sheetQty">
      6
    </strong>

    <button
      id="sheetPlus"
      type="button"
    >
      +
    </button>

  </div>

  <button
    id="sheetAdd"
    class="sheet-add"
    type="button"
  >
    Agregar 6 pares
  </button>

</section>

<div
  id="toast"
  class="toast"
>
  ✓ Agregado al pedido
</div>

<script>

/* =========================
   CONFIGURACIÓN
========================= */

const WHATSAPP_NUMBER="524775971996";

const CART_KEY="carola_cart_v2";
const OLD_CART_KEY="carola_cart_v1";
const NAME_KEY="carola_customer_name_v1";
const LAST_ORDER_KEY="carola_last_order_v1";
const VIEW_KEY="carola_view_v1";

const DUPLICATE_WINDOW=
  30*60*1000;

const CATEGORY_ORDER=[
  "Bota",
  "Botín",
  "Mocasín",
  "Escolar",
  "Zapatilla"
];

/* =========================
   VARIABLES
========================= */

let products=[];

let selectedCategory="todos";
let selectedFilter="todos";

let cart=loadCart();

let quickProduct=null;
let quickVariant=null;
let quickQty=6;

let currentView=
  localStorage.getItem(VIEW_KEY)==="list"
    ?"list"
    :"grid";

/* =========================
   ELEMENTOS
========================= */

const grid=
  document.getElementById("grid");

const categories=
  document.getElementById("categories");

const filters=
  document.getElementById("filters");

const search=
  document.getElementById("search");

const clearSearch=
  document.getElementById("clearSearch");

const count=
  document.getElementById("count");

const overlay=
  document.getElementById("overlay");

const cartPanel=
  document.getElementById("cart");

const cartBody=
  document.getElementById("cartBody");

const total=
  document.getElementById("total");

const cartButton=
  document.getElementById("cartButton");

const customerName=
  document.getElementById("customerName");

const sheet=
  document.getElementById("sheet");

const gridViewButton=
  document.getElementById("gridViewButton");

const listViewButton=
  document.getElementById("listViewButton");

customerName.value=
  localStorage.getItem(NAME_KEY)||"";

/* =========================
   NORMALIZACIÓN
========================= */

function normalize(value){

  return String(value||"")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}

function normalizeModel(value){

  return normalize(value)
    .replace(/\s+/g," ");
}

/* =========================
   PRESENTACIÓN COLOR
========================= */

function formatColor(value){

  const original=
    String(value||"").trim();

  if(!original){
    return "";
  }

  const normalized=
    normalize(original);

  const known={
    "negro":"Negro",
    "camel":"Camel",
    "latte":"Latte",
    "maquillaje":"Maquillaje",
    "conac":"Coñac",
    "cafe":"Café",
    "capuchino":"Capuchino",
    "espresso":"Espresso",
    "shedron":"Shedrón",
    "blanco":"Blanco",
    "beige":"Beige",
    "hueso":"Hueso",
    "rojo":"Rojo",
    "vino":"Vino",
    "rosa":"Rosa",
    "dorado":"Dorado",
    "plata":"Plata",
    "azul":"Azul",
    "marino":"Marino",
    "miel":"Miel",
    "chocolate":"Chocolate",
    "taupe":"Taupe"
  };

  if(known[normalized]){
    return known[normalized];
  }

  return original
    .toLowerCase()
    .replace(
      /(^|\s)\S/g,
      letter=>
        letter.toUpperCase()
    );
}

/* =========================
   CATEGORÍA
========================= */

function formatCategory(value){

  const normalized=
    normalize(value);

  const known={
    "bota":"Bota",
    "botin":"Botín",
    "mocasin":"Mocasín",
    "escolar":"Escolar",
    "zapatilla":"Zapatilla"
  };

  return known[normalized]||"";
}

/* =========================
   IMÁGENES
========================= */

function sortImages(images){

  return (images||[])
    .slice()
    .sort((a,b)=>{

      const order=
        Number(a.orden||0)-
        Number(b.orden||0);

      if(order!==0){
        return order;
      }

      return (
        Number(a.id||0)-
        Number(b.id||0)
      );
    });
}

function variants(product){

  return Array.isArray(
    product?.variantes
  )
    ?product.variantes.filter(
        variant=>
          Array.isArray(
            variant.imagenes
          ) &&
          variant.imagenes.length
      )
    :[];
}

function variantCover(variant){

  return (
    sortImages(
      variant?.imagenes
    )[0]?.url||
    ""
  );
}

function cover(product){

  const variant=
    variants(product)[0];

  return variant
    ?variantCover(variant)
    :"";
}

/* =========================
   IDENTIDAD PEDIDO
========================= */

function buildOrderFingerprint(
  name,
  items
){

  const normalizedItems=
    (items||[])
      .map(item=>({

        modelo:
          normalizeModel(
            item.modelo
          ),

        color:
          normalize(
            item.color
          ),

        cantidad:
          Number(
            item.cantidad||0
          )

      }))
      .sort((a,b)=>{

        const modelCompare=
          a.modelo.localeCompare(
            b.modelo,
            undefined,
            {
              numeric:true,
              sensitivity:"base"
            }
          );

        if(modelCompare!==0){
          return modelCompare;
        }

        const colorCompare=
          a.color.localeCompare(
            b.color,
            undefined,
            {
              sensitivity:"base"
            }
          );

        if(colorCompare!==0){
          return colorCompare;
        }

        return (
          a.cantidad-
          b.cantidad
        );
      });

  return JSON.stringify({

    cliente:
      normalize(name),

    items:
      normalizedItems

  });
}

function getLastOrder(){

  try{

    const raw=
      localStorage.getItem(
        LAST_ORDER_KEY
      );

    if(!raw){
      return null;
    }

    const data=
      JSON.parse(raw);

    if(
      !data ||
      !data.fingerprint ||
      !data.folio ||
      !data.savedAt
    ){
      return null;
    }

    return data;

  }catch{

    return null;
  }
}

function saveLastOrder(
  fingerprint,
  folio
){

  localStorage.setItem(
    LAST_ORDER_KEY,
    JSON.stringify({

      fingerprint,

      folio:
        String(folio),

      savedAt:
        Date.now()

    })
  );
}

function isRecentDuplicate(
  lastOrder,
  fingerprint
){

  if(!lastOrder){
    return false;
  }

  if(
    lastOrder.fingerprint!==
    fingerprint
  ){
    return false;
  }

  const savedAt=
    Number(
      lastOrder.savedAt||0
    );

  if(!savedAt){
    return false;
  }

  return (
    Date.now()-savedAt
  )<DUPLICATE_WINDOW;
}

/* =========================
   CARRITO
========================= */

function loadCart(){

  try{

    let raw=
      localStorage.getItem(
        CART_KEY
      );

    if(!raw){

      raw=
        localStorage.getItem(
          OLD_CART_KEY
        );
    }

    const data=
      JSON.parse(
        raw||"[]"
      );

    if(!Array.isArray(data)){
      return [];
    }

    return data
      .filter(
        item=>
          item &&
          item.modelo &&
          item.color
      )
      .map(item=>{

        let cantidad=
          Number(
            item.cantidad||6
          );

        if(
          !Number.isFinite(
            cantidad
          ) ||
          cantidad<6
        ){
          cantidad=6;
        }

        cantidad=
          Math.ceil(
            cantidad/6
          )*6;

        return {

          modelo:
            String(
              item.modelo
            ),

          color:
            String(
              item.color
            ),

          cantidad,

          image:
            item.image||""

        };
      });

  }catch{

    return [];
  }
}

function saveCart(){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  renderCart();
}

function cartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum+
      Number(
        item.cantidad||0
      ),
    0
  );
}

async function repairCartImages(){

  let changed=false;

  for(const item of cart){

    if(item.image){
      continue;
    }

    const product=
      products.find(
        product=>
          normalizeModel(
            product.modelo
          )===
          normalizeModel(
            item.modelo
          )
      );

    if(!product){
      continue;
    }

    const variant=
      variants(product).find(
        variant=>
          normalize(
            variant.color
          )===
          normalize(
            item.color
          )
      );

    if(!variant){
      continue;
    }

    const image=
      variantCover(variant);

    if(image){

      item.image=image;
      changed=true;
    }
  }

  if(changed){

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(cart)
    );

    renderCart();
  }
}

function addItem(
  modelo,
  color,
  cantidad,
  image
){

  const existing=
    cart.find(
      item=>
        normalizeModel(
          item.modelo
        )===
        normalizeModel(
          modelo
        ) &&
        normalize(
          item.color
        )===
        normalize(
          color
        )
    );

  if(existing){

    existing.cantidad=
      Number(
        existing.cantidad
      )+
      Number(
        cantidad
      );

    if(!existing.image){
      existing.image=image;
    }

  }else{

    cart.push({

      modelo:
        String(modelo),

      color:
        String(color),

      cantidad:
        Number(cantidad),

      image:
        image||""

    });
  }

  saveCart();

  showToast(
    "✓ "+
    cantidad+
    " pares agregados"
  );
}

function renderCart(){

  const pairs=
    cartTotal();

  total.textContent=
    pairs;

  cartButton.textContent=
    "Pedido · "+
    pairs+
    " pares";

  if(!cart.length){

    cartBody.innerHTML=`
      <div class="cart-empty">

        <strong>
          Tu pedido está vacío
        </strong>

        <br><br>

        Agrega modelos del catálogo.

      </div>
    `;

    return;
  }

  cartBody.innerHTML=
    cart.map(
      (item,index)=>`

        <div class="cart-item">

          ${
            item.image
              ?`
                <img
                  class="cart-thumb"
                  src="${escapeAttribute(item.image)}"
                  alt="Modelo ${escapeAttribute(item.modelo)}"
                >
              `
              :`
                <div class="cart-thumb"></div>
              `
          }

          <div>

            <h4>
              Modelo ${escapeHtml(item.modelo)}
            </h4>

            <div class="cart-color">
              ${escapeHtml(formatColor(item.color))}
            </div>

            <div class="cart-actions">

              <button
                data-action="minus"
                data-index="${index}"
              >
                −
              </button>

              <strong>
                ${Number(item.cantidad)}
              </strong>

              <button
                data-action="plus"
                data-index="${index}"
              >
                +
              </button>

              <button
                class="remove"
                data-action="remove"
                data-index="${index}"
              >
                Eliminar
              </button>

            </div>

          </div>

        </div>

      `
    ).join("");
}

function openCart(){

  overlay.classList.add(
    "open"
  );

  cartPanel.classList.add(
    "open"
  );

  sheet.classList.remove(
    "open"
  );

  document.body.style.overflow=
    "hidden";
}

function closePanels(){

  overlay.classList.remove(
    "open"
  );

  cartPanel.classList.remove(
    "open"
  );

  sheet.classList.remove(
    "open"
  );

  document.body.style.overflow=
    "";
}

/* =========================
   COMPRA RÁPIDA
========================= */

function openQuick(product){

  quickProduct=product;

  quickVariant=
    variants(product)[0];

  quickQty=6;

  document.getElementById(
    "sheetTitle"
  ).textContent=
    "Modelo "+
    product.modelo;

  renderSheetColors();

  updateSheetQty();

  overlay.classList.add(
    "open"
  );

  sheet.classList.add(
    "open"
  );

  cartPanel.classList.remove(
    "open"
  );

  document.body.style.overflow=
    "hidden";
}

function renderSheetColors(){

  document.getElementById(
    "sheetColors"
  ).innerHTML=

    variants(quickProduct)
      .map(
        variant=>`

          <button
            class="sheet-color ${
              Number(variant.id)===
              Number(quickVariant.id)
                ?"active"
                :""
            }"
            data-variant="${Number(variant.id)}"
            type="button"
          >
            ${escapeHtml(formatColor(variant.color))}
          </button>

        `
      )
      .join("");
}

function updateSheetQty(){

  document.getElementById(
    "sheetQty"
  ).textContent=
    quickQty;

  document.getElementById(
    "sheetAdd"
  ).textContent=
    "Agregar "+
    quickQty+
    " pares";
}

/* =========================
   CARGAR PRODUCTOS
========================= */

async function loadProducts(){

  try{

    const [
      supabaseResponse,
      treintaResponse
    ]=
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t="+
          Date.now(),
          {
            cache:"no-store"
          }
        ),

        fetch(
          "/.netlify/functions/treinta?t="+
          Date.now(),
          {
            cache:"no-store"
          }
        )

      ]);

    const supabaseData=
      await supabaseResponse.json();

    const treintaData=
      await treintaResponse.json();

    if(
      !supabaseResponse.ok ||
      !supabaseData.success
    ){

      throw new Error(
        "No se pudo cargar el catálogo."
      );
    }

    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){

      throw new Error(
        "No se pudo verificar disponibilidad."
      );
    }

    const available=
      new Set(
        (
          Array.isArray(
            treintaData.products
          )
            ?treintaData.products
            :[]
        )
        .map(
          product=>
            normalizeModel(
              product.name
            )
        )
      );

    products=
      (
        Array.isArray(
          supabaseData.productos
        )
          ?supabaseData.productos
          :[]
      )
      .filter(
        product=>
          available.has(
            normalizeModel(
              product.modelo
            )
          )
      )
      .filter(
        product=>
          cover(product)
      )
      .sort(
        (a,b)=>
          String(
            a.modelo
          ).localeCompare(
            String(
              b.modelo
            ),
            undefined,
            {
              numeric:true,
              sensitivity:"base"
            }
          )
      );

    buildCategories();
    buildFilters();
    applyView();
    renderProducts();

    await repairCartImages();

    const params=
      new URLSearchParams(
        window.location.search
      );

    if(
      params.get(
        "carrito"
      )==="1"
    ){

      openCart();

      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

  }catch(error){

    console.error(error);

    grid.innerHTML=`
      <div class="state">
        No pudimos cargar el catálogo.
      </div>
    `;

    count.textContent=
      "Error";
  }
}

/* =========================
   CATEGORÍAS
========================= */

function buildCategories(){

  categories.innerHTML=

    CATEGORY_ORDER.map(
      category=>`

        <button
          class="category-filter ${
            normalize(category)===
            selectedCategory
              ?"active"
              :""
          }"
          data-category="${escapeAttribute(normalize(category))}"
          type="button"
        >
          ${escapeHtml(category)}
        </button>

      `
    ).join("")+

    `

      <button
        class="category-filter ${
          selectedCategory==="todos"
            ?"active"
            :""
        }"
        data-category="todos"
        type="button"
      >
        Todos
      </button>

    `;
}

/* =========================
   FILTROS DE COLOR
========================= */

function buildFilters(){

  const colors=
    new Map();

  products.forEach(
    product=>{

      variants(product)
        .forEach(
          variant=>{

            const key=
              normalize(
                variant.color
              );

            if(
              !colors.has(key)
            ){

              colors.set(
                key,
                formatColor(
                  variant.color
                )
              );
            }
          }
        );
    }
  );

  const sortedColors=
    [...colors.entries()]
      .sort(
        (a,b)=>
          a[1].localeCompare(
            b[1],
            "es",
            {
              sensitivity:"base"
            }
          )
      );

  filters.innerHTML=`

    <button
      class="filter active"
      data-color="todos"
      type="button"
    >
      Todos los colores
    </button>

  `+

  sortedColors.map(
    ([key,color])=>`

      <button
        class="filter"
        data-color="${escapeAttribute(key)}"
        type="button"
      >
        ${escapeHtml(color)}
      </button>

    `
  ).join("");
}

/* =========================
   VISTA
========================= */

function applyView(){

  const isList=
    currentView==="list";

  grid.classList.toggle(
    "list-view",
    isList
  );

  gridViewButton.classList.toggle(
    "active",
    !isList
  );

  listViewButton.classList.toggle(
    "active",
    isList
  );
}

gridViewButton.onclick=function(){

  currentView="grid";

  localStorage.setItem(
    VIEW_KEY,
    currentView
  );

  applyView();
};

listViewButton.onclick=function(){

  currentView="list";

  localStorage.setItem(
    VIEW_KEY,
    currentView
  );

  applyView();
};

/* =========================
   MOSTRAR PRODUCTOS
========================= */

function renderProducts(){

  const query=
    normalize(
      search.value
    );

  clearSearch.classList.toggle(
    "show",
    Boolean(query)
  );

  const visible=
    products.filter(
      product=>{

        const modelText=
          normalize(
            product.modelo
          );

        const categoryText=
          normalize(
            product.categoria
          );

        const colorTexts=
          variants(product)
            .map(
              variant=>
                normalize(
                  variant.color
                )
            );

        const searchOK=
          !query ||
          modelText.includes(
            query
          ) ||
          categoryText.includes(
            query
          ) ||
          colorTexts.some(
            color=>
              color.includes(
                query
              )
          );

        /*
         * Los modelos sin categoría
         * siguen apareciendo en TODOS.
         */

        const categoryOK=
          selectedCategory===
          "todos" ||
          categoryText===
          selectedCategory;

        const colorOK=
          selectedFilter===
          "todos" ||
          colorTexts.includes(
            selectedFilter
          );

        return (
          searchOK &&
          categoryOK &&
          colorOK
        );
      }
    );

  count.textContent=
    visible.length+
    " modelo"+
    (
      visible.length===1
        ?""
        :"s"
    );

  if(!visible.length){

    grid.innerHTML=`
      <div class="state">

        <strong>
          No encontramos modelos.
        </strong>

        <br><br>

        Prueba otra categoría, color o búsqueda.

      </div>
    `;

    return;
  }

  grid.innerHTML=
    visible.map(
      product=>{

        const category=
          formatCategory(
            product.categoria
          );

        return `

          <article class="product-card">

            <a
              class="product-link"
              href="/producto.html?modelo=${encodeURIComponent(product.modelo)}"
            >

              <div class="product-image">

                <img
                  src="${escapeAttribute(cover(product))}"
                  loading="lazy"
                  alt="Modelo ${escapeAttribute(product.modelo)}"
                >

                <span class="badge">
                  DISPONIBLE
                </span>

              </div>

              <div class="product-info">

                <div class="product-title">

                  <h3>
                    Modelo ${escapeHtml(product.modelo)}
                  </h3>

                  <span class="product-arrow">
                    →
                  </span>

                </div>

                ${
                  category
                    ?`
                      <div class="product-category">
                        ${escapeHtml(category)}
                      </div>
                    `
                    :""
                }

                <div class="colors">

                  ${
                    variants(product)
                      .map(
                        variant=>
                          escapeHtml(
                            formatColor(
                              variant.color
                            )
                          )
                      )
                      .join(" · ")
                  }

                </div>

              </div>

            </a>

            <button
              class="quick-add"
              data-model="${escapeAttribute(product.modelo)}"
              type="button"
            >
              + Agregar
            </button>

          </article>

        `;
      }
    ).join("");
}

/* =========================
   EVENTOS CATÁLOGO
========================= */

grid.onclick=
function(event){

  const button=
    event.target.closest(
      ".quick-add"
    );

  if(!button){
    return;
  }

  const product=
    products.find(
      item=>
        String(
          item.modelo
        )===
        String(
          button.dataset.model
        )
    );

  if(product){
    openQuick(product);
  }
};

categories.onclick=
function(event){

  const button=
    event.target.closest(
      ".category-filter"
    );

  if(!button){
    return;
  }

  selectedCategory=
    button.dataset.category;

  document
    .querySelectorAll(
      ".category-filter"
    )
    .forEach(
      item=>
        item.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  /*
   * Al cambiar de categoría,
   * mantenemos el filtro de color.
   */

  renderProducts();
};

filters.onclick=
function(event){

  const button=
    event.target.closest(
      ".filter"
    );

  if(!button){
    return;
  }

  selectedFilter=
    button.dataset.color;

  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      item=>
        item.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  renderProducts();
};

search.oninput=
  renderProducts;

clearSearch.onclick=
function(){

  search.value="";

  renderProducts();

  search.focus();
};

/* =========================
   COMPRA RÁPIDA
========================= */

document.getElementById(
  "sheetColors"
).onclick=
function(event){

  const button=
    event.target.closest(
      ".sheet-color"
    );

  if(!button){
    return;
  }

  quickVariant=
    variants(
      quickProduct
    ).find(
      variant=>
        Number(
          variant.id
        )===
        Number(
          button.dataset.variant
        )
    );

  renderSheetColors();
};

document.getElementById(
  "sheetMinus"
).onclick=
function(){

  quickQty=
    Math.max(
      6,
      quickQty-6
    );

  updateSheetQty();
};

document.getElementById(
  "sheetPlus"
).onclick=
function(){

  quickQty+=6;

  updateSheetQty();
};

document.getElementById(
  "sheetAdd"
).onclick=
function(){

  if(
    !quickProduct ||
    !quickVariant
  ){
    return;
  }

  addItem(
    quickProduct.modelo,
    quickVariant.color,
    quickQty,
    variantCover(
      quickVariant
    )
  );

  closePanels();
};

/* =========================
   CARRITO
========================= */

cartBody.onclick=
function(event){

  const button=
    event.target.closest(
      "[data-action]"
    );

  if(!button){
    return;
  }

  const index=
    Number(
      button.dataset.index
    );

  if(!cart[index]){
    return;
  }

  if(
    button.dataset.action===
    "plus"
  ){

    cart[index].cantidad+=6;
  }

  if(
    button.dataset.action===
    "minus"
  ){

    if(
      cart[index].cantidad<=6
    ){

      cart.splice(
        index,
        1
      );

    }else{

      cart[index].cantidad-=6;
    }
  }

  if(
    button.dataset.action===
    "remove"
  ){

    cart.splice(
      index,
      1
    );
  }

  saveCart();
};

/* =========================
   WHATSAPP
========================= */

function createWhatsAppMessage(
  folio,
  name
){

  const lines=
    cart.map(
      item=>
        item.cantidad+
        " "+
        item.modelo+
        " "+
        formatColor(
          item.color
        )
    );

  return `PEDIDO CAROLA

Folio: ${folio}

${name}

${lines.join("\n")}

Total de pares = ${cartTotal()}`;
}

function openWhatsApp(
  folio,
  name
){

  const message=
    createWhatsAppMessage(
      folio,
      name
    );

  const whatsappURL=
    "https://wa.me/"+
    WHATSAPP_NUMBER+
    "?text="+
    encodeURIComponent(
      message
    );

  window.location.href=
    whatsappURL;
}

/* =========================
   GUARDAR PEDIDO
========================= */

document.getElementById(
  "sendOrder"
).onclick=
async function(){

  const name=
    customerName.value.trim();

  if(!name){

    alert(
      "Escribe el nombre del cliente."
    );

    customerName.focus();

    return;
  }

  if(!cart.length){

    alert(
      "Tu pedido está vacío."
    );

    return;
  }

  const button=
    document.getElementById(
      "sendOrder"
    );

  const originalText=
    button.textContent;

  button.disabled=true;

  try{

    /*
     * 1. TREINTA
     */

    button.textContent=
      "Verificando disponibilidad...";

    const treintaResponse=
      await fetch(
        "/.netlify/functions/treinta?t="+
        Date.now(),
        {
          cache:"no-store"
        }
      );

    const treintaData=
      await treintaResponse.json();

    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){

      throw new Error(
        "No se pudo verificar Treinta"
      );
    }

    const available=
      new Set(
        (
          Array.isArray(
            treintaData.products
          )
            ?treintaData.products
            :[]
        )
        .map(
          product=>
            normalizeModel(
              product.name
            )
        )
      );

    const unavailable=[
      ...new Set(
        cart
          .filter(
            item=>
              !available.has(
                normalizeModel(
                  item.modelo
                )
              )
          )
          .map(
            item=>
              item.modelo
          )
      )
    ];

    if(
      unavailable.length
    ){

      alert(
        "Revisa estos modelos antes de enviar: "+
        unavailable.join(", ")
      );

      return;
    }

    /*
     * 2. HUELLA
     */

    const fingerprint=
      buildOrderFingerprint(
        name,
        cart
      );

    const lastOrder=
      getLastOrder();

    if(
      isRecentDuplicate(
        lastOrder,
        fingerprint
      ) &&
      lastOrder.folio
    ){

      button.textContent=
        "Abriendo WhatsApp...";

      openWhatsApp(
        lastOrder.folio,
        name
      );

      return;
    }

    /*
     * 3. GUARDAR
     */

    button.textContent=
      "Guardando pedido...";

    const orderResponse=
      await fetch(
        "/.netlify/functions/pedidos",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              cliente:
                name,

              items:
                cart.map(
                  item=>({

                    modelo:
                      item.modelo,

                    color:
                      item.color,

                    cantidad:
                      Number(
                        item.cantidad
                      )

                  })
                )

            })
        }
      );

    const orderData=
      await orderResponse.json();

    if(
      !orderResponse.ok ||
      !orderData.success ||
      !orderData.pedido?.folio
    ){

      console.error(
        "Pedido:",
        orderData
      );

      throw new Error(
        orderData.error ||
        "No se pudo guardar el pedido"
      );
    }

    const folio=
      orderData.pedido.folio;

    /*
     * 4. RECORDAR
     */

    saveLastOrder(
      fingerprint,
      folio
    );

    /*
     * 5. WHATSAPP
     */

    button.textContent=
      "Abriendo WhatsApp...";

    openWhatsApp(
      folio,
      name
    );

  }catch(error){

    console.error(error);

    alert(
      "No pudimos guardar el pedido. No se envió para evitar perder el registro. Intenta nuevamente."
    );

  }finally{

    button.disabled=false;

    button.textContent=
      originalText;
  }
};

function showToast(text){

  const toast=
    document.getElementById(
      "toast"
    );

  toast.textContent=
    text;

  toast.classList.add(
    "show"
  );

  setTimeout(
    ()=>{

      toast.classList.remove(
        "show"
      );

    },
    1600
  );
}

/* =========================
   SEGURIDAD HTML
========================= */

function escapeHtml(value){

  return String(value||"")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

function escapeAttribute(value){

  return escapeHtml(
    value
  );
}
