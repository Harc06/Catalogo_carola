<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAROLA | Catálogo</title>

<style>
:root{
  --pink:#f5dce7;
  --pink2:#fff5f8;
  --text:#191919;
  --muted:#858085;
  --border:#eee5e9;
  --dark:#171717;
  --danger:#a32d2d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:#fff}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid #eee}
.header-inner{max-width:1250px;margin:auto;min-height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:900;letter-spacing:7px}
.cart-button{border:0;background:var(--dark);color:white;padding:11px 16px;border-radius:999px;font-weight:800}

.hero{max-width:1250px;margin:auto;padding:35px 20px}
.hero-box{min-height:300px;border-radius:30px;padding:45px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#f7dce8,#fff5f8);position:relative;overflow:hidden}
.hero-box:after{content:"C";position:absolute;right:-20px;top:-100px;font-size:420px;font-weight:900;color:rgba(255,255,255,.5)}
.hero-content{position:relative;z-index:2}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.hero h1{font-size:clamp(42px,7vw,72px);line-height:.95;letter-spacing:-3px;margin:12px 0}
.hero p{color:#655f62;max-width:500px;line-height:1.5}

.catalog{max-width:1250px;margin:auto;padding:25px 20px 90px}
.catalog-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}
.catalog h2{font-size:34px;margin:0}
.muted{color:var(--muted);font-size:14px}
.search{width:100%;padding:16px 18px;border:1px solid var(--border);background:#faf8f9;border-radius:16px;outline:none;font-size:16px}

.filters{display:flex;gap:8px;overflow:auto;padding:16px 0 24px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:none;border:1px solid var(--border);background:white;padding:9px 15px;border-radius:999px;font-weight:700;font-size:13px}
.filter.active{background:#171717;color:white;border-color:#171717}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 18px}
.product-image{position:relative;aspect-ratio:4/5;background:#f6f3f4;border-radius:19px;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);padding:7px 9px;border-radius:999px;font-size:9px;font-weight:900}
.product-info{padding:12px 3px 0}
.product-title{display:flex;justify-content:space-between;align-items:center}
.product-title h3{font-size:16px;margin:0}
.colors{font-size:11px;color:var(--muted);margin-top:6px}
.quick-add{width:100%;margin-top:11px;padding:11px;border:1px solid var(--dark);background:white;border-radius:12px;font-weight:800}
.quick-add:active{background:#171717;color:white}
.state{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted);background:#faf8f9;border-radius:20px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;opacity:0;visibility:hidden;transition:.2s}
.overlay.open{opacity:1;visibility:visible}

.cart{position:fixed;right:0;top:0;bottom:0;width:min(450px,100%);background:white;z-index:501;transform:translateX(105%);transition:.25s;display:flex;flex-direction:column}
.cart.open{transform:translateX(0)}
.cart-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-header h2{margin:0}
.icon-btn{border:0;background:#f5f2f3;width:38px;height:38px;border-radius:50%;font-size:20px}
.cart-body{flex:1;overflow:auto;padding:18px}
.cart-empty{text-align:center;padding:60px 10px;color:var(--muted)}
.cart-item{display:grid;grid-template-columns:75px 1fr;gap:13px;padding:14px 0;border-bottom:1px solid var(--border)}
.cart-thumb{width:75px;height:92px;object-fit:cover;border-radius:11px;background:#f1edef}
.cart-item h4{margin:2px 0 4px}
.cart-color{font-size:12px;color:var(--muted)}
.cart-actions{display:flex;align-items:center;gap:9px;margin-top:10px}
.cart-actions button{width:34px;height:34px;border:1px solid var(--border);background:white;border-radius:9px}
.remove{margin-left:auto!important;width:auto!important;border:0!important;color:var(--danger);font-size:12px}
.cart-footer{padding:18px;border-top:1px solid var(--border);background:#fff}
.cart-total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin-bottom:13px}
.name-input{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;outline:none;margin-bottom:9px}
.send{width:100%;padding:15px;border:0;border-radius:13px;background:#171717;color:white;font-weight:900}
.send:disabled{opacity:.55;cursor:default}
.clear{width:100%;margin-top:10px;border:0;background:white;color:var(--danger);padding:9px}

.sheet{position:fixed;left:50%;bottom:0;z-index:601;width:min(520px,100%);background:white;border-radius:24px 24px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:.25s}
.sheet.open{transform:translate(-50%,0)}
.sheet-handle{width:45px;height:5px;background:#ddd;border-radius:99px;margin:0 auto 18px}
.sheet h2{margin:0 0 5px}
.sheet p{color:var(--muted);margin:0 0 20px}
.sheet-colors{display:flex;flex-wrap:wrap;gap:8px}
.sheet-color{border:1px solid var(--border);background:white;padding:11px 15px;border-radius:999px;font-weight:700}
.sheet-color.active{background:#171717;color:white;border-color:#171717}
.qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:25px 0}
.qty button{width:46px;height:46px;border:1px solid var(--border);background:white;border-radius:12px;font-size:23px}
.qty strong{font-size:24px;min-width:70px;text-align:center}
.sheet-add{width:100%;padding:16px;border:0;background:#171717;color:white;border-radius:14px;font-weight:900}

.toast{position:fixed;left:50%;bottom:25px;z-index:800;transform:translate(-50%,30px);background:#171717;color:white;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;visibility:hidden;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){
  .header-inner{min-height:62px;padding:0 14px}
  .brand{font-size:19px;letter-spacing:5px}
  .cart-button{font-size:11px;padding:9px 12px}
  .hero{padding:15px 14px 25px}
  .hero-box{min-height:270px;padding:25px;border-radius:23px}
  .hero h1{font-size:45px}
  .catalog{padding:20px 14px 70px}
  .catalog h2{font-size:29px}
  .grid{gap:24px 9px}
  .product-image{border-radius:14px}
  .product-title h3{font-size:14px}
  .quick-add{font-size:12px;padding:10px}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<a href="/" class="brand">CAROLA</a>
<button id="cartButton" class="cart-button">Pedido · 0 pares</button>
</div>
</header>

<section class="hero">
<div class="hero-box">
<div class="hero-content">
<span class="eyebrow">Calzado Carola</span>
<h1>Arma tu pedido.</h1>
<p>Selecciona tus modelos y colores. Venta por múltiplos de 6 pares.</p>
</div>
</div>
</section>

<main class="catalog">

<div class="catalog-top">
<div>
<h2>Catálogo</h2>
<div class="muted">Modelos disponibles</div>
</div>
<div id="count" class="muted">Cargando...</div>
</div>

<input id="search" class="search" placeholder="Buscar modelo...">

<div id="filters" class="filters"></div>

<div id="grid" class="grid">
<div class="state">Cargando catálogo...</div>
</div>

</main>

<div id="overlay" class="overlay"></div>

<aside id="cart" class="cart">

<div class="cart-header">
<h2>Tu pedido</h2>
<button id="closeCart" class="icon-btn">×</button>
</div>

<div id="cartBody" class="cart-body"></div>

<div class="cart-footer">

<div class="cart-total">
<span>Total de pares</span>
<span id="total">0</span>
</div>

<input id="customerName" class="name-input" placeholder="Nombre del cliente">

<button id="sendOrder" class="send">
Enviar pedido por WhatsApp
</button>

<button id="clearCart" class="clear">
Vaciar pedido
</button>

</div>

</aside>

<section id="sheet" class="sheet">

<div class="sheet-handle"></div>

<h2 id="sheetTitle">Modelo</h2>

<p>Selecciona color y cantidad</p>

<div id="sheetColors" class="sheet-colors"></div>

<div class="qty">
<button id="sheetMinus">−</button>
<strong id="sheetQty">6</strong>
<button id="sheetPlus">+</button>
</div>

<button id="sheetAdd" class="sheet-add">
Agregar 6 pares
</button>

</section>

<div id="toast" class="toast">
✓ Agregado al pedido
</div>

<script>

const WHATSAPP_NUMBER="524775971996";

const CART_KEY="carola_cart_v2";
const OLD_CART_KEY="carola_cart_v1";
const NAME_KEY="carola_customer_name_v1";

let products=[];
let selectedFilter="todos";
let cart=loadCart();

let quickProduct=null;
let quickVariant=null;
let quickQty=6;

const grid=document.getElementById("grid");
const filters=document.getElementById("filters");
const search=document.getElementById("search");
const count=document.getElementById("count");
const overlay=document.getElementById("overlay");
const cartPanel=document.getElementById("cart");
const cartBody=document.getElementById("cartBody");
const total=document.getElementById("total");
const cartButton=document.getElementById("cartButton");
const customerName=document.getElementById("customerName");
const sheet=document.getElementById("sheet");

customerName.value=localStorage.getItem(NAME_KEY)||"";

function normalize(value){
  return String(value||"")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function normalizeModel(value){
  return normalize(value).replace(/\s+/g," ");
}

function sortImages(images){
  return (images||[]).slice().sort((a,b)=>{
    const order=Number(a.orden||0)-Number(b.orden||0);
    if(order!==0)return order;
    return Number(a.id||0)-Number(b.id||0);
  });
}

function variants(product){
  return Array.isArray(product?.variantes)
    ? product.variantes.filter(
        variant=>Array.isArray(variant.imagenes)&&variant.imagenes.length
      )
    : [];
}

function variantCover(variant){
  return sortImages(variant?.imagenes)[0]?.url||"";
}

function cover(product){
  const variant=variants(product)[0];
  return variant?variantCover(variant):"";
}

/* CARRITO */

function loadCart(){
  try{
    let raw=localStorage.getItem(CART_KEY);

    if(!raw){
      raw=localStorage.getItem(OLD_CART_KEY);
    }

    const data=JSON.parse(raw||"[]");

    if(!Array.isArray(data))return [];

    return data
      .filter(item=>item&&item.modelo&&item.color)
      .map(item=>{
        let cantidad=Number(item.cantidad||6);

        if(!Number.isFinite(cantidad)||cantidad<6){
          cantidad=6;
        }

        cantidad=Math.ceil(cantidad/6)*6;

        return {
          modelo:String(item.modelo),
          color:String(item.color),
          cantidad,
          image:item.image||""
        };
      });

  }catch{
    return [];
  }
}

function saveCart(){
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
  renderCart();
}

function cartTotal(){
  return cart.reduce(
    (sum,item)=>sum+Number(item.cantidad||0),
    0
  );
}

async function repairCartImages(){

  let changed=false;

  for(const item of cart){

    if(item.image)continue;

    const product=products.find(
      product=>
        normalizeModel(product.modelo)===
        normalizeModel(item.modelo)
    );

    if(!product)continue;

    const variant=variants(product).find(
      variant=>
        normalize(variant.color)===
        normalize(item.color)
    );

    if(!variant)continue;

    const image=variantCover(variant);

    if(image){
      item.image=image;
      changed=true;
    }
  }

  if(changed){
    localStorage.setItem(CART_KEY,JSON.stringify(cart));
    renderCart();
  }
}

function addItem(modelo,color,cantidad,image){

  const existing=cart.find(
    item=>
      normalizeModel(item.modelo)===normalizeModel(modelo) &&
      normalize(item.color)===normalize(color)
  );

  if(existing){

    existing.cantidad=
      Number(existing.cantidad)+Number(cantidad);

    if(!existing.image){
      existing.image=image;
    }

  }else{

    cart.push({
      modelo:String(modelo),
      color:String(color),
      cantidad:Number(cantidad),
      image:image||""
    });
  }

  saveCart();

  showToast("✓ "+cantidad+" pares agregados");
}

function renderCart(){

  const pairs=cartTotal();

  total.textContent=pairs;

  cartButton.textContent=
    "Pedido · "+pairs+" pares";

  if(!cart.length){

    cartBody.innerHTML=`
      <div class="cart-empty">
        <strong>Tu pedido está vacío</strong>
        <br><br>
        Agrega modelos del catálogo.
      </div>
    `;

    return;
  }

  cartBody.innerHTML=cart.map((item,index)=>`

    <div class="cart-item">

      ${
        item.image
        ? `
          <img
            class="cart-thumb"
            src="${escapeAttribute(item.image)}"
            alt="Modelo ${escapeAttribute(item.modelo)}"
          >
        `
        : `
          <div class="cart-thumb"></div>
        `
      }

      <div>

        <h4>
          Modelo ${escapeHtml(item.modelo)}
        </h4>

        <div class="cart-color">
          ${escapeHtml(item.color)}
        </div>

        <div class="cart-actions">

          <button data-action="minus" data-index="${index}">
            −
          </button>

          <strong>
            ${Number(item.cantidad)}
          </strong>

          <button data-action="plus" data-index="${index}">
            +
          </button>

          <button
            class="remove"
            data-action="remove"
            data-index="${index}"
          >
            Eliminar
          </button>

        </div>

      </div>

    </div>

  `).join("");
}

function openCart(){

  overlay.classList.add("open");
  cartPanel.classList.add("open");
  sheet.classList.remove("open");

  document.body.style.overflow="hidden";
}

function closePanels(){

  overlay.classList.remove("open");
  cartPanel.classList.remove("open");
  sheet.classList.remove("open");

  document.body.style.overflow="";
}

/* COMPRA RÁPIDA */

function openQuick(product){

  quickProduct=product;
  quickVariant=variants(product)[0];
  quickQty=6;

  document.getElementById("sheetTitle").textContent=
    "Modelo "+product.modelo;

  renderSheetColors();
  updateSheetQty();

  overlay.classList.add("open");
  sheet.classList.add("open");
  cartPanel.classList.remove("open");

  document.body.style.overflow="hidden";
}

function renderSheetColors(){

  document.getElementById("sheetColors").innerHTML=
    variants(quickProduct).map(variant=>`

      <button
        class="sheet-color ${
          Number(variant.id)===Number(quickVariant.id)
            ?"active"
            :""
        }"
        data-variant="${Number(variant.id)}"
      >
        ${escapeHtml(variant.color)}
      </button>

    `).join("");
}

function updateSheetQty(){

  document.getElementById("sheetQty").textContent=
    quickQty;

  document.getElementById("sheetAdd").textContent=
    "Agregar "+quickQty+" pares";
}

/* CARGAR PRODUCTOS */

async function loadProducts(){

  try{

    const [supabaseResponse,treintaResponse]=
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t="+Date.now(),
          {cache:"no-store"}
        ),

        fetch(
          "/.netlify/functions/treinta?t="+Date.now(),
          {cache:"no-store"}
        )

      ]);

    const supabaseData=
      await supabaseResponse.json();

    const treintaData=
      await treintaResponse.json();

    const available=new Set(
      (
        Array.isArray(treintaData.products)
          ?treintaData.products
          :[]
      ).map(
        product=>normalizeModel(product.name)
      )
    );

    products=
      (
        Array.isArray(supabaseData.productos)
          ?supabaseData.productos
          :[]
      )
      .filter(
        product=>
          available.has(
            normalizeModel(product.modelo)
          )
      )
      .filter(product=>cover(product))
      .sort((a,b)=>
        String(a.modelo).localeCompare(
          String(b.modelo),
          undefined,
          {
            numeric:true,
            sensitivity:"base"
          }
        )
      );

    buildFilters();
    renderProducts();

    await repairCartImages();

    const params=
      new URLSearchParams(
        window.location.search
      );

    if(params.get("carrito")==="1"){

      openCart();

      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

  }catch(error){

    console.error(error);

    grid.innerHTML=`
      <div class="state">
        No pudimos cargar el catálogo.
      </div>
    `;
  }
}

/* FILTROS */

function buildFilters(){

  const colors=new Map();

  products.forEach(product=>{

    variants(product).forEach(variant=>{

      const key=
        normalize(variant.color);

      if(!colors.has(key)){
        colors.set(
          key,
          variant.color
        );
      }
    });
  });

  filters.innerHTML=`

    <button
      class="filter active"
      data-color="todos"
    >
      Todos
    </button>

  `+

  [...colors.entries()].map(([key,color])=>`

    <button
      class="filter"
      data-color="${escapeAttribute(key)}"
    >
      ${escapeHtml(color)}
    </button>

  `).join("");
}

function renderProducts(){

  const query=
    normalize(search.value);

  const visible=
    products.filter(product=>{

      const searchOK=
        !query ||
        normalize(product.modelo).includes(query);

      const colorOK=
        selectedFilter==="todos" ||
        variants(product).some(
          variant=>
            normalize(variant.color)===
            selectedFilter
        );

      return searchOK&&colorOK;
    });

  count.textContent=
    visible.length+
    " modelo"+
    (visible.length===1?"":"s");

  if(!visible.length){

    grid.innerHTML=`
      <div class="state">
        No encontramos modelos.
      </div>
    `;

    return;
  }

  grid.innerHTML=
    visible.map(product=>`

      <article>

        <a
          href="/producto.html?modelo=${encodeURIComponent(product.modelo)}"
        >

          <div class="product-image">

            <img
              src="${escapeAttribute(cover(product))}"
              loading="lazy"
              alt="Modelo ${escapeAttribute(product.modelo)}"
            >

            <span class="badge">
              DISPONIBLE
            </span>

          </div>

          <div class="product-info">

            <div class="product-title">

              <h3>
                Modelo ${escapeHtml(product.modelo)}
              </h3>

              <span>→</span>

            </div>

            <div class="colors">

              ${
                variants(product)
                  .map(
                    variant=>
                      escapeHtml(
                        variant.color
                      )
                  )
                  .join(" · ")
              }

            </div>

          </div>

        </a>

        <button
          class="quick-add"
          data-model="${escapeAttribute(product.modelo)}"
        >
          + Agregar
        </button>

      </article>

    `).join("");
}

/* EVENTOS CATÁLOGO */

grid.onclick=function(event){

  const button=
    event.target.closest(".quick-add");

  if(!button)return;

  const product=
    products.find(
      item=>
        String(item.modelo)===
        String(button.dataset.model)
    );

  if(product){
    openQuick(product);
  }
};

filters.onclick=function(event){

  const button=
    event.target.closest(".filter");

  if(!button)return;

  selectedFilter=
    button.dataset.color;

  document
    .querySelectorAll(".filter")
    .forEach(
      item=>
        item.classList.remove("active")
    );

  button.classList.add("active");

  renderProducts();
};

search.oninput=renderProducts;

/* EVENTOS COMPRA RÁPIDA */

document.getElementById("sheetColors").onclick=
function(event){

  const button=
    event.target.closest(".sheet-color");

  if(!button)return;

  quickVariant=
    variants(quickProduct).find(
      variant=>
        Number(variant.id)===
        Number(button.dataset.variant)
    );

  renderSheetColors();
};

document.getElementById("sheetMinus").onclick=
function(){

  quickQty=
    Math.max(
      6,
      quickQty-6
    );

  updateSheetQty();
};

document.getElementById("sheetPlus").onclick=
function(){

  quickQty+=6;

  updateSheetQty();
};

document.getElementById("sheetAdd").onclick=
function(){

  if(
    !quickProduct ||
    !quickVariant
  )return;

  addItem(
    quickProduct.modelo,
    quickVariant.color,
    quickQty,
    variantCover(quickVariant)
  );

  closePanels();
};

/* EVENTOS CARRITO */

cartBody.onclick=function(event){

  const button=
    event.target.closest("[data-action]");

  if(!button)return;

  const index=
    Number(button.dataset.index);

  if(!cart[index])return;

  if(button.dataset.action==="plus"){
    cart[index].cantidad+=6;
  }

  if(button.dataset.action==="minus"){

    if(cart[index].cantidad<=6){
      cart.splice(index,1);
    }else{
      cart[index].cantidad-=6;
    }
  }

  if(button.dataset.action==="remove"){
    cart.splice(index,1);
  }

  saveCart();
};

cartButton.onclick=openCart;

document.getElementById("closeCart").onclick=
  closePanels;

overlay.onclick=closePanels;

/* NOMBRE */

customerName.oninput=function(){

  localStorage.setItem(
    NAME_KEY,
    customerName.value
  );
};

/* VACIAR */

document.getElementById("clearCart").onclick=
function(){

  if(!cart.length)return;

/* =========================
   GUARDAR + WHATSAPP
========================= */

document.getElementById("sendOrder").onclick=
async function(){

  const name=
    customerName.value.trim();

  if(!name){

    alert(
      "Escribe el nombre del cliente."
    );

    customerName.focus();

    return;
  }

  if(!cart.length){

    alert(
      "Tu pedido está vacío."
    );

    return;
  }

  const button=
    document.getElementById("sendOrder");

  const originalText=
    button.textContent;

  button.disabled=true;

  try{

    /* 1. VERIFICAR TREINTA */

    button.textContent=
      "Verificando disponibilidad...";

    const treintaResponse=
      await fetch(
        "/.netlify/functions/treinta?t="+Date.now(),
        {cache:"no-store"}
      );

    const treintaData=
      await treintaResponse.json();

    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){
      throw new Error(
        "No se pudo verificar Treinta"
      );
    }

    const available=
      new Set(
        (
          Array.isArray(treintaData.products)
            ?treintaData.products
            :[]
        ).map(
          product=>
            normalizeModel(
              product.name
            )
        )
      );

    const unavailable=[
      ...new Set(
        cart
          .filter(
            item=>
              !available.has(
                normalizeModel(
                  item.modelo
                )
              )
          )
          .map(item=>item.modelo)
      )
    ];

    if(unavailable.length){

      alert(
        "Revisa estos modelos antes de enviar: "+
        unavailable.join(", ")
      );

      return;
    }

    /* 2. GUARDAR EN SUPABASE */

    button.textContent=
      "Guardando pedido...";

    const orderResponse=
      await fetch(
        "/.netlify/functions/pedidos",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            cliente:name,

            items:cart.map(
              item=>({
                modelo:item.modelo,
                color:item.color,
                cantidad:Number(
                  item.cantidad
                )
              })
            )
          })
        }
      );

    const orderData=
      await orderResponse.json();

    if(
      !orderResponse.ok ||
      !orderData.success ||
      !orderData.pedido?.folio
    ){

      console.error(
        "Pedido:",
        orderData
      );

      throw new Error(
        orderData.error ||
        "No se pudo guardar el pedido"
      );
    }

    const folio=
      orderData.pedido.folio;

    /* 3. CREAR MENSAJE */

    const lines=
      cart.map(
        item=>
          item.cantidad+
          " "+
          item.modelo+
          " "+
          item.color
      );

    const message=
`PEDIDO CAROLA

Folio: ${folio}

${name}

${lines.join("\n")}

Total de pares = ${cartTotal()}`;

    /* 4. ABRIR WHATSAPP */

    button.textContent=
      "Abriendo WhatsApp...";

    const whatsappURL=
      "https://wa.me/"+
      WHATSAPP_NUMBER+
      "?text="+
      encodeURIComponent(
        message
      );

    window.location.href=
      whatsappURL;

  }catch(error){

    console.error(error);

    alert(
      "No pudimos guardar el pedido. No se envió para evitar perder el registro. Intenta nuevamente."
    );

  }finally{

    button.disabled=false;

    button.textContent=
      originalText;
  }
};

/* TOAST */

function showToast(text){

  const toast=
    document.getElementById("toast");

  toast.textContent=text;

  toast.classList.add("show");

  setTimeout(
    ()=>{
      toast.classList.remove("show");
    },
    1600
  );
}

/* SEGURIDAD HTML */

function escapeHtml(value){

  return String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttribute(value){
  return escapeHtml(value);
}

loadProducts();

</script>

</body>
