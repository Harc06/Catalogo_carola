<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>CAROLA | Catálogo</title>
<meta name="description" content="Catálogo de Calzado Carola. Conoce nuestros modelos y colores disponibles.">

<style>
:root{
  --pink:#f5dce7;
  --pink2:#fff5f8;
  --pink3:#e8b8cc;
  --text:#191919;
  --muted:#858085;
  --white:#fff;
  --border:#eee5e9;
  --dark:#171717;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,.05);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  height:72px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:7px;
}

.header-link{
  font-size:14px;
  font-weight:700;
  padding:10px 15px;
  border-radius:999px;
  background:var(--pink2);
}

/* HERO */

.hero{
  max-width:1250px;
  margin:0 auto;
  padding:70px 24px 45px;
}

.hero-box{
  min-height:360px;
  border-radius:32px;
  padding:55px;
  display:flex;
  align-items:flex-end;
  background:
    radial-gradient(circle at 85% 15%,#fff 0,transparent 30%),
    linear-gradient(135deg,#f7dce8,#fff4f8);
  overflow:hidden;
  position:relative;
}

.hero-box::after{
  content:"C";
  position:absolute;
  right:-25px;
  top:-85px;
  font-size:420px;
  line-height:1;
  font-weight:900;
  color:rgba(255,255,255,.45);
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:610px;
}

.eyebrow{
  display:inline-block;
  margin-bottom:17px;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hero h1{
  margin:0;
  font-size:clamp(42px,7vw,78px);
  line-height:.95;
  letter-spacing:-3px;
}

.hero p{
  max-width:500px;
  margin:22px 0 0;
  color:#625c60;
  font-size:17px;
  line-height:1.55;
}

.hero-button{
  display:inline-flex;
  margin-top:28px;
  padding:14px 22px;
  border-radius:999px;
  background:var(--dark);
  color:#fff;
  font-weight:700;
}

/* CATÁLOGO */

.catalog{
  max-width:1250px;
  margin:auto;
  padding:35px 24px 100px;
}

.catalog-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:25px;
  margin-bottom:28px;
}

.catalog-top h2{
  margin:0;
  font-size:35px;
  letter-spacing:-1.5px;
}

.catalog-top p{
  margin:7px 0 0;
  color:var(--muted);
}

.product-count{
  color:var(--muted);
  font-size:14px;
}

/* BUSCADOR */

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box input{
  width:100%;
  border:1px solid var(--border);
  outline:none;
  background:#faf8f9;
  padding:17px 20px 17px 48px;
  border-radius:17px;
  font-size:16px;
}

.search-box input:focus{
  border-color:var(--pink3);
  background:#fff;
}

.search-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  opacity:.5;
}

/* FILTROS */

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:0 0 25px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filter{
  flex:none;
  border:1px solid var(--border);
  background:#fff;
  padding:10px 17px;
  border-radius:999px;
  font-size:14px;
  font-weight:650;
}

.filter.active{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

/* PRODUCTOS */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px 18px;
}

.product{
  display:block;
  min-width:0;
}

.image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:4/5;
  border-radius:20px;
  overflow:hidden;
  background:#f7f4f5;
}

.product img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .45s ease;
}

.product:hover img{
  transform:scale(1.025);
}

.available{
  position:absolute;
  top:13px;
  left:13px;
  padding:7px 10px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.5px;
}

.product-info{
  padding:13px 4px 0;
}

.product-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product h3{
  margin:0;
  font-size:17px;
}

.arrow{font-size:18px}

.colors{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  min-height:20px;
  flex-wrap:wrap;
}

.color-chip{
  font-size:12px;
  color:var(--muted);
}

.color-separator{
  color:#d1c7cb;
}

/* ESTADOS */

.state{
  grid-column:1/-1;
  padding:70px 20px;
  text-align:center;
  border-radius:22px;
  background:#faf8f9;
  color:var(--muted);
}

.loader{
  width:28px;
  height:28px;
  margin:0 auto 15px;
  border:3px solid #eadde3;
  border-top-color:#222;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* FOOTER */

footer{
  border-top:1px solid var(--border);
  padding:45px 24px;
  text-align:center;
}

.footer-brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:6px;
}

footer p{
  margin:12px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* RESPONSIVE */

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero-box{
    min-height:330px;
    padding:38px;
  }
}

@media(max-width:520px){
  .header-inner{
    height:64px;
    padding:0 17px;
  }

  .brand{
    font-size:20px;
    letter-spacing:5px;
  }

  .header-link{
    font-size:12px;
  }

  .hero{
    padding:18px 14px 30px;
  }

  .hero-box{
    min-height:320px;
    padding:30px 24px;
    border-radius:25px;
  }

  .hero h1{
    font-size:48px;
    letter-spacing:-2px;
  }

  .hero p{
    font-size:15px;
  }

  .catalog{
    padding:30px 14px 75px;
  }

  .catalog-top{
    align-items:flex-start;
    flex-direction:column;
    gap:8px;
  }

  .catalog-top h2{
    font-size:29px;
  }

  .grid{
    gap:25px 10px;
  }

  .image-wrap{
    border-radius:15px;
  }

  .product h3{
    font-size:15px;
  }

  .colors{
    gap:4px;
  }

  .color-chip{
    font-size:11px;
  }

  .available{
    font-size:9px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">CAROLA</a>
    <a href="#catalogo" class="header-link">Ver catálogo</a>
  </div>
</header>

<section class="hero">
  <div class="hero-box">
    <div class="hero-content">

      <span class="eyebrow">
        Calzado Carola
      </span>

      <h1>
        Encuentra<br>
        tu próximo par.
      </h1>

      <p>
        Explora nuestros modelos y descubre los colores
        disponibles actualmente.
      </p>

      <a href="#catalogo" class="hero-button">
        Explorar modelos ↓
      </a>

    </div>
  </div>
</section>

<main class="catalog" id="catalogo">

  <div class="catalog-top">
    <div>
      <h2>Catálogo</h2>
      <p>Modelos disponibles</p>
    </div>

    <div id="productCount" class="product-count">
      Cargando...
    </div>
  </div>

  <div class="search-box">

    <span class="search-icon">⌕</span>

    <input
      id="search"
      type="search"
      placeholder="Buscar modelo..."
      autocomplete="off"
    >

  </div>

  <div id="filters" class="filters"></div>

  <div id="grid" class="grid">
    <div class="state">
      <div class="loader"></div>
      Cargando catálogo...
    </div>
  </div>

</main>

<footer>
  <div class="footer-brand">CAROLA</div>
  <p>Envíos a todo México · Entregas en León, Gto.</p>
</footer>

<script>

let allProducts = [];
let selectedColor = "todos";

const grid =
  document.getElementById("grid");

const filters =
  document.getElementById("filters");

const search =
  document.getElementById("search");

const productCount =
  document.getElementById("productCount");


/* NORMALIZACIÓN */

function normalize(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}


/* NORMALIZAR MODELO */

function normalizeModel(value){

  const text = normalize(value);

  const match =
    text.match(/[a-z]*\s*\d+[a-z]*/i);

  if(match){
    return match[0]
      .replace(/\s+/g,"");
  }

  return text;
}


/* VARIANTES CON FOTOS */

function getVariants(product){

  return Array.isArray(product.variantes)
    ? product.variantes.filter(
        variant =>
          Array.isArray(variant.imagenes) &&
          variant.imagenes.length
      )
    : [];
}


/* ORDENAR FOTOS */

function sortImages(images){

  return images
    .slice()
    .sort((a,b) => {

      const order =
        Number(a.orden || 0) -
        Number(b.orden || 0);

      if(order !== 0){
        return order;
      }

      return (
        Number(a.id || 0) -
        Number(b.id || 0)
      );
    });
}


/* FOTO PRINCIPAL */

function getCover(product){

  const variants =
    getVariants(product);

  for(const variant of variants){

    const images =
      sortImages(variant.imagenes);

    if(images.length){
      return images[0].url;
    }
  }

  return "";
}


/* COLORES */

function getColors(product){

  return getVariants(product)
    .map(variant => variant.color)
    .filter(Boolean);
}


/* CARGAR CATÁLOGO */

async function loadCatalog(){

  try{

    const [
      supabaseResponse,
      treintaResponse
    ] =
      await Promise.all([

        fetch(
          "/.netlify/functions/supabase?t=" +
          Date.now(),
          {
            cache:"no-store"
          }
        ),

        fetch(
          "/.netlify/functions/treinta?t=" +
          Date.now(),
          {
            cache:"no-store"
          }
        )

      ]);


    const supabaseData =
      await supabaseResponse.json();

    const treintaData =
      await treintaResponse.json();


    if(
      !supabaseResponse.ok ||
      !supabaseData.success
    ){
      throw new Error(
        "No se pudo cargar la información de los modelos."
      );
    }


    if(
      !treintaResponse.ok ||
      !treintaData.success
    ){
      throw new Error(
        "No se pudo comprobar la disponibilidad."
      );
    }


    /*
     * IMPORTANTE:
     *
     * Supabase devuelve:
     * productos
     *
     * Treinta devuelve:
     * products
     */

    const treintaProducts =
      Array.isArray(treintaData.products)
        ? treintaData.products
        : [];


    const availableModels =
      new Set(
        treintaProducts.map(
          item =>
            normalizeModel(item.name)
        )
      );


    const supabaseProducts =
      Array.isArray(supabaseData.productos)
        ? supabaseData.productos
        : [];


    allProducts =
      supabaseProducts

        /*
         * SOLO SI EXISTE
         * EN TREINTA
         */

        .filter(product =>
          availableModels.has(
            normalizeModel(
              product.modelo
            )
          )
        )

        /*
         * SOLO SI TIENE FOTO
         */

        .filter(product =>
          Boolean(
            getCover(product)
          )
        )

        /*
         * ORDEN NUMÉRICO
         */

        .sort((a,b) =>
          String(a.modelo)
            .localeCompare(
              String(b.modelo),
              undefined,
              {
                numeric:true,
                sensitivity:"base"
              }
            )
        );


    buildFilters();

    renderProducts();


  }catch(error){

    console.error(error);

    productCount.textContent = "";

    grid.innerHTML = `
      <div class="state">
        No pudimos cargar el catálogo en este momento.
        <br><br>
        Intenta nuevamente.
      </div>
    `;
  }
}


/* CREAR FILTROS */

function buildFilters(){

  const map =
    new Map();


  allProducts.forEach(
    product => {

      getColors(product)
        .forEach(color => {

          const key =
            normalize(color);

          /*
           * Coñac y conac
           * se consideran iguales.
           */

          if(!map.has(key)){
            map.set(
              key,
              color
            );
          }

        });
    }
  );


  const colorList =
    Array.from(
      map.entries()
    )
    .sort((a,b) =>
      a[1].localeCompare(
        b[1],
        "es",
        {
          sensitivity:"base"
        }
      )
    );


  let html = `
    <button
      class="filter active"
      data-color="todos"
      type="button"
    >
      Todos
    </button>
  `;


  colorList.forEach(
    ([key,label]) => {

      html += `
        <button
          class="filter"
          data-color="${escapeAttribute(key)}"
          type="button"
        >
          ${escapeHtml(label)}
        </button>
      `;

    }
  );


  filters.innerHTML =
    html;
}


/* MOSTRAR PRODUCTOS */

function renderProducts(){

  const query =
    normalize(
      search.value
    );


  const visible =
    allProducts.filter(
      product => {

        const matchesSearch =
          !query ||
          normalize(
            product.modelo
          ).includes(query);


        const matchesColor =
          selectedColor === "todos" ||

          getColors(product)
            .some(color =>
              normalize(color) ===
              selectedColor
            );


        return (
          matchesSearch &&
          matchesColor
        );
      }
    );


  productCount.textContent =
    visible.length === 1
      ? "1 modelo"
      : visible.length +
        " modelos";


  if(!visible.length){

    grid.innerHTML = `
      <div class="state">
        No encontramos modelos
        con esos filtros.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    visible
      .map(product => {

        const cover =
          getCover(product);

        const colors =
          getColors(product);


        const colorsHtml =
          colors
            .map(
              (color,index) => `

                ${
                  index
                    ? '<span class="color-separator">·</span>'
                    : ""
                }

                <span class="color-chip">
                  ${escapeHtml(color)}
                </span>

              `
            )
            .join("");


        return `

          <a
            class="product"
            href="/producto.html?modelo=${encodeURIComponent(product.modelo)}"
          >

            <div class="image-wrap">

              <img
                src="${escapeAttribute(cover)}"
                alt="Modelo ${escapeAttribute(product.modelo)}"
                loading="lazy"
              >

              <span class="available">
                DISPONIBLE
              </span>

            </div>


            <div class="product-info">

              <div class="product-row">

                <h3>
                  Modelo ${escapeHtml(product.modelo)}
                </h3>

                <span class="arrow">
                  →
                </span>

              </div>


              <div class="colors">
                ${colorsHtml}
              </div>

            </div>

          </a>

        `;

      })
      .join("");
}


/* FILTROS */

filters.onclick =
  function(event){

    const button =
      event.target.closest(
        ".filter"
      );

    if(!button){
      return;
    }


    selectedColor =
      button.dataset.color ||
      "todos";


    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        item =>
          item.classList.remove(
            "active"
          )
      );


    button.classList.add(
      "active"
    );


    renderProducts();
  };


/* BUSCADOR */

search.addEventListener(
  "input",
  renderProducts
);


/* SEGURIDAD HTML */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeAttribute(value){
  return escapeHtml(value);
}


/* INICIAR */

loadCatalog();

</script>

</body>
</html>
